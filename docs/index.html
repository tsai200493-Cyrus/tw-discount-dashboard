<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打折窗口溫度計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* 2026-10 改版（草稿 C3「一根溫度計」定案）：視覺語言借自需求人的履歷站——
     首屏整片色調＝大盤溫度（貪婪紅／中性綠／恐慌藍）、白色單線溫度計、靜止噪點＋緩慢遊走光＋光追滑鼠；
     首屏以下不墊白卡，直接排在色調淡霧上、細線分隔。
     顏色分工：首屏色調＝大盤情緒；藍／橘＝貴不貴（圖表、位階尺）；紅漲綠跌只講股價。 */
  @property --tone{syntax:'<color>';inherits:true;initial-value:#c63c2d}
  :root{
    --bg0:#f2f3f5; --ink:#11141b; --ink2:#464c58; --ink3:#767c88; --hair:#d9dce3;
    --t-greed:#c63c2d; --t-mid:#14886c; --t-fear:#2654c6;
    --tone:var(--t-greed);
    --bg:color-mix(in srgb,var(--tone) 6%,var(--bg0));
    --hair2:color-mix(in srgb,var(--tone) 14%,var(--hair));
    /* 圖表浮窗、名詞浮層沿用的舊名字 */
    --panel:#ffffff; --line:var(--hair); --muted:var(--ink3); --track:#e6e8ec; --accent:var(--ink);
    --open:#2a63b8; --half:#a8792a; --shut:#c95f35; --ramp-mid:#cdb27a; --dream:#8a8478;
    --cool:#3a6a7a; --up:#c63c2d; --down:#14886c; --barbg:#e4e6ea;
    --disp:"Space Grotesk","Noto Sans TC","Microsoft JhengHei",sans-serif;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    --serif:var(--disp);
    --ease:cubic-bezier(.2,.7,.1,1);
    transition:--tone 2.4s ease;
  }
  @media (prefers-color-scheme:dark){ :root{
    --bg0:#0f1115; --ink:#eceef2; --ink2:#b4b9c3; --ink3:#7d8390; --hair:#262a32;
    --bg:color-mix(in srgb,var(--tone) 9%,var(--bg0));
    --panel:#181b21; --track:#22262d; --open:#74a6e8; --half:#d2a95a; --shut:#e5875d; --ramp-mid:#b89c62;
    --cool:#6fa3b5; --up:#ef6b5f; --down:#4fbf86; --barbg:#22262d; } }
  *{box-sizing:border-box}
  html,body{margin:0}
  html{scroll-padding-top:24px}
  body{background:var(--bg);color:var(--ink);font:400 15px/1.7 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:clip}
  .n{font-family:var(--disp);font-variant-numeric:tabular-nums}
  .lbl{font:600 11.5px var(--disp);letter-spacing:.22em;text-transform:uppercase}
  .label{font-size:.76rem;color:var(--muted)}
  .err{color:var(--shut);font-weight:600}
  button,input{font-family:inherit}
  .amb{position:fixed;inset:0;z-index:-2;pointer-events:none;background-image:var(--noise);opacity:.16;mix-blend-mode:multiply}
  @media (prefers-color-scheme:dark){ .amb{mix-blend-mode:screen;opacity:.08} }

  /* 名詞（點了看白話）／營收圖／大盤圖的連結 */
  .term,.chartlink,.mklink{position:relative;border-bottom:1px dashed currentColor;cursor:pointer}
  .term::before,.chartlink::before,.mklink::before{content:"";position:absolute;left:-5px;right:-5px;top:-10px;bottom:-10px}
  .term::after{content:"";display:inline-block;width:.74em;height:.74em;margin-left:2px;vertical-align:.16em;opacity:.55;background:currentColor;
    -webkit-mask:var(--ic-info) center/contain no-repeat;mask:var(--ic-info) center/contain no-repeat}
  .mklink{opacity:.85}
  .mklink::after{content:"";display:inline-block;width:1em;height:1em;margin-left:4px;vertical-align:-.14em;background:currentColor;
    -webkit-mask:var(--ic-line) center/contain no-repeat;mask:var(--ic-line) center/contain no-repeat}
  .nolink{border-bottom:0!important}
  .nolink::before,.nolink::after{content:none!important}

  /* ════ 首屏：色調舞台 ════ */
  .hero,.band{position:relative;color:#fff;overflow:hidden;isolation:isolate}
  .hero{background:radial-gradient(120% 90% at 85% 0%, color-mix(in srgb,var(--tone) 70%,#fff) 0%, transparent 55%),
      radial-gradient(90% 80% at 0% 100%, color-mix(in srgb,var(--tone) 55%,#000) 0%, transparent 60%), var(--tone)}
  .band{background:radial-gradient(100% 120% at 100% 100%, color-mix(in srgb,var(--tone) 65%,#fff) 0%, transparent 55%), var(--tone)}
  .hero::before,.band::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(420px circle at var(--mx,78%) var(--my,22%), rgba(255,255,255,.22), transparent 70%)}
  /* 噪點靜止（需求人 10-15：跳動的顆粒像畫面在晃）；動態交給下面緩慢遊走的光 */
  .grain{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.7;background-image:var(--noise)}
  /* 緩慢無限循環：一亮一暗＋一團暖光，18／24／30 秒錯開；位移用光團自身大小的 %，窄螢幕也看得出來 */
  .drift{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
  .drift i{position:absolute;width:75vmax;height:75vmax;border-radius:50%;will-change:transform}
  .drift i:nth-child(1){left:-30%;top:-35%;background:radial-gradient(closest-side,rgba(255,255,255,.42),rgba(255,255,255,.12) 55%,transparent);animation:d1 18s ease-in-out infinite}
  .drift i:nth-child(2){left:30%;top:20%;background:radial-gradient(closest-side,rgba(0,0,0,.32),rgba(0,0,0,.08) 60%,transparent);animation:d2 24s ease-in-out infinite}
  .drift i:nth-child(3){left:40%;top:-40%;width:55vmax;height:55vmax;background:radial-gradient(closest-side,color-mix(in srgb,var(--tone) 35%,#ffe9c7),transparent);opacity:.55;animation:d3 30s ease-in-out infinite}
  @keyframes d1{0%,100%{transform:translate(0,0)}25%{transform:translate(45%,30%)}50%{transform:translate(85%,10%)}75%{transform:translate(35%,-10%)}}
  @keyframes d2{0%,100%{transform:translate(0,0)}30%{transform:translate(-55%,-25%)}60%{transform:translate(-20%,25%)}80%{transform:translate(20%,10%)}}
  @keyframes d3{0%,100%{transform:translate(0,0)}35%{transform:translate(-70%,60%)}70%{transform:translate(-20%,110%)}}
  @media (prefers-reduced-motion:reduce){ :root{transition:none} .drift i{animation:none} }

  .top{display:flex;align-items:center;gap:12px;height:56px;padding:0 20px;max-width:1240px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:9px;margin:0;font:700 15px var(--sans);letter-spacing:.14em;white-space:nowrap}
  .brand svg{width:18px;height:18px}
  .top .date{font:500 11px var(--disp);letter-spacing:.2em;opacity:.75}
  @media (max-width:420px){ .brand{letter-spacing:.06em} .top .date{display:none} }
  .sp{flex:1}
  .ib{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
  .ib:hover{background:rgba(255,255,255,.14)}
  .ib svg{width:15px;height:15px}
  .stage{max-width:1240px;margin:0 auto;padding:18px 20px 40px;display:grid;gap:18px}
  @media (min-width:980px){ .stage{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;padding:44px 40px 56px;align-items:center} }
  .kick{opacity:.8}
  .kick::before,.band .lbl::before{content:"";display:inline-block;width:22px;height:2px;background:#fff;vertical-align:4px;margin-right:10px}
  .verdict{margin:14px 0 10px;font:900 clamp(32px,8.6vw,64px)/1.14 var(--sans);letter-spacing:.04em;text-wrap:balance}
  .verdict .dim{opacity:.62}
  .lead{font-size:clamp(14.5px,1.25vw,16.5px);line-height:1.85;max-width:30em;opacity:.92;margin:0}
  .lead b{font-weight:700}
  .mk{display:flex;align-items:flex-end;gap:18px;margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.28)}
  .mk .big{font:600 clamp(52px,7vw,84px)/.86 var(--disp);letter-spacing:-.02em}
  .mk .side{flex:1;min-width:0;padding-bottom:4px}
  .mk .tag{font:700 15px var(--sans);letter-spacing:.06em;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
  .mk .tag .term{font-weight:500;font-size:12.5px;opacity:.85}
  .mk .rule{position:relative;height:16px;margin-top:10px}
  .mk .rule::before{content:"";position:absolute;left:0;right:0;top:8px;height:1px;background:rgba(255,255,255,.55)}
  .mk .rule i{position:absolute;top:2px;width:1px;height:12px;background:rgba(255,255,255,.55)}
  .mk .rule b{position:absolute;top:0;width:3px;height:16px;background:#fff;transform:translateX(-50%);border-radius:2px}
  .mk .ends{display:flex;justify-content:space-between;font:500 10.5px var(--disp);letter-spacing:.16em;opacity:.7;margin-top:2px}
  .stats{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:12px;font-size:12.5px;opacity:.85}
  .stats b{font-family:var(--disp);font-weight:600}
  .stats.sm{margin-top:4px;font-size:12px;opacity:.7}
  .delta{font:600 .72em var(--disp);margin-left:4px;vertical-align:super;font-variant-numeric:tabular-nums}
  .delta.up{color:var(--open)} .delta.down{color:var(--shut)} .delta.flat{color:var(--muted);font-weight:400}
  .hero .delta{color:#fff!important;opacity:.85}
  /* 今日變化：首屏上白字 */
  .movers{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 12px;margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2);font-size:12.5px}
  .movers .mv-t{font:600 11px var(--disp);letter-spacing:.18em}
  .movers .mv-t .ic{display:none}
  .movers b,.movers b.up,.movers b.down{font-family:var(--disp);font-weight:600;color:#fff}
  .movers .label{color:#fff;opacity:.65}
  /* 比較區間：近 5 年／客製 */
  .modesw{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:16px}
  .modesw .ms-t{font-size:11.5px;opacity:.75;margin-right:4px}
  .modesw button{font:500 12px var(--sans);color:#fff;background:transparent;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:5px 12px;cursor:pointer;letter-spacing:.06em}
  .modesw button.on{background:#fff;color:var(--tone);border-color:#fff}
  .modesw .ms-n{font-size:11px;opacity:.65;margin-left:4px}
  #thermo{display:block;width:100%;height:auto;overflow:visible;max-width:520px;margin:0 auto}
  #thermo text{font-family:var(--sans)} #thermo .num{font-family:var(--disp)}
  #thermo .lb{cursor:pointer} #thermo .lb:hover .nm{text-decoration:underline}

  /* ════ 側邊導覽：縮小的溫度計 ════ */
  #rail{position:fixed;z-index:30;opacity:0;pointer-events:none;transition:opacity .5s var(--ease),transform .5s var(--ease)}
  #rail.on{opacity:1;pointer-events:auto}
  #rail .cur{font:700 13px var(--sans);letter-spacing:.06em;white-space:nowrap}
  #rail .cur b{font:600 13px var(--disp);color:var(--tone);margin-left:6px}
  #rail .dot{position:absolute;border-radius:50%;background:var(--ink3);cursor:pointer;transition:all .35s var(--ease)}
  #rail .dot.now{background:var(--tone);box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--tone)}
  #rail .dot.seen{background:var(--ink)}
  @media (min-width:1180px){
    #rail{left:26px;top:50%;width:150px;height:62vh;transform:translate(-8px,-50%)}
    #rail.on{transform:translate(0,-50%)}
    #rail .tube{position:absolute;left:0;top:0;bottom:0;width:10px;border:1.3px solid var(--ink3);border-radius:6px}
    #rail .win{position:absolute;left:0;width:10px;background:var(--tone);opacity:.9}
    #rail .tick{position:absolute;left:-6px;width:22px;height:1px;background:var(--ink3)}
    #rail .tick.l65{background:var(--tone);height:1.5px}
    #rail .dot{left:1.5px;width:7px;height:7px;transform:translateY(-50%)}
    #rail .cur{position:absolute;left:22px;transform:translateY(-50%);transition:top .35s var(--ease)}
    #rail .k{position:absolute;left:22px;top:-26px;color:var(--ink3)}
  }
  @media (max-width:1179px){
    #rail{left:12px;right:12px;bottom:12px;height:50px;border-radius:14px;padding:0 14px;display:flex;align-items:center;gap:12px;
      background:color-mix(in srgb,var(--bg0) 82%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
      border:1px solid var(--hair2);transform:translateY(12px)}
    #rail.on{transform:none}
    #rail .cur{flex:0 0 auto;min-width:5.6em}
    #rail .line{position:relative;flex:1;height:22px}
    #rail .line::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--ink3)}
    #rail .win{position:absolute;top:calc(50% - 3px);height:6px;background:var(--tone);border-radius:3px}
    #rail .tick{position:absolute;top:3px;width:1px;height:16px;background:var(--ink3)}
    #rail .tick.l65{background:var(--tone);width:1.5px}
    #rail .dot{top:50%;width:8px;height:8px;transform:translate(-50%,-50%)}
    #rail .k{display:none}
    body{padding-bottom:70px}
  }

  /* ════ 首屏以下 ════ */
  .body{max-width:1240px;margin:0 auto;padding:56px 20px 30px}
  @media (min-width:980px){ .body{padding:84px 40px 40px} }
  @media (min-width:1180px){ .body{padding-left:200px} }
  .sec{margin-bottom:90px}
  .sec-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 18px;margin-bottom:30px}
  .sec-h .lbl{color:var(--ink3)}
  .sec-h .lbl::before{content:"";display:inline-block;width:22px;height:2px;background:var(--tone);vertical-align:4px;margin-right:10px}
  .sec-h h2{margin:0;font:900 clamp(28px,4vw,44px)/1.15 var(--sans);letter-spacing:.06em}
  .sec-h p{flex-basis:100%;margin:6px 0 0;color:var(--ink2);font-size:14px;max-width:40em}

  .stock{padding:34px 0 40px;border-top:1px solid var(--hair2)}
  .sec>.stock:first-of-type{border-top:0;padding-top:0}
  .s-head{display:flex;align-items:baseline;gap:8px 14px;flex-wrap:wrap;margin-bottom:22px}
  .s-head h3{margin:0;font:900 clamp(26px,3.4vw,38px)/1.1 var(--sans);letter-spacing:.06em}
  .s-head .code{font:500 14px var(--disp);color:var(--ink3);letter-spacing:.12em}
  .s-head .rk{font:600 11.5px var(--disp);letter-spacing:.2em;color:var(--tone)}
  .gl{font:500 11.5px var(--sans);letter-spacing:.06em;color:var(--open);border:1px solid var(--open);border-radius:999px;padding:1px 9px;white-space:nowrap}
  .cgrid{display:grid;gap:30px}
  @media (min-width:980px){ .cgrid{grid-template-columns:5fr 6fr;gap:64px} .stock.flip .cgrid>div:first-child{order:2} }
  .price{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
  .price .score{font:600 96px/.82 var(--disp);letter-spacing:-.03em}
  .price .score .delta{font-size:18px;vertical-align:top;margin-left:6px}
  .price .meta{padding-bottom:6px}
  .price .meta .t{font:700 15px var(--sans);letter-spacing:.1em}
  .price .meta .s{font-size:13px;color:var(--ink2)}
  .pchg{font-family:var(--disp);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pchg.up,.up{color:var(--up)} .pchg.down,.down{color:var(--down)} .pchg.flat,.flat{color:var(--ink3);font-weight:400}
  .spark{display:block;width:100%;height:64px;margin-top:22px;overflow:visible}
  .facts{display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px;border-top:1px solid var(--hair2)}
  .facts>div{padding:14px 0 4px;font-size:12px;color:var(--ink3);min-width:0}
  .facts>div+div{padding-left:16px;border-left:1px solid var(--hair2)}
  .facts b{display:block;font:600 24px/1.2 var(--disp);color:var(--ink);letter-spacing:-.01em}
  .rev{display:block;margin-top:26px;cursor:pointer}
  .rev .lbl{color:var(--ink3);display:flex;justify-content:space-between;gap:10px}
  .rev svg{display:block;width:100%;height:84px;margin-top:10px;overflow:visible}
  .rev:hover .lbl{color:var(--ink)}
  .rev .rv-read{letter-spacing:.04em;text-transform:none}
  .rev svg{cursor:crosshair}
  .blk{padding:18px 0;border-top:1px solid var(--hair2)}
  .blk:first-child{border-top:0;padding-top:0}
  .blk>.lbl{color:var(--ink3);display:block;margin-bottom:14px}
  .rb{position:relative;height:12px;display:flex;background:var(--hair)}
  .rb span{height:100%}
  .rb .ln{position:absolute;left:65%;top:-9px;bottom:-9px;width:2px;background:var(--ink)}
  .rb .cap{position:absolute;right:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--ink3) 35%,transparent) 4px 5.5px)}
  .rl{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px;font-size:12px;color:var(--ink3)}
  .rl b{display:block;font:600 19px var(--disp);color:var(--ink)}
  .rl b small{font-size:12px;color:var(--ink3);font-weight:500}
  .rl .hot b{color:var(--tone)}
  .need .q{font:700 17px var(--sans);letter-spacing:.04em;margin-bottom:6px}
  .need .q em{font-style:normal;font-family:var(--disp)}
  .rhl{padding:0 3px;background:linear-gradient(transparent 56%,color-mix(in srgb,var(--tone) 30%,transparent) 56%) no-repeat 0 0/0% 100%;
    -webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size 1s var(--ease) .35s}
  .rhl.in{background-size:100% 100%}
  .sl{display:grid;grid-template-columns:6.5em 1fr;gap:14px;align-items:center;font-size:13px;color:var(--ink2);padding:14px 0 10px}
  .sl .tr{position:relative;height:1px;background:var(--ink3)}
  .sl .tr .seg{position:absolute;top:-1px;height:3px;background:var(--tone)}
  .sl .tr .a{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}
  .sl .tr .b{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:var(--bg);border:2px solid var(--tone);transform:translate(-50%,-50%)}
  .sl .tr em{position:absolute;top:9px;font:600 12px var(--disp);font-style:normal;transform:translateX(-50%);white-space:nowrap}
  .sl.no{color:var(--ink3)}
  /* 估值位階尺：藍＝便宜、橘＝貴（溫度色），點的位置＝百分位 */
  .pe-t{font-size:13px;color:var(--ink2);margin-bottom:12px}
  .pe-t b{font-family:var(--disp);color:var(--ink)}
  .pe{position:relative;height:34px}
  .pe .ax{position:absolute;left:0;right:0;top:9px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--open),var(--ramp-mid),var(--shut));opacity:.85}
  .pe .md{position:absolute;top:3px;width:1px;height:15px;background:var(--ink)}
  .pe .me{position:absolute;top:10.5px;width:13px;height:13px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--bg)}
  .pe .tx{position:absolute;top:20px;font:500 11px var(--disp);color:var(--ink3);white-space:nowrap}
  .pewhy{font-size:12px;color:var(--ink3);margin-top:8px;line-height:1.6;border-left:2px solid var(--hair2);padding-left:9px}
  .thesis{font-size:14px;line-height:1.9;color:var(--ink2)}
  .thesis b{color:var(--ink)}
  .thesis code{background:var(--track);padding:1px 5px;border-radius:4px;font-size:.9em}
  .thesis details>summary{list-style:none;cursor:pointer;color:var(--ink);font:600 12.5px var(--sans);letter-spacing:.06em;margin-top:6px}
  .thesis details>summary::-webkit-details-marker{display:none}
  .thesis details>summary::after{content:" ▾"}
  .thesis details[open]>summary{display:none}
  .brk{display:block;margin-top:8px;font-size:13px;color:var(--ink3)}
  .brk i{font-style:normal;color:var(--shut)}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  .acts button{font:500 12.5px var(--sans);letter-spacing:.06em;color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer}
  .acts button:hover{background:var(--tone);border-color:var(--tone);color:#fff}
  .acts .rmlink{margin-left:auto;border-color:var(--hair);color:var(--ink3)}
  .acts .rmlink:hover{background:transparent;border-color:var(--shut);color:var(--shut)}
  .dline{font-size:14px;color:var(--ink2);line-height:1.85;margin-bottom:6px}

  /* 太貴／本夢比：一列一檔，點開才長出完整區塊 */
  .rows{border-top:1px solid var(--ink)}
  details.row{border-bottom:1px solid var(--hair2)}
  details.row>summary{list-style:none;cursor:pointer;display:grid;align-items:center;gap:14px;padding:14px 4px;
    grid-template-columns:minmax(6.5em,1.3fr) 4em 3em minmax(90px,1.4fr) 3em 5em 90px 18px}
  details.row>summary::-webkit-details-marker{display:none}
  details.row>summary:hover .nm{color:var(--tone)}
  details.row[open]>summary{border-bottom:1px solid var(--hair2)}
  .rh{display:grid;gap:14px;padding:0 4px 8px;grid-template-columns:minmax(6.5em,1.3fr) 4em 3em minmax(90px,1.4fr) 3em 5em 90px 18px;
    font:600 10.5px var(--disp);letter-spacing:.18em;color:var(--ink3);text-transform:uppercase}
  .nm{font:700 16px var(--sans);letter-spacing:.06em;transition:color .2s;min-width:0}
  .nm small{font:500 11.5px var(--disp);color:var(--ink3);margin-left:7px;letter-spacing:.08em}
  .c-sc{font:600 22px var(--disp);white-space:nowrap}
  .c-sc .delta{font-size:11px}
  .c-sc.dream{font:600 13px var(--sans);color:var(--dream)}
  .c-gp{font:500 13px var(--disp);color:var(--ink3)}
  .c-pe{position:relative;height:12px}
  .c-pe::before{content:"";position:absolute;left:0;right:0;top:6px;height:1px;background:var(--ink3)}
  .c-pe i{position:absolute;top:6px;width:8px;height:8px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}
  .c-pe em{position:absolute;right:0;top:-12px;font:500 10.5px var(--disp);font-style:normal;color:var(--ink3)}
  .c-q{font:600 14px var(--disp)}
  .c-3m{font-size:13px;text-align:right}
  .c-sp{width:90px;height:22px}
  .c-ch{width:14px;height:14px;color:var(--ink3);transition:transform .3s var(--ease)}
  details.row[open] .c-ch{transform:rotate(180deg)}
  details.row .stock{border-top:0;padding:26px 4px 34px}
  @media (max-width:760px){
    details.row>summary,.rh{grid-template-columns:1fr 3.4em 2.6em 4.8em 16px}
    .c-pe,.c-q,.c-sp,.rh .h-pe,.rh .h-q,.rh .h-sp{display:none}
  }

  /* 分數怎麼算 */
  .how{display:grid;border-top:1px solid var(--ink)}
  @media (min-width:860px){ .how{grid-template-columns:repeat(3,1fr)} }
  .how>div{padding:24px 0;border-bottom:1px solid var(--hair2)}
  @media (min-width:860px){ .how>div{padding:28px 28px 28px 0;border-bottom:0} .how>div+div{padding-left:28px;border-left:1px solid var(--hair2)} }
  .how .w{font:600 72px/.9 var(--disp);letter-spacing:-.03em}
  .how .w small{font-size:20px;color:var(--ink3);margin-left:4px;letter-spacing:0}
  .how h4{margin:14px 0 6px;font:900 20px var(--sans);letter-spacing:.08em}
  .how p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.85}
  .how .today{margin-top:12px;font-size:12.5px;color:var(--ink3)}
  .how .today b{font-family:var(--disp);color:var(--ink)}
  .how .hot .w,.how .hot .today b{color:var(--tone)}
  .lines{display:grid;gap:10px;margin-top:30px}
  @media (min-width:860px){ .lines{grid-template-columns:repeat(3,1fr)} }
  .lines div{display:flex;gap:12px;align-items:baseline;font-size:13.5px;color:var(--ink2)}
  .lines b{font:600 26px var(--disp);color:var(--ink);min-width:2.6em}
  details.gloss{margin-top:36px;border-top:1px solid var(--hair2);padding-top:16px;font-size:13.5px;color:var(--ink2);line-height:1.85}
  details.gloss>summary{cursor:pointer;color:var(--ink);font:700 15px var(--sans);letter-spacing:.06em;list-style:none}
  details.gloss>summary::-webkit-details-marker{display:none}
  details.gloss>summary::after{content:" ▾";color:var(--ink3)}
  details.gloss ul{padding-left:1.1em;margin:.8em 0 0;max-width:52em}
  details.gloss li{margin:.5em 0}
  details.gloss code{background:var(--track);padding:1px 5px;border-radius:4px;font-size:.9em}

  /* 結尾帶：跟首屏同色調 */
  .band .in{max-width:1240px;margin:0 auto;padding:64px 20px 40px;display:grid;gap:40px}
  @media (min-width:980px){ .band .in{grid-template-columns:1fr 1fr;padding:84px 40px 50px;gap:64px} }
  @media (min-width:1180px){ .band .in{padding-left:200px} }
  .band h2{margin:12px 0 10px;font:900 clamp(26px,3.4vw,38px)/1.2 var(--sans);letter-spacing:.06em}
  .band p{margin:0;font-size:14px;line-height:1.85;opacity:.88}
  .field{display:flex;margin-top:22px;border-bottom:1.5px solid #fff}
  .field input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:500 22px var(--disp);padding:10px 0;outline:none;letter-spacing:.06em}
  .field input::placeholder{color:rgba(255,255,255,.55)}
  .field button{background:#fff;color:var(--tone);border:0;border-radius:999px;font:700 13px var(--sans);letter-spacing:.1em;padding:0 20px;margin:6px 0;cursor:pointer}
  .band .note{font-size:12.5px;margin-top:10px;opacity:.85;min-height:1em}
  .band .note .err,.band .note span{color:#fff!important}
  #addstatus{font-size:13px;font-weight:600;margin-top:6px;color:#fff!important}
  .band .disc{grid-column:1/-1;font-size:12px;opacity:.78;border-top:1px solid rgba(255,255,255,.3);padding-top:18px;line-height:1.8}

  .ic{display:inline-block;width:1em;height:1em;flex-shrink:0;vertical-align:-.14em;
    background:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat}
  .ic-help{--i:var(--ic-help)}.ic-info{--i:var(--ic-info)}.ic-bars{--i:var(--ic-bars)}.ic-line{--i:var(--ic-line)}.ic-back{--i:var(--ic-back)}.ic-trash{--i:var(--ic-trash)}.ic-close{--i:var(--ic-close)}.ic-tag{--i:var(--ic-tag)}.ic-pulse{--i:var(--ic-pulse)}.ic-print{--i:var(--ic-print)}.ic-flame{--i:var(--ic-flame)}.ic-coins{--i:var(--ic-coins)}.ic-eye{--i:var(--ic-eye)}.ic-sale{--i:var(--ic-sale)}.ic-lock{--i:var(--ic-lock)}.ic-moon{--i:var(--ic-moon)}.ic-plus{--i:var(--ic-plus)}.ic-find{--i:var(--ic-find)}.ic-note{--i:var(--ic-note)}.ic-warn{--i:var(--ic-warn)}.ic-bolt{--i:var(--ic-bolt)}.ic-chev{--i:var(--ic-chev)}
  .lb{display:inline-flex;align-items:center;gap:5px}
  .hd{display:flex;align-items:center;gap:10px;margin-bottom:2px}
  .hd h1{flex:1;margin:.1em 0}
  .iconbtn{flex-shrink:0;width:34px;height:34px;display:grid;place-items:center;padding:0;
    border:1px solid var(--line);border-radius:50%;background:var(--panel);color:var(--muted);cursor:pointer}
  .iconbtn .ic{font-size:1.05rem}
  .iconbtn:hover{color:var(--ink);border-color:var(--muted)}
  /* 只有圖示、沒有文字的按鈕／連結：拿掉虛線底線與文字間距 */
  .ionly{border-bottom:0 !important}
  .act.ionly{padding:8px 11px}
  .mklink.ionly{font-size:1em;opacity:.75}
  .mklink.ionly::after{margin-left:0}

  /* 浮層與圖表視窗（2026-10 改版）：不再是一塊白——同色調霧面玻璃，畫法沿用個股區的營收長條 */
  #tip,#chart,#mkchart,#hchart{position:fixed;left:8px;right:8px;bottom:8px;margin:0 auto;display:none;
    background:linear-gradient(150deg,color-mix(in srgb,var(--tone) 12%,var(--bg0)),color-mix(in srgb,var(--tone) 4%,var(--bg0)));
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1px solid color-mix(in srgb,var(--tone) 18%,transparent);border-radius:20px;color:var(--ink);
    box-shadow:0 30px 70px -30px color-mix(in srgb,var(--tone) 55%,transparent),0 0 0 100vmax color-mix(in srgb,var(--ink) 26%,transparent)}
  #tip{max-width:640px;padding:18px 20px;z-index:50;font-size:14px;line-height:1.8;color:var(--ink2)}
  #chart,#mkchart,#hchart{max-width:780px;padding:20px 22px 22px;z-index:60;max-height:calc(100vh - 16px);overflow-y:auto;overscroll-behavior:contain}
  @media (min-width:700px){ #tip,#chart,#mkchart,#hchart{bottom:24px} }
  #tip.show,#chart.show,#mkchart.show,#hchart.show{display:block;animation:sheetIn .4s var(--ease)}
  @keyframes sheetIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){ #tip.show,#chart.show,#mkchart.show,#hchart.show{animation:none} }
  #tip .k{font:900 18px var(--sans);letter-spacing:.06em;color:var(--ink);margin-bottom:6px}
  #tip .x{float:right;color:var(--ink3);font-size:12px}
  .chead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
  .chead b{font:900 clamp(18px,2.4vw,22px) var(--sans);letter-spacing:.06em}
  .chead b::before{content:"";display:inline-block;width:22px;height:2px;background:var(--tone);vertical-align:6px;margin-right:12px}
  .cx{cursor:pointer;color:var(--ink2);width:34px;height:34px;border-radius:50%;border:1px solid var(--hair2);display:grid;place-items:center;flex-shrink:0}
  .cx:hover{border-color:var(--ink);color:var(--ink)}
  .cbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .cbtns button{padding:6px 13px;border:1px solid color-mix(in srgb,var(--ink) 35%,transparent);border-radius:999px;
    background:transparent;color:var(--ink2);font:500 12.5px var(--sans);letter-spacing:.06em;cursor:pointer}
  .cgrp{display:flex;gap:6px;flex-wrap:nowrap}
  .cbtns button.on{background:var(--tone);color:#fff;border-color:var(--tone)}
  .csp{flex:1}
  #chart svg text,#mkchart svg text,#hchart svg text{font-family:var(--disp)}
  @media (max-width:600px){ #chart svg text,#mkchart svg text,#hchart svg text{font-size:11px} }   /* 圖是等比縮放的，手機上 7.5 會縮成 7px 看不到 */
  /* 讀數浮標：一顆墨色小膠囊，跟著拖曳位置左右移動 */
  .chartwrap{position:relative;padding-top:44px}
  .ctip{position:absolute;top:0;pointer-events:none;white-space:nowrap;background:var(--ink);color:var(--bg0);
    border-radius:10px;padding:6px 11px;font:500 12.5px/1.35 var(--disp);font-variant-numeric:tabular-nums}
  .ctip b{font-weight:700}
  .ctip .t2{font-size:12px;margin-top:1px;opacity:.9}
  .ctip .c-ink,.ctip .c-cool,.ctip .c-up,.ctip .c-down{color:inherit}
  .ctip .c-cool{opacity:.75}
  .cstats{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:12px;padding-top:10px;border-top:1px solid var(--hair2);
    font:500 12.5px var(--disp);color:var(--ink3);font-variant-numeric:tabular-nums}
  .cstats b{color:var(--ink);font-weight:600}
  #chart .label,#mkchart .label,#hchart .label{font-size:12px;color:var(--ink3);letter-spacing:.04em}
  /* 焦點呼吸圈 */
  @keyframes focPing{0%{transform:scale(1);opacity:.45}70%{transform:scale(3.2);opacity:0}100%{opacity:0}}

<script>
const GLOSSARY = {
  market:"市場恐慌度：全大盤共用。高＝大家在恐慌（折扣容易出現）；低＝大家貪婪、追高危險。用大盤乖離（離 120 日均線多遠，40%）／回檔（離近一年高點跌多少，30%）／波動（近 20 日年化，30%）算，<b>只吃加權指數收盤價一條資料，不是 VIX</b>，也不用位階（多頭趨勢會失真）。"
    +"<br><br><b>它準嗎</b>（2026-10-16 回測：TAIEX 2000–2026、6118 個進場日、持有一年）：<br>"
    +"<span style='font-variant-numeric:tabular-nums'>貪婪 &lt;40　　+8.6%　勝率 68%<br>中性 40–64　+13.2%　勝率 78%<br>恐慌 65–79　 +9.8%　勝率 80%<br><b>極度恐慌 ≥80　+20.0%　勝率 90%</b></span>"
    +"<br>（不挑時機直接買是 +9.5%／72%）"
    +"<br><br><i class='ic ic-warn'></i> <b>三件要知道的事</b>：<br>"
    +"① <b>樣本比看起來小</b>——≥80 的 329 天只分佈在 <b>9 次事件</b>，成績是 8 勝 1 敗，不是「對了 296 天」。<br>"
    +"② <b>它分不出谷底和半山腰</b>——2008-01 叫到 82 分，一年後 −41%；同年 10 月叫到 100 分，一年後 +61%。差別只在「後面還要跌多少」，當下無解。試過加「已跌逾 15%」的條件也濾不掉（2008-01 當時已跌 22.7%）。<br>"
    +"③ <b>貪婪不等於別買</b>——貪婪區進場一年後中位數仍有 +8.6%、68% 勝率。它量的是「有沒有額外折扣」，不是紅綠燈。"
    +"<br><br>貪婪端刻意<b>不再細分</b>：&lt;20 與 20–39 的報酬（+7.9% / +9.6%）、勝率（都 68%）、風險都一樣，切開只會造出一個資料不支持的差別。",
  composite:`衡量「現在是不是進場的好時機」，三塊加權：<br>
    <span style="font-variant-numeric:tabular-nums">0.40×估值便宜　＋　0.25×基本面　＋　0.35×市場恐慌</span>
    <div style="margin:9px 0 7px;border-top:1px solid var(--line)"></div>
    <span style="color:var(--open)">●</span> <b>≥65</b>　時機佳（便宜＋恐慌）<br>
    <span style="color:var(--half)">●</span> <b>45–64</b>　普通（中性）<br>
    <span style="color:var(--shut)">●</span> <b>&lt;45</b>　時機差（貴＋貪婪）
    <div class="label" style="margin-top:9px">這是情境傾向，不是買賣訊號。</div>`,
  val_cheap:"估值便宜度：這檔的估值（本益比，或虧損過的股票用股價淨值比），站在它自己比較區間的高低位置。越低（越接近自己的便宜區）分數越高（＝100 − 位階）。回答「相對它自己，現在便宜還貴」。比較區間預設近 5 年。",
  fund:"基本面：公司賺不賺錢、在成長還衰退。用最新月營收年增率（YoY）換算，成長越猛分數越高。單月有雜訊，想看趨勢就點「營收動能」看歷年圖。",
  goodline:"好公司打折線：財務指紋 ≥80 的好公司，位階 ≤60% 就亮這個標籤。<br><br>為什麼不等 ≤30%：2026-10 用清單裡指紋 ≥80 的 6 檔回測（2013 起每天進場、看一年後）——位階 ≤30% 買，一年後中位數 +25%、跌超過 20% 的機率 9%；45～60% 買是 +22%、6%，結果差不多，但能進場的日子多一倍（約 44% 對 21%）。好公司很少真的跌到 ≤30%，死等會一直錯過。<br><i class='ic ic-warn'></i> 只是標籤，<b>不改進場時機分數</b>（歷史回測照舊可比）。回測的 6 檔是「現在看來」的好公司＝事後挑的贏家，結果偏樂觀；指紋掉到 80 以下，標籤自動消失。",
  quality:"財務指紋（品質）：這是不是一門「好生意」——用近幾完整年的 ROE（股東權益報酬率）＋毛利率水準與穩定度＋營益率算，滿分 100。跟「基本面」互補：基本面看『營收現在衝不衝』（短期動能），品質看『賺錢賺得久不久、穩不穩』（長期體質）。<i class='ic ic-warn'></i> 刻意不併入進場時機——它回答『該不該擁有』，不是『現在時機好不好』。",
  per:"PER（本益比）：股價 ÷ 每股盈餘。買一塊錢的獲利要付幾塊，數字越大＝買得越貴。",
  pbr:"PBR（股價淨值比）：股價 ÷ 每股淨值。買一塊錢的資產要付幾塊，數字越大＝買得越貴。<br><br>這檔改用 PBR，是因為它<b>虧損過</b>——公司虧錢時沒有本益比（分母是負的或趨近 0），那段日子的 PER 在資料裡是空的。如果照樣用 PER 算位階，等於「只跟有賺錢的那半個循環比」，會把景氣頂部誤讀成便宜。淨值不會消失，所以改用 PBR。",
  pctl:"位階：現在的估值，站在它自己比較區間由低到高的第幾個百分點。越低＝越接近它自己的便宜區。<br><br>比較區間<b>預設近 5 年</b>；業態真的變過、舊資料不可比的股票，可以在 <code>watchlist.txt</code> 逐檔改起算日（<code>@since=2023-01 理由</code>，理由必填），卡片上會標出來。<br><b>少調它</b>——縮短區間的實際效果是刪掉低估值年代，會讓幾乎每一檔都變便宜。",
};
const term=(k,t)=>`<span class="term" data-k="${k}">${t}</span>`;
const chartLink=(code)=>`<span class="chartlink" data-code="${code}">營收動能</span>`;
const rmLink=(code)=>`<span class="rmlink" data-code="${code}">移除</span>`;
function compColor(s){ return s>=65?"var(--open)": s>=45?"var(--half)": "var(--shut)"; }
function mktColor(s){ return s>=65?"var(--open)" : s>=40?"var(--half)" : "var(--shut)"; }
function esc(x){ return x==null?"—":x; }

// 現價漲跌：spark 是近 65 個交易日的收盤，最後兩筆＝最新交易日的變化。
// 資料每交易日收盤後由 Action 更新，不是即時報價。
function priceChg(spark){
  if(!spark || spark.length<2) return {day:null, q3:null};
  const now=spark[spark.length-1], prev=spark[spark.length-2], first=spark[0];
  const pct=(a,b)=> (!b)?null:Math.round((a/b-1)*1000)/10;
  return {day:pct(now,prev), q3:pct(now,first)};
}
function chgCls(v){ return v>0?"up":v<0?"down":"flat"; }
function chgHTML(v){                    // 有箭頭：最新交易日
  if(v==null) return "";
  return `<span class="pchg ${chgCls(v)}">${v>0?"▲":v<0?"▼":"－"}${Math.abs(v)}%</span>`;
}
function chgTxt(v){                     // 純數字：近 3 月
  if(v==null) return "";
  return `<span class="pchg ${chgCls(v)}">${v>0?"+":""}${v}%</span>`;
}


// ── 歷年營收圖 ──────────────────────────────
let CH={code:null, view:"rev", range:24, focus:null};
function syncBtns(){
  document.querySelectorAll("#chart .cbtns button").forEach(b=>{
    b.classList.toggle("on", b.dataset.v===CH.view || (+b.dataset.r)===CH.range);
  });
}
function openChart(code){
  const chart=document.getElementById("chart");
  const s=(window.DATA?.stocks||[]).find(x=>x.code===code);
  document.getElementById("ctitle").textContent=(s?(s.name||"")+" "+s.code:code)+"　營收";
  if(!s || !s.revenue_history || !s.revenue_history.length){
    document.querySelector("#chart .cbody").innerHTML='<div class="label">這檔沒有月營收資料（可能是興櫃/新上市/金融股）。</div>';
    chart.classList.add("show"); return;
  }
  CH.code=code; CH.focus=null; drawChart(); syncBtns(); chart.classList.add("show");
}
function drawChart(){
  const s=window.DATA.stocks.find(x=>x.code===CH.code);
  const h=s.revenue_history.slice(-CH.range);
  const isRev=CH.view==="rev";
  if(CH.focus==null) CH.focus=h.length-1;
  CH.focus=Math.max(0,Math.min(h.length-1,CH.focus));
  const val=d=> isRev?(d.rev||0):(d.yoy==null?0:d.yoy);
  const vals=h.map(val);
  const W=340,H=160,padL=30,padR=10,padT=10,padB=22;
  const iw=W-padL-padR, ih=H-padT-padB;
  const maxV=Math.max(...vals,1);
  const minV=isRev?0:Math.min(...vals,0);
  const span=(maxV-minV)||1;
  const bw=iw/h.length;
  const y=v=> padT+(maxV-v)/span*ih;
  const yz=y(0);

  // Y 軸格線＋刻度數值
  const ticks=[...new Set(isRev?[0,maxV]:[minV,0,maxV])];
  let grid="";
  ticks.forEach(tv=>{
    const yy=y(tv);
    grid+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width=".6"/>`;
    grid+=`<text x="${(padL-4).toFixed(1)}" y="${(yy+2.6).toFixed(1)}" font-size="7.5" fill="var(--muted)" text-anchor="end">${isRev?Math.round(tv):(tv>0?"+":"")+Math.round(tv)+"%"}</text>`;
  });

  // 長條＋年份分隔線＋透明點擊區（整欄可點）
  let bars="", marks="", hits="";
  h.forEach((d,i)=>{
    const v=val(d), cx=padL+i*bw;
    const bx=cx+bw*0.15, w=Math.max(1.2,bw*0.7), yv=y(v);
    const top=Math.min(yv,yz), ht=Math.max(1,Math.abs(yv-yz));
    const foc=(i===CH.focus);
    const col=foc?"var(--tone)":((isRev||v>=0)?"var(--ink)":"var(--ink3)");   // 2026-10：沿用個股區長條的畫法
    if(foc) bars+=`<rect x="${cx.toFixed(1)}" y="${padT}" width="${bw.toFixed(1)}" height="${ih}" fill="var(--tone)" opacity=".08"/>`;
    bars+=`<rect x="${bx.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${ht.toFixed(1)}" rx="1" fill="${col}" opacity="${foc?1:(.22+.5*i/h.length).toFixed(2)}"/>`;
    const mo=d.ym.slice(5);
    if(mo==="01"){
      marks+=`<line x1="${cx.toFixed(1)}" y1="${padT}" x2="${cx.toFixed(1)}" y2="${(padT+ih).toFixed(1)}" stroke="var(--line)" stroke-width=".6" stroke-dasharray="2 2"/>`;
      marks+=`<text x="${(cx+bw/2).toFixed(1)}" y="${H-6}" font-size="7.5" fill="var(--muted)" text-anchor="middle">${d.ym.slice(0,4)}</text>`;
    } else if(i===0){
      marks+=`<text x="${(cx+bw/2).toFixed(1)}" y="${H-6}" font-size="7.5" fill="var(--muted)" text-anchor="middle">${d.ym.slice(0,4)}</text>`;
    }
    hits+=`<rect class="hit" data-i="${i}" x="${cx.toFixed(1)}" y="${padT}" width="${bw.toFixed(1)}" height="${ih}" fill="transparent" style="cursor:pointer"/>`;
  });

  const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${grid}${bars}${marks}${hits}</svg>`;

  // 選中月份的讀數（同時秀營收與 YoY，不管目前看哪個檢視）
  const f=h[CH.focus];
  const yoyTxt=f.yoy==null?"—":(f.yoy>0?"+":"")+f.yoy+"%";
  const yoyCol= f.yoy==null?"" : f.yoy>=0?"c-up":"c-down";
  const tip=`<div class="ctip" id="chtip"><b>${f.ym}</b><div class="t2">`+
    `<span class="c-cool">營收 <b>${f.rev}</b> 億</span> · `+
    `<span class="${yoyCol}">YoY <b>${yoyTxt}</b></span></div></div>`;
  document.querySelector("#chart .cbody").innerHTML=
    `<div class="chartwrap">${svg}${tip}</div>`+
    `<div class="label" style="margin-top:8px">${isRev?"每月營收（億元）":"月營收年增率 YoY（負值往下）"}　·　近 ${CH.range} 個月</div>`;
  placeTip(document.getElementById("chtip"), padL+(CH.focus+0.5)*bw, W);
}

// ── 市場恐慌度歷史（把 build_data.py 的市場恐慌度公式，對每一天各算一次）──
let MK={view:"both", range:250, focus:null, series:null, _n:0};   // 預設疊圖：一眼看情緒與指數的關係
// 與 build_data.py 完全同式，但一次把「每一天」都算出來（前 249 天視窗不足 → null）。
// 全檔唯一實作：市場恐慌度歷史圖與個股歷史圖共用，避免兩份公式各自漂移。
function fearSeries(closes){
  const out=new Array(closes.length).fill(null);
  const rets=[]; for(let i=1;i<closes.length;i++) rets.push(closes[i]/closes[i-1]-1);
  let s120=0;
  for(let i=0;i<closes.length;i++){
    s120+=closes[i]; if(i>=120) s120-=closes[i-120];
    if(i<249) continue;
    const c=closes[i], ma120=s120/120;
    const bias=(c-ma120)/ma120*100;
    let hi=closes[i-249]; for(let k=i-248;k<=i;k++) if(closes[k]>hi) hi=closes[k];
    const dd=(c-hi)/hi*100;
    const vol=pstdev(rets.slice(i-20,i))*Math.sqrt(252)*100;
    out[i]={score:Math.round(0.4*bclamp(50-bias*3.3)+0.3*bclamp(-dd*2.5)+0.3*bclamp((vol-12)/26*100)),
            bias, dd, vol};
  }
  return out;
}
// 浮標定位：x 是 viewBox 座標（svg width:100% ⇒ x/W 就是容器百分比）。
// 靠邊時改成貼齊該側，避免浮標被切掉。
function placeTip(el, x, W){
  if(!el) return;
  const pct=x/W*100;
  el.style.left=pct+"%";
  el.style.transform = pct<28 ? "translateX(-6px)"
                     : pct>72 ? "translateX(calc(-100% + 6px))"
                     : "translateX(-50%)";
}

function mkTipInner(d, mode){        // 浮標內容（拖曳時即時換這段）
  // 四格與 build_data.market_fear() 的 tag 同門檻（≥80 另立的理由見那邊的決策註解）
  const tag= d.score>=80?"極度恐慌": d.score>=65?"恐慌": d.score>=40?"中性":"貪婪";
  const fear=`<span class="c-ink">恐慌度 <b>${d.score}</b> ${tag}</span>`;
  const idx =`<span class="c-cool">大盤 <b>${Math.round(d.close)}</b></span>`;
  const l2= mode==="index" ? `${idx} · ${fear}`
          : mode==="both"  ? `${fear} · ${idx}`
          : `${fear} · 乖離 ${d.bias>0?"+":""}${Math.round(d.bias*10)/10}%`;
  return `<b>${d.date}</b><div class="t2">${l2}</div>`;
}
function mkSync(){

function mkDraw(){
  const body=document.querySelector("#mkchart .mkbody");
  if(!MK.series || !MK.series.length){ body.innerHTML='<div class="label">抓不到大盤資料，稍後再試。</div>'; return; }
  const s=MK.series.slice(-MK.range), n=s.length; MK._n=n;
  if(MK.focus==null) MK.focus=n-1;
  MK.focus=Math.max(0,Math.min(n-1,MK.focus));
  const mode=MK.view;                       // fear | index | both
  const showFear=mode!=="index", showIndex=mode!=="fear", showBands=mode!=="index";
  const W=340,H=172,padL=30,padR=10,padT=10,padB=22, iw=W-padL-padR, ih=H-padT-padB;
  const cs=s.map(d=>d.close);
  const imin0=Math.min(...cs), imax0=Math.max(...cs), ip=(imax0-imin0)*0.05||1;
  const imin=imin0-ip, imax=imax0+ip;
  const step= n>1? iw/(n-1) : iw, X=j=> padL+j*step;
  const Yf=v=> padT+(100-v)/100*ih;                 // 恐慌度 0~100（左）
  const Yi=v=> padT+(imax-v)/((imax-imin)||1)*ih;   // 大盤點數（右）

  let bg="";

    [[65,100,"var(--t-fear)",.09],[40,65,"var(--t-mid)",.07],[0,40,"var(--t-greed)",.09]].forEach(z=>{   // 2026-10：區帶＝首屏色調

    });

      bg+=`<text x="${padL-4}" y="${(yy+2.6).toFixed(1)}" font-size="7.5" fill="var(--muted)" text-anchor="end">${t}</text>`;
    });
  } else {
    [imax0,imin0].forEach(t=>{ const yy=Yi(t);
      bg+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width=".6"/>`;
      bg+=`<text x="${padL-4}" y="${(yy+2.6).toFixed(1)}" font-size="7.5" fill="var(--muted)" text-anchor="end">${Math.round(t)}</text>`;
    });
  }

  // 折線（疊圖時大盤在下、恐慌度在上）
  let lines="";
  if(showIndex){ let p=""; s.forEach((d,j)=> p+=`${X(j).toFixed(1)},${Yi(d.close).toFixed(1)} `);
    lines+=`<polyline points="${p.trim()}" fill="none" stroke="var(--ink3)" stroke-width="1.3" opacity="${mode==="both"?".9":"1"}"/>`; }
  if(showFear){ let p=""; s.forEach((d,j)=> p+=`${X(j).toFixed(1)},${Yf(d.score).toFixed(1)} `);
    lines+=`<polyline points="${p.trim()}" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`; }

  let marks="";
  s.forEach((d,j)=>{
    if(d.date.slice(5,7)==="01" && (j===0 || s[j-1].date.slice(5,7)!=="01"))
      marks+=`<line x1="${X(j).toFixed(1)}" y1="${padT}" x2="${X(j).toFixed(1)}" y2="${(padT+ih).toFixed(1)}" stroke="var(--line)" stroke-width=".6" stroke-dasharray="2 2"/>`;
  });
  marks+=`<text x="${padL}" y="${H-6}" font-size="7.5" fill="var(--muted)">${s[0].date.slice(0,7)}</text>`;
  marks+=`<text x="${W-padR}" y="${H-6}" font-size="7.5" fill="var(--muted)" text-anchor="end">${s[n-1].date.slice(0,7)}</text>`;

  const f=s[MK.focus], fx=X(MK.focus);
  let foc=`<line id="mkfl" x1="${fx.toFixed(1)}" y1="${padT}" x2="${fx.toFixed(1)}" y2="${(padT+ih).toFixed(1)}" stroke="var(--muted)" stroke-width=".7"/>`;
  if(showIndex) foc+=`<circle class="focping" id="mkpi" cx="${fx.toFixed(1)}" cy="${Yi(f.close).toFixed(1)}" r="3.2" fill="var(--ink3)"/>`+
                     `<circle id="mkdi" cx="${fx.toFixed(1)}" cy="${Yi(f.close).toFixed(1)}" r="2.6" fill="var(--ink3)"/>`;
  if(showFear) foc+=`<circle class="focping" id="mkpf" cx="${fx.toFixed(1)}" cy="${Yf(f.score).toFixed(1)}" r="3.2" fill="var(--tone)"/>`+
                    `<circle id="mkdf" cx="${fx.toFixed(1)}" cy="${Yf(f.score).toFixed(1)}" r="2.6" fill="var(--tone)"/>`;
  const hit=`<rect class="mkhit" x="${padL}" y="${padT}" width="${iw}" height="${ih}" fill="transparent" style="cursor:crosshair;touch-action:none"/>`;
  const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${bg}${lines}${marks}${foc}${hit}</svg>`;

  const legend= mode==="both"
    ? `<div class="label" style="margin-bottom:4px"><span style="color:var(--ink)">━ 恐慌度 0–100</span>　<span style="color:var(--ink3)">━ 大盤 ${Math.round(imin0)}–${Math.round(imax0)}</span></div>`
    : "";
  body.innerHTML=legend+`<div class="chartwrap">${svg}<div class="ctip" id="mktip">${mkTipInner(f,mode)}</div></div>`;

  // 拖曳掃描用：預存每點座標＋焦點元素參照，滑動時只改焦點、不重繪整張
  MK._pts=s.map((d,j)=>({x:X(j), yf:Yf(d.score), yi:Yi(d.close)}));
  MK._s=s; MK._mode=mode; MK._W=W;
  MK._fl=body.querySelector("#mkfl"); MK._df=body.querySelector("#mkdf"); MK._di=body.querySelector("#mkdi"); MK._pf=body.querySelector("#mkpf"); MK._pi=body.querySelector("#mkpi");
  MK._tip=body.querySelector("#mktip"); placeTip(MK._tip, fx, W);
}
function mkUpdateFocus(idx){          // 拖曳中即時更新（輕量，不呼叫 mkDraw）
  if(!MK._pts || !MK._pts.length) return;
  idx=Math.max(0,Math.min(MK._pts.length-1,idx));
  if(idx===MK.focus) return;
  MK.focus=idx;
  const p=MK._pts[idx], d=MK._s[idx];
  if(MK._fl){ MK._fl.setAttribute("x1",p.x.toFixed(1)); MK._fl.setAttribute("x2",p.x.toFixed(1)); }
  [[MK._df,p.yf],[MK._pf,p.yf],[MK._di,p.yi],[MK._pi,p.yi]].forEach(([el,y])=>{
    if(el){ el.setAttribute("cx",p.x.toFixed(1)); el.setAttribute("cy",y.toFixed(1)); } });
  if(MK._tip){ MK._tip.innerHTML=mkTipInner(d, MK._mode); placeTip(MK._tip, p.x, MK._W); }
}
(function(){                          // 拖曳掃描：按著在圖上左右滑，焦點跟著跑
  const modal=document.getElementById("mkchart"); if(!modal) return;
  let dragging=false;
  function idxFromX(clientX){
    const hitEl=modal.querySelector(".mkhit"); if(!hitEl || !MK._n) return null;
    const r=hitEl.getBoundingClientRect();
    return Math.round(bclamp((clientX-r.left)/r.width,0,1)*(MK._n-1));
  }
  modal.addEventListener("pointerdown", e=>{
    if(!e.target.closest(".mkhit")) return;
    dragging=true; const i=idxFromX(e.clientX); if(i!=null) mkUpdateFocus(i); e.preventDefault();
  });
  window.addEventListener("pointermove", e=>{
    if(!dragging) return; const i=idxFromX(e.clientX); if(i!=null) mkUpdateFocus(i); e.preventDefault();
  });
  window.addEventListener("pointerup", ()=>{ dragging=false; });
  window.addEventListener("pointercancel", ()=>{ dragging=false; });
})();

// ── 這檔的歷史（＝時光倒流回測，做成可拖曳的曲線）────────────────────
// 一次把 PER／股價／月營收／大盤抓齊，之後在瀏覽器裡把 build_data.py 的公式
// 對「每一個交易日」各算一次。拖曳＝換 as_of，不用重新查詢。
// 公式與 build_data.py 一致，且只餵「那一天當下拿得到」的資料（月營收算次月10日才公布）。
let HS={code:null, name:"", view:"both", range:500, focus:null, series:null, _n:0, _cache:{}};  // 預設疊圖

function hsSync(){
  document.querySelectorAll("#hchart .cbtns button").forEach(b=>{
    b.classList.toggle("on", b.dataset.hv===HS.view || (+b.dataset.hr)===HS.range);
  });
}
function hsTipInner(d){              // 浮標：只放最重要的兩行
  const tag = d.comp==null?"" : d.comp>=65?" 時機佳" : d.comp>=45?" 普通":" 時機差";
  return `<b>${d.date}</b><div class="t2">`+
    `<span class="c-ink">進場時機 <b>${d.comp==null?"—":d.comp}</b>${tag}</span> · `+
    `<span class="c-cool">收盤 <b>${Math.round(d.close*100)/100}</b></span></div>`;
}
function hsDetailInner(d, hasComp){  // 圖下細節列：回測要看的數字（拖曳時一起換）
  if(!hasComp) return '<span>這檔算不出估值位階（本夢比），只能看股價。</span>';
  return `<span>${HS._mName||"PER"} <b>${d.mval==null?"—":d.mval}</b></span><span>位階 <b>${d.pctl==null?"—":d.pctl+"%"}</b></span>`+
         `<span>營收YoY <b>${d.yoy==null?"—":(d.yoy>0?"+":"")+d.yoy+"%"}</b></span>`+
         `<span>大盤恐慌 <b>${d.mk==null?"—":d.mk}</b></span>`;
}

async function hsBuild(code){
  const ck=code+"|"+MODE;                  // 兩種模式的序列不同，快取要分開
  if(HS._cache[ck]) return HS._cache[ck];
  // 用哪把尺、哪個起算日都必須跟卡片一致（data.json 的 metric / metric_since），
  // 否則圖的最後一天會跟卡片對不上。TaiwanStockPER 同時回 PER 與 PBR，不用多打一次 API。
  const meta=view((window.DATA&&window.DATA.stocks||[]).find(x=>x.code===code));
  const perSince=(meta&&meta.metric_since)||null;
  const mKey=(meta&&meta.metric==="pbr")?"PBR":"PER";
  HS._mName=mKey;
  const today=new Date().toISOString().slice(0,10);
  // 客製起算日可能比 8.5 年更早（循環股設到 2010）：沒抓到那一天，圖的最後一天就跟卡片對不上
  const perFrom=(perSince && perSince<shiftDays(today,-3100)) ? perSince : shiftDays(today,-3100);
  const [per,px,tx,rev]=await Promise.all([
    fmGet("TaiwanStockPER",code,perFrom,today),   // 位階看前5年 → 要比回測區間多抓5年；客製起算日更早就抓到那天
    fmGet("TaiwanStockPrice",code,shiftDays(today,-2000),today),
    fmGet("TaiwanStockPrice","TAIEX",shiftDays(today,-2300),today),
    fmGet("TaiwanStockMonthRevenue",code,shiftDays(today,-2400),today),
  ]);
  if(!px.length) throw new Error("查無這檔股票的股價，確認一下代號？");
  // 配股校正：係數由 build_data.share_base_fix 算好寫進 data.json（per_fix），這裡只套用。
  // 刻意不在瀏覽器重算一次——同一套判斷有兩份實作，遲早會對不上（檔頭那條「獨立複本」警告）。
  const pf = meta && meta.per_fix;
  if(pf){
    per.forEach(r=>{ if(r.date>=pf.from){ if(r.PER) r.PER*=pf.factor; if(r.PBR) r.PBR*=pf.factor; } });
    px.forEach(r=>{ if(r.date<pf.from) r.close/=pf.factor; });   // 股價圖去掉除權斷崖
  }
  const pr=px.slice().sort((a,b)=>a.date<b.date?-1:1);
  const tr=tx.slice().sort((a,b)=>a.date<b.date?-1:1);
  const fear=fearSeries(tr.map(r=>r.close));           // 大盤恐慌度：逐日
  const fdates=tr.map(r=>r.date);
  const pp=per.filter(r=>r[mKey]).sort((a,b)=>a.date<b.date?-1:1);
  const rv=rev.slice().sort((a,b)=>(a.revenue_year-b.revenue_year)||(a.revenue_month-b.revenue_month));
  const revIdx={}; rv.forEach(r=> revIdx[r.revenue_year+"-"+r.revenue_month]=r.revenue);

  const spine=pr.slice(-1320);            // 上限 5 年多一點（範圍鍵最長 5 年）
  const out=[];
  let j=-1, fi=-1, lastFear=null;
  for(const row of spine){
    const d=row.date;
    while(j+1<pp.length && pp[j+1].date<=d) j++;
    while(fi+1<fdates.length && fdates[fi+1]<=d) fi++;
    if(fi>=0 && fear[fi]) lastFear=fear[fi].score;
    // 估值便宜度＝100 − 位階（視窗樣本太少就不評分）
    let val=null, mNow=null, pctl=null;
    if(j>=0){
      const cut=perSince || shiftDays(d,-1825);     // 釘死起算日 or 近 5 年滾動
      let a=0,b=j; while(a<b){ const m=(a+b)>>1; if(pp[m].date<cut) a=m+1; else b=m; }
      if(j-a>=200){                                 // 與 build_data.py 的 PER_MIN_SAMPLES 同值，改要一起改
        mNow=pp[j][mKey]; let below=0;
        for(let k=a;k<=j;k++) if(pp[k][mKey]<=mNow) below++;
        pctl=Math.round(below/(j-a+1)*100); val=100-pctl;
      }
    }
    // 月營收 YoY：只採「那天已經公布」的月份
    let yoy=null;
    for(let k=rv.length-1;k>=0;k--){
      const r=rv[k];
      if(!monthAvail(r.revenue_year,r.revenue_month,d,today)) continue;
      const py=revIdx[(r.revenue_year-1)+"-"+r.revenue_month];
      if(py) yoy=Math.round((r.revenue-py)/py*1000)/10;
      break;
    }
    const fund = yoy==null?null:Math.round(bclamp(45+yoy*1.2));
    const comp = (val==null||lastFear==null)?null
               : Math.round(0.40*val+0.25*(fund==null?45:fund)+0.35*lastFear);
    out.push({date:d, close:row.close, comp, val, fund, yoy, mk:lastFear,
              mval: mNow==null?null:Math.round(mNow*100)/100, pctl});
  }
  HS._cache[ck]=out;
  return out;
}

  const s=(window.DATA&&window.DATA.stocks||[]).find(x=>x.code===code);

  }

  let lines="";
  if(showP){ let d=""; s.forEach((r,j)=> d+=(j?"L":"M")+X(j).toFixed(1)+" "+Yp(r.close).toFixed(1)+" ");
    lines+=`<path d="${d.trim()}" fill="none" stroke="var(--ink3)" stroke-width="1.3" opacity="${mode==="both"?".9":"1"}"/>`; }
  if(showC){ let d="",pen=false;                       // comp 可能有缺口（早期資料不足）
    s.forEach((r,j)=>{ if(r.comp==null){ pen=false; return; }
      d+=(pen?"L":"M")+X(j).toFixed(1)+" "+Yc(r.comp).toFixed(1)+" "; pen=true; });
    if(d) lines+=`<path d="${d.trim()}" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`; }

  let marks="";
  s.forEach((r,j)=>{ if(r.date.slice(5,7)==="01" && (j===0||s[j-1].date.slice(5,7)!=="01"))
    marks+=`<line x1="${X(j).toFixed(1)}" y1="${padT}" x2="${X(j).toFixed(1)}" y2="${(padT+ih).toFixed(1)}" stroke="var(--line)" stroke-width=".6" stroke-dasharray="2 2"/>`; });
  marks+=`<text x="${padL}" y="${H-6}" font-size="7.5" fill="var(--muted)">${s[0].date.slice(0,7)}</text>`;
  marks+=`<text x="${W-padR}" y="${H-6}" font-size="7.5" fill="var(--muted)" text-anchor="end">${s[n-1].date.slice(0,7)}</text>`;

  const f=s[HS.focus], fx=X(HS.focus);
  let foc=`<line id="hsfl" x1="${fx.toFixed(1)}" y1="${padT}" x2="${fx.toFixed(1)}" y2="${(padT+ih).toFixed(1)}" stroke="var(--muted)" stroke-width=".7"/>`;
  if(showP) foc+=`<circle class="focping" id="hspp" cx="${fx.toFixed(1)}" cy="${Yp(f.close).toFixed(1)}" r="3.2" fill="var(--ink3)"/>`+
                 `<circle id="hsdp" cx="${fx.toFixed(1)}" cy="${Yp(f.close).toFixed(1)}" r="2.6" fill="var(--ink3)"/>`;
  if(showC) foc+=`<circle class="focping" id="hspc" cx="${fx.toFixed(1)}" cy="${f.comp==null?0:Yc(f.comp).toFixed(1)}" r="3.2" fill="var(--tone)" opacity="${f.comp==null?0:1}"/>`+
                 `<circle id="hsdc" cx="${fx.toFixed(1)}" cy="${f.comp==null?0:Yc(f.comp).toFixed(1)}" r="2.6" fill="var(--tone)" opacity="${f.comp==null?0:1}"/>`;
  const hit=`<rect class="hshit" x="${padL}" y="${padT}" width="${iw}" height="${ih}" fill="transparent" style="cursor:crosshair;touch-action:none"/>`;
  const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${bg}${lines}${marks}${foc}${hit}</svg>`;

  const legend= mode==="both"

  HS._pts=s.map((d,j)=>({x:X(j), yc:d.comp==null?null:Yc(d.comp), yp:Yp(d.close)}));

function hsUpdateFocus(idx){          // 拖曳中即時更新（不重繪整張圖）
  if(!HS._pts||!HS._pts.length) return;
  idx=Math.max(0,Math.min(HS._pts.length-1,idx));
  if(idx===HS.focus) return;
  HS.focus=idx; const p=HS._pts[idx], d=HS._s[idx];
  if(HS._fl){ HS._fl.setAttribute("x1",p.x.toFixed(1)); HS._fl.setAttribute("x2",p.x.toFixed(1)); }
  [HS._dc,HS._pc].forEach(el=>{ if(!el) return;
    if(p.yc==null){ el.setAttribute("opacity","0"); }
    else { el.setAttribute("opacity","1"); el.setAttribute("cx",p.x.toFixed(1)); el.setAttribute("cy",p.yc.toFixed(1)); } });
  [HS._dp,HS._pp].forEach(el=>{ if(!el) return;
    el.setAttribute("cx",p.x.toFixed(1)); el.setAttribute("cy",p.yp.toFixed(1)); });
  if(HS._tip){ HS._tip.innerHTML=hsTipInner(d); placeTip(HS._tip, p.x, HS._W); }
  if(HS._det) HS._det.innerHTML=hsDetailInner(d, HS._hasComp);
}

// ── 新增／移除追蹤（送出後向 GitHub 公開 API 輪詢近即時狀態；唯讀、免 token）──
const REPO="tsai200493-Cyrus/tw-discount-dashboard";
const GHAPI="https://api.github.com/repos/"+REPO;
let TW={watch:null};  // {action:'add'|'remove', code, title, since, timer, tries}
function twStat(html,color){ const s=document.getElementById("addstatus"); if(s){ s.style.color=color||"var(--muted)"; s.innerHTML=html; } }
function twStop(){ if(TW.watch&&TW.watch.timer) clearInterval(TW.watch.timer); TW.watch=null; }

async function twPoll(){
  const w=TW.watch; if(!w) return;
  if(++w.tries>28){ twStat("（等太久了，改到 GitHub 那張單看狀態；清單仍會自動更新）"); twStop(); return; }
  let issues;
  try{
    const r=await fetch(GHAPI+"/issues?state=all&sort=created&direction=desc&per_page=15",
                        {headers:{Accept:"application/vnd.github+json"}});
    if(r.status===403){ twStat("（GitHub 查詢額度暫時用完，稍後會自動恢復；清單仍會更新）"); twStop(); return; }
    issues=await r.json();
  }catch(_){ return; }               // 網路暫斷，下一輪再試
  if(!Array.isArray(issues)) return;
  const hit=issues.find(it=> it.title && it.title.trim()===w.title
                          && new Date(it.created_at).getTime() >= w.since-60000);
  if(!hit){ twStat("⏳ 等你在 GitHub 那頁按下綠色 <b>Submit new issue</b>…"); return; }
  if(hit.state==="open"){ twStat("⏳ 已收到 <b>#"+hit.number+"</b>，機器人處理中…"); return; }
  let body="";
  try{
    const c=await fetch(GHAPI+"/issues/"+hit.number+"/comments?per_page=10",
                        {headers:{Accept:"application/vnd.github+json"}});
    const cs=await c.json();
    if(Array.isArray(cs)&&cs.length) body=(cs[cs.length-1].body||"").trim();
  }catch(_){}
  if(!body){ twStat("已處理 <b>#"+hit.number+"</b>，重新整理看結果。"); twStop(); return; }
  const color= body.startsWith("✅")?"var(--open)" : body.startsWith("ℹ️")?"var(--muted)" : "var(--shut)";
  twStat(body,color);
  const ok=body.startsWith("✅"), code=w.code, action=w.action;
  twStop();
  if(ok) twWaitData(code, action);
}

async function twWaitData(code, action){   // ✅ 後等 Pages 重佈署，清單一到就自動刷新
  for(let i=0;i<8;i++){
    await new Promise(r=>setTimeout(r,15000));
    try{
      const d=await (await fetch("./data.json?_="+Date.now())).json();
      const present=(d.stocks||[]).some(s=>s.code===code);
      if(action==="add" ? present : !present){
        render(d);
        twStat(action==="add" ? "✅ "+code+" 已出現在下方清單。" : "✅ "+code+" 已從清單移除。","var(--open)");
        return;
      }
    }catch(_){}
  }
}

function startTickerFlow(action, code){    // action: 'add' | 'remove'
  const title="["+action+"] "+code;
  const url="https://github.com/"+REPO+"/issues/new?title="+encodeURIComponent(title)+
    "&body="+encodeURIComponent((action==="remove"?"移除追蹤 ":"新增追蹤 ")+code+"，送出後系統會處理清單。");
  document.getElementById("addmsg").innerHTML='已開好 GitHub 投件頁 → 按綠色 <b>Submit new issue</b>。下面會即時顯示進度：';
  document.getElementById("addcard").scrollIntoView({behavior:"smooth",block:"start"});
  window.open(url,"_blank");
  twStop();
  TW.watch={action, code, title, since:Date.now(), timer:setInterval(twPoll,6000), tries:0};
  twStat("⏳ 等你在 GitHub 那頁按下綠色 <b>Submit new issue</b>…");
  twPoll();
}

const FM="https://api.finmindtrade.com/api/v4/data";
async function fmGet(dataset,id,start,end){
  const p=new URLSearchParams({dataset,start_date:start});
  if(id)p.set("data_id",id);
  if(end)p.set("end_date",end);
  const r=await fetch(FM+"?"+p.toString());
  const j=await r.json();
  if(j.status!==200) throw new Error("FinMind："+(j.msg||("狀態 "+j.status)));
  return j.data||[];
}
function pstdev(a){ if(!a.length)return 0; const m=a.reduce((x,y)=>x+y,0)/a.length; return Math.sqrt(a.reduce((s,v)=>s+(v-m)*(v-m),0)/a.length); }
function bclamp(x,lo=0,hi=100){ return Math.max(lo,Math.min(hi,x)); }
function shiftDays(iso,days){ const d=new Date(iso+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+days); return d.toISOString().slice(0,10); }
function shiftYears(iso,y){ const p=iso.split("-"); return String(+p[0]+y).padStart(4,"0")+"-"+p[1]+"-"+p[2]; }
// 月營收在 as_of 那天「知不知道」：法定期限是次月 10 日，多數公司更早。
// 若期限還沒到、但 FinMind 今天已經有這筆（＝已經公布了），就從「今天」起算可用——
// 這樣歷史點沒有偷看未來，最後一天又能跟 build_data.py（直接取最新一筆）對上。
function monthAvail(y,m,asof,today){
  let ny=y,nm=m+1; if(nm>12){ny++;nm=1;}
  const due=ny+"-"+String(nm).padStart(2,"0")+"-10";
  if(!today) today=new Date().toISOString().slice(0,10);
  return asof >= (due<=today ? due : today);
}

function deltaHTML(cur, prev){

  return `<span class="delta ${d>0?"up":"down"}">${d>0?"▲":"▼"}${Math.abs(d)}</span>`;

function moversHTML(d){
  const p=d.prev||{}, P=p.stocks||{};

    .filter(x=>x.v!==0).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)).slice(0,3);

         `<span class="label" style="margin-left:auto">較 ${p.date}</span></div>`;

  }
  const mp=Math.max(1,Math.min(99,m.score??50));
  return `<div class="lbl kick">Today · 今天的結論</div>

// ── 首屏右邊：白色單線溫度計，清單上每一檔都放上去 ──
function thermoSVG(list){
  const {CEIL, mktPts, cnt}=CTX;
  const WD=440, H=600, PT=16, PB=54, TX=66, TW=18, LX=124;
  const Y=v=>PT+(100-v)/100*(H-PT-PB), wh=a=>`rgba(255,255,255,${a})`;
  let g=`<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#fff" stroke-width="1" opacity=".45"/></pattern>
    <clipPath id="tube"><rect x="${TX}" y="${PT}" width="${TW}" height="${H-PT-PB}" rx="${TW/2}"/></clipPath>
    <linearGradient id="win" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".7" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>`;
  // 管身：天花板以上斜線（今天到不了）、打折區全亮（一扇窗）、觀察半亮、太貴最暗
  g+=`<g clip-path="url(#tube)"><rect x="${TX}" y="${Y(100)}" width="${TW}" height="${Y(CEIL)-Y(100)}" fill="url(#hatch)"/>
    <rect x="${TX}" y="${Y(CEIL)}" width="${TW}" height="${Y(65)-Y(CEIL)}" fill="#fff"/>
    <rect x="${TX}" y="${Y(65)}" width="${TW}" height="${Y(45)-Y(65)}" fill="${wh(.24)}"/>
    <rect x="${TX}" y="${Y(45)}" width="${TW}" height="${Y(0)-Y(45)}" fill="${wh(.1)}"/></g>
    <rect x="${TX}" y="${PT}" width="${TW}" height="${H-PT-PB}" rx="${TW/2}" fill="none" stroke="#fff" stroke-width="1.4"/>
    <circle cx="${TX+TW/2}" cy="${H-PB+19}" r="17" fill="none" stroke="#fff" stroke-width="1.4"/><circle cx="${TX+TW/2}" cy="${H-PB+19}" r="11" fill="${wh(.85)}"/>
    <rect x="${TX+TW+4}" y="${Y(CEIL)}" width="${WD-TX-TW-4}" height="${Y(65)-Y(CEIL)}" fill="url(#win)"/>
    <line x1="${TX-8}" x2="${WD}" y1="${Y(65)}" y2="${Y(65)}" stroke="#fff" stroke-width="1.4"/>
    <line x1="${TX-8}" x2="${WD}" y1="${Y(CEIL)}" y2="${Y(CEIL)}" stroke="#fff" stroke-width="1" stroke-dasharray="3 4" opacity=".7"/>
    <line x1="${TX-8}" x2="${WD}" y1="${Y(45)}" y2="${Y(45)}" stroke="#fff" stroke-width="1" opacity=".22"/>`;
  [[100,"100"],[65,"65"],[45,"45"],[0,"0"]].forEach(([v,t])=>{
    g+=`<text x="${TX-14}" y="${Y(v)+4}" text-anchor="end" font-size="11" class="num" fill="${wh(v==65?1:.6)}" font-weight="${v==65?600:400}">${t}</text>`; });
  if(CEIL<92) g+=`<text x="${LX}" y="${Y((100+CEIL)/2)-4}" font-size="13" fill="${wh(.85)}" font-weight="500">今天到不了</text>
    <text x="${LX}" y="${Y((100+CEIL)/2)+14}" font-size="11" fill="${wh(.6)}">市場分只拿 ${f1(mktPts)}／35，上限 ${Math.floor(CEIL)}</text>`;
  g+=`<text x="${WD}" y="${(Y(65)+Y(CEIL))/2+4}" text-anchor="end" font-size="10.5" class="num" fill="#fff" font-weight="600" letter-spacing="2.2">DISCOUNT · ${cnt.open||"空"}</text>
    <text x="${WD}" y="${Y(64)+13}" text-anchor="end" font-size="10" class="num" fill="${wh(.6)}" letter-spacing="2">WATCH</text>
    <text x="${WD}" y="${Y(44)+13}" text-anchor="end" font-size="10" class="num" fill="${wh(.6)}" letter-spacing="2">PRICEY</text>`;
  // 名字標籤避讓：由高分往低分排、至少隔 20px；整串只往下推會偏低，再整體往上挪回平均位置
  let lastY=-1e9;
  const pos=list.map(x=>{ const y=Math.max(Y(x.v.composite), lastY+20); lastY=y; return {x, y}; });
  if(pos.length){
    const drift=pos.reduce((a,p)=>a+p.y-Y(p.x.v.composite),0)/pos.length;
    const top=cnt.open ? Y(Math.min(100,CEIL))+8 : Y(65)+16;     // 沒人打折時，打折那一格留給「DISCOUNT · 空」
    const lift=Math.min(drift, pos[0].y-top);
    if(lift>0) pos.forEach(p=>p.y-=lift);
  }
  pos.forEach(({x,y},i)=>{ const s=x.v, dy=Y(s.composite), a=tierOf(s.composite)==="shut"?.78:1;
    g+=`<g class="lb" data-code="${s.code}" opacity="${a}">
      <circle cx="${TX+TW/2}" cy="${dy}" r="${i==0?5:3.6}" fill="${i==0?"#fff":"var(--tone)"}" stroke="#fff" stroke-width="1.6"/>
      <path d="M${TX+TW/2+6} ${dy} L${LX-16} ${dy} L${LX-5} ${y}" fill="none" stroke="${wh(.4)}" stroke-width="1"/>
      <text class="nm" x="${LX}" y="${y+4.5}" font-size="13.5" fill="#fff" font-weight="${i==0?700:500}">${s.name||s.code}</text>
      <text class="num" x="${LX+70}" y="${y+4.5}" font-size="13.5" fill="#fff" font-weight="600">${s.composite}</text>
      <text class="num" x="${LX+98}" y="${y+4.5}" font-size="11" fill="${wh(.6)}">${s.composite>=LINE?"打折":"−"+(LINE-s.composite)}</text>
      <rect x="${LX-8}" y="${y-11}" width="150" height="21" fill="transparent"/></g>`; });
  return {g, vb:`0 0 ${WD} ${H}`};
}

// ── 個股：小零件 ──
function sparkSVG(sp){
  if(!sp || sp.length<2) return "";
  const lo=Math.min(...sp), hi=Math.max(...sp), n=sp.length, yy=y=>(60-(y-lo)/((hi-lo)||1)*56).toFixed(1);
  return `<svg class="spark" viewBox="0 0 300 64" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${sp.map((y,i)=>`${(i/(n-1)*300).toFixed(1)},${yy(y)}`).join(" ")}" fill="none" stroke="var(--ink)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    <circle cx="300" cy="${yy(sp[n-1])}" r="3.5" fill="var(--tone)"/></svg>`;
}
function miniSpark(sp){
  if(!sp || sp.length<2) return `<span class="c-sp"></span>`;
  const lo=Math.min(...sp), hi=Math.max(...sp), n=sp.length;
  return `<svg class="c-sp" viewBox="0 0 90 22" preserveAspectRatio="none" aria-hidden="true"><polyline points="${sp.map((y,i)=>`${(i/(n-1)*90).toFixed(1)},${(20-(y-lo)/((hi-lo)||1)*18).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--ink2)" stroke-width="1.1" vector-effect="non-scaling-stroke"/></svg>`;
}
function revHTML(s){
  const rev=(s.revenue_history||[]).slice(-24); if(!rev.length) return "";
  const n=rev.length, mx=Math.max(...rev.map(r=>r.rev||0),1), bw=300/n, last=rev[n-1];
  let g="", hits="";
  rev.forEach((r,i)=>{ const h=(r.rev||0)/mx*66, L=i===n-1, fill=L?"var(--tone)":"var(--ink)", op=L?1:(.22+.5*i/n).toFixed(2);
    g+=`<rect class="rbar" data-i="${i}" data-f="${fill}" data-o="${op}" x="${(i*bw+bw*.18).toFixed(1)}" y="${(70-h).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}" opacity="${op}"/>`;
    hits+=`<rect class="hit" data-i="${i}" x="${(i*bw).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="84" fill="transparent"/>`;
    if(r.ym.endsWith("-01")) g+=`<text x="${(i*bw).toFixed(1)}" y="83" font-size="9" fill="var(--ink3)" font-family="Space Grotesk,sans-serif">${r.ym.slice(0,4)}</text>`; });
  return `<div class="rev chartlink nolink" data-code="${s.code}" title="點開看完整營收圖"><span class="lbl"><span>Revenue · 近 ${n} 月營收</span><span class="n rv-read">${revRead(last)}</span></span>
    <svg viewBox="0 0 300 84" preserveAspectRatio="none" aria-hidden="true">${g}${hits}</svg></div>`;
}
// 長條右上角的讀數：平常是最新一個月；滑鼠移到哪條就換成那個月
function revRead(r, hover){
  const yoy=r.yoy==null?"":`　<span class="${r.yoy>=0?"up":"down"}">YoY ${r.yoy>0?"+":""}${f1(r.yoy)}%</span>`;
  return `${r.ym}　${f1(r.rev,r.rev<100?1:0)} 億${hover?yoy:" ↗"}`;
}
function revFocus(box, i){
  const x=findX(box.dataset.code); if(!x) return;
  const rev=(x.v.revenue_history||[]).slice(-24);
  box.querySelectorAll(".rbar").forEach(b=>{ const on=i!=null && +b.dataset.i===i;
    b.setAttribute("fill", i==null ? b.dataset.f : on ? "var(--tone)" : "var(--ink)");
    b.setAttribute("opacity", i==null ? b.dataset.o : on ? 1 : Math.min(+b.dataset.o,.72)); });
  box.querySelector(".rv-read").innerHTML = i==null ? revRead(rev[rev.length-1]) : revRead(rev[i], true);
  box.dataset.focus = i==null ? "" : i;
}
document.addEventListener("pointerover", e=>{ const h=e.target.closest && e.target.closest(".rev .hit");
  if(h) revFocus(h.closest(".rev"), +h.dataset.i); });
document.addEventListener("pointerout", e=>{ const box=e.target.closest && e.target.closest(".rev");
  if(box && !box.contains(e.relatedTarget)) revFocus(box, null); });
// 點某一條＝開完整營收圖，並停在那個月（捕獲階段先記下，等原本的開圖流程跑完再對焦）
document.addEventListener("click", e=>{
  const box=e.target.closest && e.target.closest(".rev"); if(!box || box.dataset.focus==="") return;
  const x=findX(box.dataset.code); if(!x) return;
  const ym=(x.v.revenue_history||[]).slice(-24)[+box.dataset.focus]?.ym;
  setTimeout(()=>{ if(CH.code!==x.v.code || !ym) return;
    const i=x.v.revenue_history.slice(-CH.range).findIndex(r=>r.ym===ym);
    if(i>=0){ CH.focus=i; drawChart(); } }, 0);
}, true);

// 估值位階尺：藍（便宜）→橘（貴），標出中位數與現在的位置。
//
// [決策 2026-09-09｜需求人] 點的位置用「百分位」，不用 PER 的線性數值。
//   前提：PER 區間常被極端值撐爆——虧損轉盈時 EPS 趨近 0，PER 會噴到三、四位數
//     （實測：群創 2.3~1250、德宏 3.3~1391、富喬 7.7~268）。線性尺會被那個最大值
//     整條壓到最左邊，於是「比中位數貴」的股票卻畫在左半邊，看起來像在打折
//     （南亞科：位階 71%，線性位置卻只有 12%，方向相反）。
//   已知代價：尺上的距離不再等比於 PER 差距——中間擠了幾個月的資料，兩端可能各是
//     一兩天的極端值。要看絕對差距請看兩端標的實際 PER 數字。
//   ⇒ 排錯線索：中位數刻度固定在 50%（中位數＝第 50 百分位，這是定義不是硬寫死），
//     若哪天它不在正中間，是位階算錯了，不是這裡畫錯。
//   （2026-10 改版只換外觀，這條規則照舊。）
function peHTML(s){
  const lo=s.metric_min, hi=s.metric_max, md=s.metric_median, pctl=s.metric_pctl;
  if(lo==null||hi==null||pctl==null) return `<div class="dline">這檔沒有足夠的估值歷史。</div>`;
  const pos=Math.max(3,Math.min(97,pctl));
  const words= pctl<=50 ? `比過去 <b>${100-pctl}%</b> 的日子便宜` : `比過去 <b>${pctl}%</b> 的日子貴`;
  const win= s.metric_since ? `${s.metric_since.slice(0,7)} 起` : "近 5 年";
  return `<div class="pe-t">${win}　現在 <b>${esc(s.metric_val)}</b>　${words}</div>
    <div class="pe"><span class="ax"></span><span class="md" style="left:50%"></span><span class="me" style="left:${pos}%"></span>
      <span class="tx" style="left:0">便宜 ${lo}</span><span class="tx" style="left:50%;transform:translateX(-50%)">中位 ${md}</span><span class="tx" style="right:0">貴 ${hi}</span></div>`+
    (s.metric_why?`<div class="pewhy">這檔用${mName(s)}，不用本益比：${s.metric_why}</div>`:"")+
    (s.since_why?`<div class="pewhy">比較區間改過（${win}）：${s.since_why}</div>`:"")+
    (s.per_fix?`<div class="pewhy">已校正配股失真：${s.per_fix.from} 配股後股數變 ${s.per_fix.factor.toFixed(2)} 倍，資料源的每股盈餘還停在配股前，${mName(s)}被壓低了同樣倍數——這裡乘回來，整段歷史才同一把尺。</div>`:"");
}
function thesisHTML2(s){
  if(!s.thesis) return `<div class="thesis" style="color:var(--ink3)">還沒寫論點。在 <code>thesis.json</code> 替 ${s.code} 寫一兩句：為什麼持有它、什麼情況算「論點破」——之後大跌時回來重讀，決定加碼還是認賠。</div>`;
  const parts=s.thesis.split("<br>"), rest=parts.slice(1).join("<br>");
  return `<div class="thesis">${parts[0]}${rest?`<details><summary>看完整論點</summary>${rest}</details>`:""}${
    s.brk?`<span class="brk">論點破：<i>${s.brk}</i></span>`:""}</div>`;
}
function actsHTML(s){
  return `<div class="acts">${(s.revenue_history&&s.revenue_history.length)?`<button class="chartlink nolink" data-code="${s.code}">營收圖</button>`:""}`+

    `<button class="rmlink" data-code="${s.code}" title="從追蹤清單移除">移除</button></div>`;
}

    <div>

const CHEV=`<svg class="c-ch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>`;
function rowHTML(x){
  const s=x.v, dream=s.composite==null, c=priceChg(s.spark);
  return `<details class="row" id="s-${s.code}" data-code="${s.code}"><summary>
    <span class="nm">${s.name||""}<small>${s.code}</small></span>
    <span class="c-sc ${dream?"dream":""}">${dream?(s.data_warn?"資料異常":"不評分"):s.composite+deltaHTML(s.composite,prevOf(window.DATA,x.raw))}</span>
    <span class="c-gp">${dream?"":"−"+(LINE-s.composite)}</span>
    <span class="c-pe">${s.metric_pctl!=null?`<i style="left:${Math.max(3,Math.min(97,s.metric_pctl))}%"></i><em>${s.metric_pctl}%</em>`:""}</span>
    <span class="c-q">${s.quality&&s.quality.score!=null?s.quality.score:"—"}</span>
    <span class="c-3m">${chgTxt(c.q3)}</span>${miniSpark(s.spark)}${CHEV}</summary><div class="stock" data-lazy="1"></div></details>`;
}
const ROWHEAD=`<div class="rh"><span>標的</span><span>分數</span><span>差</span><span class="h-pe">估值位階</span><span class="h-q">指紋</span><span style="text-align:right">3 個月</span><span class="h-sp">走勢</span><span></span></div>`;
function findX(code){ const raw=(window.DATA.stocks||[]).find(s=>s.code===code); return raw?{raw, v:view(raw)}:null; }
// 收起來的列，點開才長出完整內容（toggle 不冒泡，用捕獲階段在外層接）
document.addEventListener("toggle", e=>{
  const dt=e.target; if(!dt.matches || !dt.matches("details.row") || !dt.open) return;
  const b=dt.querySelector("[data-lazy]"); if(!b) return;
  const x=findX(dt.dataset.code); if(!x) return;
  b.innerHTML=detailHTML(x.v, prevOf(window.DATA,x.raw)); b.removeAttribute("data-lazy"); watchHl(b);
}, true);

// ── 側邊導覽：縮小的溫度計（手機改底部細條）──
const RAIL=$id("rail"), wide=()=>innerWidth>=1180;
let RCUR=null;
function drawRail(){
  if(!CTX) return;
  const {scored, CEIL}=CTX, P=v=>wide()?`top:${100-v}%`:`left:${v}%`;
  RAIL.innerHTML=(wide()?`<span class="lbl k">Now</span><span class="tube"></span>`:`<span class="cur" id="rcur"></span><span class="line">`)+
    `<span class="win" style="${wide()?`top:${100-CEIL}%;height:${CEIL-65}%`:`left:65%;width:${CEIL-65}%`}"></span>`+
    [45,65].map(v=>`<span class="tick ${v==65?"l65":""}" style="${P(v)}"></span>`).join("")+
    scored.map(x=>`<span class="dot" data-code="${x.v.code}" style="${P(x.v.composite)}" title="${x.v.name||x.v.code} ${x.v.composite}"></span>`).join("")+
    (wide()?`<span class="cur" id="rcur"></span>`:`</span>`);
  RCUR=null; track();
}
function goStock(code){
  const el=$id("s-"+code); if(!el) return;
  if(el.tagName==="DETAILS") el.open=true;
  el.scrollIntoView({behavior:"smooth", block:"start"});
}
RAIL.addEventListener("click", e=>{ const d=e.target.closest(".dot"); if(d){ e.stopPropagation(); goStock(d.dataset.code); } });
$id("thermo").addEventListener("click", e=>{ const l=e.target.closest(".lb"); if(l){ e.stopPropagation(); goStock(l.dataset.code); } });
function track(){
  if(!CTX) return;
  const heroOut=$id("hero").getBoundingClientRect().bottom<innerHeight*.35,
        atEnd=document.querySelector(".band").getBoundingClientRect().top<innerHeight*.7;
  RAIL.classList.toggle("on", heroOut && !atEnd);
  const secs=[...document.querySelectorAll('#app [id^="s-"]')]; if(!secs.length) return;
  let now=secs[0].dataset.code; const seen=new Set();
  secs.forEach(el=>{ if(el.getBoundingClientRect().top<innerHeight*.45){ now=el.dataset.code; seen.add(el.dataset.code); } });
  if(now===RCUR) return; RCUR=now;
  const x=findX(now); if(!x) return;
  RAIL.querySelectorAll(".dot").forEach(d=>{ d.classList.toggle("now", d.dataset.code===now);
    d.classList.toggle("seen", seen.has(d.dataset.code) && d.dataset.code!==now); });
  const rc=$id("rcur"); if(!rc) return;
  rc.innerHTML=`${x.v.name||x.v.code}<b>${x.v.composite==null?"—":x.v.composite}</b>`;
  if(wide()) rc.style.top=(x.v.composite==null?100:100-x.v.composite)+"%";
}
addEventListener("scroll", ()=>requestAnimationFrame(track), {passive:true});
let RW=wide(); addEventListener("resize", ()=>{ if(wide()!==RW){ RW=wide(); drawRail(); } });

// 螢光筆：捲到才刷過去
const HLIO=("IntersectionObserver" in window) ? new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){ e.target.classList.add("in"); HLIO.unobserve(e.target); } }), {rootMargin:"0px 0px -25% 0px"}) : null;
function watchHl(scope){ scope.querySelectorAll(".rhl:not(.in)").forEach(el=> HLIO ? HLIO.observe(el) : el.classList.add("in")); }

// ── 整頁 ──
function render(d){
  window.DATA=d;
  const m=d.market||{}, W=d.weights||{value:.4,fund:.25,market:.35};
  const gen=(d.generated_at||"").replace("T"," ").replace("+00:00"," UTC");
  $id("sub").textContent="資料日 "+(m.date||"—")+"　·　產出 "+gen;
  $id("hdate").textContent=(m.date||"").slice(5).replace("-",".")+" CLOSE";
  ROOT.style.setProperty("--tone", `var(--t-${moodOf(m.score)})`);

  const V=(d.stocks||[]).map(x=>({raw:x, v:view(x)}));
  const scored=V.filter(x=>x.v.composite!=null).sort((a,b)=>b.v.composite-a.v.composite);
  const dreams=V.filter(x=>x.v.composite==null);
  const openL=scored.filter(x=>x.v.composite>=65), half=scored.filter(x=>x.v.composite>=45&&x.v.composite<65), shut=scored.filter(x=>x.v.composite<45);
  const mktPts=W.market*(m.score||0);
  CTX={W, m, mktPts, CEIL:100*W.value+100*W.fund+mktPts, scored, best:scored[0]||null,
       cnt:{open:openL.length, half:half.length, shut:shut.length}};

  $id("herotext").innerHTML=heroHTML(d);
  const th=thermoSVG(scored), svg=$id("thermo"); svg.setAttribute("viewBox", th.vb); svg.innerHTML=th.g;

  let rank=0, html="";
  const blocks=list=>list.map(x=>{ rank++; return `<article class="stock ${rank%2===0?"flip":""}" id="s-${x.v.code}" data-code="${x.v.code}">${headHTML(x.v,rank)}${detailHTML(x.v, prevOf(d,x.raw))}</article>`; }).join("");
  if(openL.length) html+=`<section class="sec"><div class="sec-h"><span class="lbl">Discount · 打折中 ${openL.length} 檔</span><h2>進到打折區了</h2>
      <p>65 分以上。溫度計不是買賣訊號——先重讀自己寫的論點，論點還在才考慮分批。</p></div>${blocks(openL)}</section>`;
  if(half.length) html+=`<section class="sec"><div class="sec-h"><span class="lbl">Watch · 觀察 ${half.length} 檔</span><h2>${openL.length?"再等一下的":"離打折線最近"}</h2>
      <p>45 到 64 分：還沒打折，但大盤一回檔、或股價一修正就可能進去。照分數高到低排。</p></div>${blocks(half)}</section>`;
  if(shut.length) html+=`<section class="sec"><div class="sec-h"><span class="lbl">Pricey · 太貴 ${shut.length} 檔</span><h2>先不用看</h2>
      <p>低於 45 分。一列一檔，點開看細節。位階那條線越靠右＝越接近比較區間裡最貴的時候。</p></div>${ROWHEAD}<div class="rows">${shut.map(rowHTML).join("")}</div></section>`;
  if(dreams.length) html+=`<section class="sec"><div class="sec-h"><span class="lbl">Dream · 本夢比 ${dreams.length} 檔</span><h2>不評分</h2>
      <p>沒有本益比可比（新藥、夢股），或估值資料對不上。只看股價，用賭注的大小對待。</p></div>${ROWHEAD}<div class="rows">${dreams.map(rowHTML).join("")}</div></section>`;
  const wv=Math.round(W.value*100), wf=Math.round(W.fund*100), wm=Math.round(W.market*100);
  html+=`<section class="sec" id="how"><div class="sec-h"><span class="lbl">How · 分數怎麼算</span><h2>三個零件，加起來 100</h2>
      <p>權重透明、沒有回測調參。65 分以上叫打折，45 到 64 觀察，45 以下太貴。這是情境傾向，不是買賣訊號。</p></div>
    <div class="how">
      <div><div class="w n">${wv}<small>%</small></div><h4>${term("val_cheap","估值便宜")}</h4><p>本益比（虧損過的用股價淨值比）在自己的比較區間排第幾。越接近區間裡最便宜的時候，分數越高。</p><div class="today">清單裡位階 ≤30% 的有 <b>${scored.filter(x=>x.v.metric_pctl!=null&&x.v.metric_pctl<=30).length}</b> 檔</div></div>
      <div><div class="w n">${wf}<small>%</small></div><h4>${term("fund","基本面")}</h4><p>最新單月營收年增率換算。營收在長，便宜才有意義；不然可能是價值陷阱。</p><div class="today">清單裡拿滿分的有 <b>${scored.filter(x=>x.v.fund>=100).length}</b> 檔</div></div>
      <div class="hot"><div class="w n">${wm}<small>%</small></div><h4>${term("market","市場恐慌")}</h4><p>大盤的乖離、回檔、波動。大家都怕的時候分數高。<b>每檔共用同一個值。</b></p><div class="today">今天給 <b>${f1(mktPts)}</b>／${wm} ⇒ 每檔上限 ${Math.floor(CTX.CEIL)}</div></div>
    </div>
    <div class="lines"><div><b class="n" style="color:var(--tone)">65</b>打折線。以上才算打折窗口打開。</div><div><b class="n">45</b>觀察線。以下先不用花時間看。</div><div><b class="n">${Math.floor(CTX.CEIL)}</b>今天的天花板，跟著大盤每天變。</div></div>
    <details class="gloss"><summary>名詞白話・怎麼操作</summary><ul id="glosslist"></ul></details></section>`;
  $id("app").innerHTML=html;

  $id("glosslist").innerHTML=
    '<li><b>怎麼操作</b>：首屏溫度計上點名字、或捲動時左邊（手機在底部）的小溫度計點一下，會跳到那一檔；名詞旁的 <i class="ic ic-info"></i> 點一下看白話解釋；分數旁 ▲▼ 是跟上一個交易日比。</li>'+
    Object.values(GLOSSARY).map(v=>"<li>"+v+"</li>").join("")+
    "<li>今日變化 ▲▼：分數跟「上一個交易日」比。▲＝時機變好（更便宜／更恐慌），▼＝變差。同一天重跑不會洗掉基準。</li>"+
    "<li>分區：打折中、觀察直接攤開；太貴、本夢比一列一檔，點開才看細節。</li>"+
    "<li>天花板：市場恐慌是每檔共用的分數。大盤貪婪時這一項拿得少，就算估值、基本面都滿分也到不了 100——溫度計上斜線那段就是今天到不了的分數。</li>"+
    '<li>營收 <i class="ic ic-bars"></i>：點營收長條或「營收圖」看歷年月營收與 YoY 成長率圖。</li>'+
    "<li>比較區間（標準／客製）：位階預設跟「自己近 5 年」比。切到「客製」改跟「這家公司現在這個樣子」的全部歷史比：業態變過的從營益率台階那一季起算（區間變短），循環股拉長到涵蓋完整循環（區間變長）。每一檔的起算日與理由寫在 <code>watchlist.txt</code>，卡片上也看得到。<b>兩套數字都在，隨時可以對照</b>——縮短區間通常會讓股票看起來比較便宜，看得到標準版才不會騙自己。</li>"+
    "<li>顏色：首屏整片的顏色＝大盤情緒（貪婪紅、中性綠、恐慌藍）；位階尺的藍→橘＝便宜→貴；股價漲跌是<b>紅漲綠跌</b>（台股慣例）。資料每交易日收盤後更新，不是即時報價。</li>"+
    '<li>歷史回測 <i class="ic ic-back"></i>：點「歷史回測・股價」，會把同一套公式對過去每一個交易日各算一次。手指按著左右滑＝時光倒流到那一天，讀數就是當時的進場時機／估值位階／營收 YoY／大盤恐慌。可切「進場時機／股價／疊圖」與 1～5 年。</li>'+
    "<li>論點：你自己記下「為什麼持有、什麼情況算論點破」。大跌時回來重讀，決定加碼還是認賠——治「看成本價捨不得賣」。</li>";
  $id("foot").innerHTML=`進場時機權重：估值便宜 ${W.value} ＋ 基本面 ${W.fund} ＋ 市場恐慌 ${W.market}（透明、未回測調參）。<br>`+(d.disclaimer||"");

  drawRail(); watchHl(document);
}
</script>
</body>
</html>
