<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打折窗口溫度計</title>
<style>
  :root{
    --bg:#f6f6f3; --card:#ffffff; --ink:#1b1c1e; --muted:#6b6f76; --line:#e6e5df;
    --open:#1f9d78; --half:#c9922a; --shut:#b0564a; --dream:#7a7d84;
    --barbg:#eceae3; --cool:#2a7fb8; --hot:#c9662a;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#15161a; --card:#1f2126; --ink:#ececed; --muted:#9aa0aa; --line:#2c2f36;
      --barbg:#2a2d34; --shadow:0 1px 3px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:820px;margin:0 auto;padding:18px 16px 96px}
  h1{font-size:1.35rem;margin:.2em 0 .1em}
  .sub{color:var(--muted);font-size:.82rem;margin-bottom:6px}
  .hint{color:var(--muted);font-size:.76rem;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .label{font-size:.75rem;color:var(--muted);letter-spacing:.02em}
  .term{border-bottom:1px dashed currentColor;cursor:pointer;padding-bottom:1px}
  .term::after{content:"ⓘ";font-size:.7em;vertical-align:super;opacity:.55;margin-left:1px}
  .chartlink{border-bottom:1px dashed currentColor;cursor:pointer}
  .chartlink::after{content:"📊";font-size:.82em;margin-left:2px}
  .mkt-score{font-size:2.6rem;font-weight:700;line-height:1}
  .mkt-tag{font-size:.95rem;font-weight:600;margin-left:8px}
  .thermo{height:14px;border-radius:8px;margin:14px 0 6px;position:relative;
    background:linear-gradient(90deg,var(--hot),#d8b24a,var(--open))}
  .thermo .mark{position:absolute;top:-5px;width:4px;height:24px;border-radius:2px;
    background:var(--ink);box-shadow:0 0 0 2px var(--card)}
  .scale{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
  .stats{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:.82rem}
  .stats b{font-variant-numeric:tabular-nums}
  .stock{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
  .stock .name{font-size:1.05rem;font-weight:650}
  .stock .code{color:var(--muted);font-size:.8rem;font-weight:400;margin-left:6px}
  .pill{font-size:.78rem;font-weight:650;padding:3px 10px;border-radius:999px;color:#fff;white-space:nowrap}
  .comp{font-size:1.7rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .metrics{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 16px;
    font-size:.8rem;color:var(--muted);margin-top:4px}
  .metrics b{color:var(--ink);font-variant-numeric:tabular-nums}
  .perbar{grid-column:1/-1;height:6px;background:var(--barbg);border-radius:4px;position:relative;margin-top:6px}
  .perbar .dot{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;
    background:var(--ink);border:2px solid var(--card);transform:translateX(-50%)}
  details{margin-top:8px;font-size:.86rem}
  summary{cursor:pointer;color:var(--muted);font-weight:600}
  details ul{padding-left:1.1em;margin:.6em 0}
  details li{margin:.3em 0}
  .foot{color:var(--muted);font-size:.76rem;margin-top:18px;line-height:1.6}
  .err{color:var(--shut);font-weight:600}
  /* 名詞白話浮層 */
  #tip{position:fixed;left:12px;right:12px;bottom:12px;max-width:796px;margin:0 auto;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
    box-shadow:0 6px 24px rgba(0,0,0,.18);display:none;z-index:50;font-size:.9rem;line-height:1.55}
  #tip.show{display:block}
  #tip .k{font-weight:700;margin-bottom:4px}
  #tip .x{float:right;color:var(--muted);font-size:.8rem}
  /* 歷年營收圖視窗 */
  #chart{position:fixed;left:8px;right:8px;bottom:8px;max-width:804px;margin:0 auto;
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;
    box-shadow:0 8px 30px rgba(0,0,0,.22);display:none;z-index:60}
  #chart.show{display:block}
  .chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .chead b{font-size:1.05rem}
  .cx{cursor:pointer;color:var(--muted);font-size:1.15rem;padding:2px 8px}
  .cbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .cbtns button{padding:5px 11px;border:1px solid var(--line);border-radius:999px;
    background:var(--bg);color:var(--muted);font-size:.8rem;cursor:pointer}
  .cbtns button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
  .csp{flex:1}
  .cread{font-size:.92rem;margin-bottom:8px;padding:7px 10px;background:var(--bg);
    border:1px solid var(--line);border-radius:8px;font-variant-numeric:tabular-nums}
  .cread b{font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <h1>打折窗口溫度計</h1>
  <div class="sub" id="sub">載入中…</div>
  <div class="hint">💡 有虛線的名詞（ⓘ）點一下看白話解釋；「營收動能📊」點一下看歷年營收圖。</div>

  <div class="card" id="addcard">
    <div class="label" style="margin-bottom:8px">＋ 新增追蹤股票</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input id="newcode" inputmode="numeric" placeholder="輸入代號，如 2454"
        style="flex:1;min-width:130px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:.95rem">
      <button id="addbtn"
        style="padding:9px 16px;border:0;border-radius:8px;background:var(--open);color:#fff;font-weight:650;cursor:pointer">送出</button>
    </div>
    <div id="addmsg" class="label" style="margin-top:8px"></div>
    <div id="addstatus" style="margin-top:6px;font-size:.86rem;font-weight:600"></div>
  </div>

  <div id="app"></div>

  <details>
    <summary>全部欄位一次看（白話）</summary>
    <ul id="glosslist"></ul>
  </details>

  <div class="foot" id="foot"></div>
</div>

<div id="tip"></div>
<div id="chart">
  <div class="chead"><b id="ctitle"></b><span class="cx">✕</span></div>
  <div class="cbtns">
    <button data-v="rev">月營收</button><button data-v="yoy">成長率 YoY</button>
    <span class="csp"></span>
    <button data-r="12">1年</button><button data-r="24">2年</button><button data-r="36">3年</button>
  </div>
  <div class="cbody"></div>
</div>

<script>
const GLOSSARY = {
  market:"市場恐慌度：全大盤共用。高＝大家在恐慌（折扣容易出現）；低＝大家貪婪、追高危險。用大盤乖離／回檔／波動算，不用位階（多頭趨勢會失真）。",
  composite:"綜合窗口：0.40×估值便宜 ＋ 0.25×基本面 ＋ 0.35×市場恐慌。≥65 窗口開（便宜＋恐慌）｜45–64 半開｜<45 窗口關（貴＋貪婪）。這是情境傾向，不是買賣訊號。",
  val_cheap:"估值便宜度：這檔的本益比，站在它自己過去 5 年的高低位置。越低（越接近自己的便宜區）分數越高（＝100 − 本益比位階）。回答「相對它自己，現在便宜還貴」。",
  fund:"基本面：公司賺不賺錢、在成長還衰退。用最新月營收年增率（YoY）換算，成長越猛分數越高。單月有雜訊，想看趨勢就點「營收動能📊」看歷年圖。",
  per:"PER（本益比）：股價 ÷ 每股盈餘。買一塊錢的獲利要付幾塊，數字越大＝買得越貴。",
  pctl:"位階：現在的本益比，站在它自己過去 5 年由低到高的第幾個百分點。越低＝越接近它自己的便宜區。",
};
const term=(k,t)=>`<span class="term" data-k="${k}">${t}</span>`;
const chartLink=(code)=>`<span class="chartlink" data-code="${code}">營收動能</span>`;
function compColor(s){ return s>=65?"var(--open)": s>=45?"var(--half)": "var(--shut)"; }
function mktColor(s){ return s>=65?"var(--open)" : s>=40?"var(--half)" : "var(--hot)"; }
function esc(x){ return x==null?"—":x; }

// ── 歷年營收圖 ──────────────────────────────
let CH={code:null, view:"rev", range:24, focus:null};
function syncBtns(){
  document.querySelectorAll("#chart .cbtns button").forEach(b=>{
    b.classList.toggle("on", b.dataset.v===CH.view || (+b.dataset.r)===CH.range);
  });
}
function openChart(code){
  const chart=document.getElementById("chart");
  const s=(window.DATA?.stocks||[]).find(x=>x.code===code);
  document.getElementById("ctitle").textContent=(s?(s.name||"")+" "+s.code:code)+"　營收";
  if(!s || !s.revenue_history || !s.revenue_history.length){
    document.querySelector("#chart .cbody").innerHTML='<div class="label">這檔沒有月營收資料（可能是興櫃/新上市/金融股）。</div>';
    chart.classList.add("show"); return;
  }
  CH.code=code; CH.focus=null; drawChart(); syncBtns(); chart.classList.add("show");
}
function drawChart(){
  const s=window.DATA.stocks.find(x=>x.code===CH.code);
  const h=s.revenue_history.slice(-CH.range);
  const isRev=CH.view==="rev";
  if(CH.focus==null) CH.focus=h.length-1;
  CH.focus=Math.max(0,Math.min(h.length-1,CH.focus));
  const val=d=> isRev?(d.rev||0):(d.yoy==null?0:d.yoy);
  const vals=h.map(val);
  const W=340,H=160,padL=30,padR=10,padT=10,padB=22;
  const iw=W-padL-padR, ih=H-padT-padB;
  const maxV=Math.max(...vals,1);
  const minV=isRev?0:Math.min(...vals,0);
  const span=(maxV-minV)||1;
  const bw=iw/h.length;
  const y=v=> padT+(maxV-v)/span*ih;
  const yz=y(0);

  // Y 軸格線＋刻度數值
  const ticks=[...new Set(isRev?[0,maxV]:[minV,0,maxV])];
  let grid="";
  ticks.forEach(tv=>{
    const yy=y(tv);
    grid+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width=".6"/>`;
    grid+=`<text x="${(padL-4).toFixed(1)}" y="${(yy+2.6).toFixed(1)}" font-size="7.5" fill="var(--muted)" text-anchor="end">${isRev?Math.round(tv):(tv>0?"+":"")+Math.round(tv)+"%"}</text>`;
  });

  // 長條＋年份分隔線＋透明點擊區（整欄可點）
  let bars="", marks="", hits="";
  h.forEach((d,i)=>{
    const v=val(d), cx=padL+i*bw;
    const bx=cx+bw*0.15, w=Math.max(1.2,bw*0.7), yv=y(v);
    const top=Math.min(yv,yz), ht=Math.max(1,Math.abs(yv-yz));
    const foc=(i===CH.focus);
    const col=isRev?"var(--cool)":(v>=0?"var(--open)":"var(--shut)");
    if(foc) bars+=`<rect x="${cx.toFixed(1)}" y="${padT}" width="${bw.toFixed(1)}" height="${ih}" fill="var(--ink)" opacity=".07"/>`;
    bars+=`<rect x="${bx.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${ht.toFixed(1)}" rx="1" fill="${col}" opacity="${foc?1:.6}"/>`;
    const mo=d.ym.slice(5);
    if(mo==="01"){
      marks+=`<line x1="${cx.toFixed(1)}" y1="${padT}" x2="${cx.toFixed(1)}" y2="${(padT+ih).toFixed(1)}" stroke="var(--line)" stroke-width=".6" stroke-dasharray="2 2"/>`;
      marks+=`<text x="${(cx+bw/2).toFixed(1)}" y="${H-6}" font-size="7.5" fill="var(--muted)" text-anchor="middle">${d.ym.slice(0,4)}</text>`;
    } else if(i===0){
      marks+=`<text x="${(cx+bw/2).toFixed(1)}" y="${H-6}" font-size="7.5" fill="var(--muted)" text-anchor="middle">${d.ym.slice(0,4)}</text>`;
    }
    hits+=`<rect class="hit" data-i="${i}" x="${cx.toFixed(1)}" y="${padT}" width="${bw.toFixed(1)}" height="${ih}" fill="transparent" style="cursor:pointer"/>`;
  });

  const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${grid}${bars}${marks}${hits}</svg>`;

  // 選中月份的讀數（同時秀營收與 YoY，不管目前看哪個檢視）
  const f=h[CH.focus];
  const yoyTxt=f.yoy==null?"—":(f.yoy>0?"+":"")+f.yoy+"%";
  const readout=`<div class="cread"><b>${f.ym}</b>　營收 <b>${f.rev}</b> 億　·　YoY <b>${yoyTxt}</b></div>`;

  document.querySelector("#chart .cbody").innerHTML=
    readout+svg+
    `<div class="label" style="margin-top:6px">${isRev?"每月營收（億元）":"月營收年增率 YoY（綠正紅負）"}　·　近 ${CH.range} 個月　·　點長條看該月數字</div>`;
}

// ── 統一點擊處理：圖表按鈕 / 關閉 / 營收開圖 / 名詞浮層 / 點外關閉 ──
document.addEventListener("click", e=>{
  const chart=document.getElementById("chart"), tip=document.getElementById("tip");
  const cbtn=e.target.closest("#chart [data-v],#chart [data-r]");
  if(cbtn){ if(cbtn.dataset.v)CH.view=cbtn.dataset.v; if(cbtn.dataset.r){CH.range=+cbtn.dataset.r; CH.focus=null;} drawChart(); syncBtns(); e.stopPropagation(); return; }
  const hit=e.target.closest("#chart .hit");
  if(hit){ CH.focus=+hit.getAttribute("data-i"); drawChart(); e.stopPropagation(); return; }
  if(e.target.closest(".cx")){ chart.classList.remove("show"); return; }
  const cl=e.target.closest(".chartlink");
  if(cl){ tip.classList.remove("show"); openChart(cl.dataset.code); e.stopPropagation(); return; }
  const t=e.target.closest(".term");
  if(t && GLOSSARY[t.dataset.k]){
    tip.innerHTML='<span class="x">點任意處關閉 ✕</span><div class="k">'+t.textContent.replace("ⓘ","")+'</div>'+GLOSSARY[t.dataset.k];
    tip.classList.add("show"); e.stopPropagation(); return;
  }
  if(!e.target.closest("#chart")) chart.classList.remove("show");
  if(!e.target.closest("#tip")) tip.classList.remove("show");
});

// ── 新增追蹤（送出後向 GitHub 公開 API 輪詢近即時狀態；唯讀、免 token）──
const REPO="tsai200493-Cyrus/tw-discount-dashboard";
const GHAPI="https://api.github.com/repos/"+REPO;
(function(){
  const btn=document.getElementById("addbtn"), inp=document.getElementById("newcode"),
        msg=document.getElementById("addmsg"), stat=document.getElementById("addstatus");
  let watch=null;  // {code, since, timer, tries}
  const setStat=(html,color)=>{ stat.style.color=color||"var(--muted)"; stat.innerHTML=html; };
  function stopWatch(){ if(watch&&watch.timer) clearInterval(watch.timer); watch=null; }

  async function poll(){
    if(!watch) return;
    if(++watch.tries>28){ setStat("（等太久了，改到 GitHub 那張單看狀態；股票仍會自動加入、資料照常更新）"); stopWatch(); return; }
    let issues;
    try{
      const r=await fetch(GHAPI+"/issues?state=all&sort=created&direction=desc&per_page=15",
                          {headers:{Accept:"application/vnd.github+json"}});
      if(r.status===403){ setStat("（GitHub 查詢額度暫時用完，稍後會自動恢復；股票仍會加入）"); stopWatch(); return; }
      issues=await r.json();
    }catch(_){ return; }               // 網路暫斷，下一輪再試
    if(!Array.isArray(issues)) return;
    const want="[add] "+watch.code;
    const hit=issues.find(it=> it.title && it.title.trim()===want
                            && new Date(it.created_at).getTime() >= watch.since-60000);
    if(!hit){ setStat("⏳ 等你在 GitHub 那頁按下綠色 <b>Submit new issue</b>…"); return; }
    if(hit.state==="open"){ setStat("⏳ 已收到 <b>#"+hit.number+"</b>，機器人驗證＋加入中…"); return; }
    // 已關閉 → 讀機器人的回覆留言
    let body="";
    try{
      const c=await fetch(GHAPI+"/issues/"+hit.number+"/comments?per_page=10",
                          {headers:{Accept:"application/vnd.github+json"}});
      const cs=await c.json();
      if(Array.isArray(cs)&&cs.length) body=(cs[cs.length-1].body||"").trim();
    }catch(_){}
    if(!body){ setStat("已處理 <b>#"+hit.number+"</b>，重新整理看結果。"); stopWatch(); return; }
    const color= body.startsWith("✅")?"var(--open)" : body.startsWith("ℹ️")?"var(--muted)" : "var(--shut)";
    setStat(body,color);
    const added=body.startsWith("✅"), code=watch.code;
    stopWatch();
    if(added) waitForData(code);
  }

  async function waitForData(code){     // ✅ 之後等 Pages 重佈署，資料一到就自動刷新清單
    for(let i=0;i<8;i++){
      await new Promise(r=>setTimeout(r,15000));
      try{
        const d=await (await fetch("./data.json?_="+Date.now())).json();
        if((d.stocks||[]).some(s=>s.code===code)){ render(d); setStat("✅ "+code+" 已出現在下方清單。","var(--open)"); return; }
      }catch(_){}
    }
  }

  function go(){
    const v=(inp.value||"").trim();
    if(!/^\d{4,6}[A-Za-z]?$/.test(v)){ msg.innerHTML='<span style="color:var(--shut)">請輸入正確代號（4 位數字，如 2454）。</span>'; return; }
    const url="https://github.com/"+REPO+"/issues/new?title="+encodeURIComponent("[add] "+v)+
      "&body="+encodeURIComponent("自動新增追蹤 "+v+"，送出後系統會驗證代號並加入清單。");
    msg.innerHTML='已開好 GitHub 投件頁 → 按綠色 <b>Submit new issue</b>。下面會即時顯示進度：';
    window.open(url,"_blank");
    stopWatch();
    watch={code:v, since:Date.now(), timer:setInterval(poll,6000), tries:0};
    setStat("⏳ 等你在 GitHub 那頁按下綠色 <b>Submit new issue</b>…");
    poll();
  }
  btn.addEventListener("click",go);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
})();

fetch("./data.json?_="+Date.now()).then(r=>r.json()).then(render).catch(()=>{
  document.getElementById("sub").innerHTML =
    '<span class="err">讀取 data.json 失敗</span>（本機請用 http 開啟，或等 GitHub Pages 上線）';
});

function render(d){
  window.DATA=d;
  const m=d.market||{};
  const gen=(d.generated_at||"").replace("T"," ").replace("+00:00"," UTC");
  document.getElementById("sub").textContent =
    "資料日 "+(m.date||"—")+"　·　產出 "+gen+"　·　溫度計，非投資建議";

  const app=document.getElementById("app");
  const markPct = Math.max(2,Math.min(98, m.score??50));
  app.innerHTML = `
    <div class="card">
      <div class="label">${term('market','市場恐慌度')}（TAIEX）</div>
      <div><span class="mkt-score" style="color:${mktColor(m.score)}">${esc(m.score)}</span>
        <span class="mkt-tag" style="color:${mktColor(m.score)}">${esc(m.tag)}</span>
        <span class="label"> / 100</span></div>
      <div class="thermo"><div class="mark" style="left:${markPct}%"></div></div>
      <div class="scale"><span>← 貪婪（該收手）</span><span>恐慌（機會）→</span></div>
      <div class="stats">
        <span>大盤 <b>${esc(m.close)}</b></span>
        <span>乖離120 <b>${m.bias>0?"+":""}${esc(m.bias)}%</b></span>
        <span>距年高 <b>${esc(m.dd)}%</b></span>
        <span>20日波動 <b>${esc(m.vol)}%</b></span>
      </div>
      ${m.margin_note?`<div class="stats"><span>${m.margin_note}</span></div>`:""}
    </div>`;

  const scored=d.stocks.filter(s=>s.composite!=null).sort((a,b)=>b.composite-a.composite);
  const dream=d.stocks.filter(s=>s.composite==null);

  for(const s of scored){
    const lo=s.per_min, hi=s.per_max, pos=(hi>lo)?((s.per-lo)/(hi-lo)*100):50;
    app.insertAdjacentHTML("beforeend",`
      <div class="card stock">
        <div><span class="name">${s.name||""}</span><span class="code">${s.code}</span></div>
        <div class="comp" style="color:${compColor(s.composite)}">${s.composite}</div>
        <div><span class="pill" style="background:${compColor(s.composite)}">${s.label}</span></div>
        <div class="label" style="text-align:right">${term('composite','綜合窗口')}/100</div>
        <div class="metrics">
          <span>現價 <b>${esc(s.price)}</b></span>
          <span>${term('per','PER')} <b>${esc(s.per)}</b>（${term('pctl','位階')} <b>${esc(s.percentile)}%</b>）</span>
          <span>${term('val_cheap','估值便宜度')} <b>${esc(s.val_cheap)}</b></span>
          <span>${chartLink(s.code)} <b>${s.yoy>0?"+":""}${esc(s.yoy)}%</b></span>
          <span>${term('fund','基本面')} <b>${esc(s.fund)}</b></span>
        </div>
        <div class="perbar"><div class="dot" style="left:${Math.max(3,Math.min(97,pos))}%"></div></div>
      </div>`);
  }
  for(const s of dream){
    app.insertAdjacentHTML("beforeend",`
      <div class="card stock">
        <div><span class="name">${s.name||""}</span><span class="code">${s.code}</span></div>
        <div class="comp label" style="font-size:.8rem;color:var(--dream)">本夢比</div>
        <div class="metrics" style="grid-column:1/-1">${s.label} — 無本益比可評分，屬新藥/夢股，請用賭注 size 對待。${s.revenue_history&&s.revenue_history.length?' '+chartLink(s.code)+'（有營收可看）':''}</div>
      </div>`);
  }

  document.getElementById("glosslist").innerHTML =
    Object.values(GLOSSARY).map(v=>"<li>"+v+"</li>").join("")+
    "<li>營收動能📊：點股票的「營收動能」可看歷年月營收與 YoY 成長率圖（可切換、選 1/2/3 年）。</li>";

  const w=d.weights||{};
  document.getElementById("foot").innerHTML =
    `綜合窗口權重：估值便宜 ${w.value} ＋ 基本面 ${w.fund} ＋ 市場恐慌 ${w.market}（透明、未回測調參）。<br>`+
    (d.disclaimer||"");
}
</script>
</body>
</html>
