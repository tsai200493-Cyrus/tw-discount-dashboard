<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打折窗口溫度計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f3ec; --panel:#faf9f4; --ink:#1d1b16; --muted:#6c665c; --line:#dcd7ca; --track:#e4dfd2;
    --accent:#2f4a3f; --open:#2f6d4f; --half:#946515; --shut:#9c3f37; --dream:#8a8478;
    --cool:#3a6a7a; --hot:#b0564a; --barbg:#e4dfd2;
    --serif:"Newsreader",Georgia,"Noto Serif TC",serif;
    --sans:"Work Sans",-apple-system,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#17150f; --panel:#201d16; --ink:#ece7dc; --muted:#9a9384; --line:#2f2b22; --track:#26221b;
      --accent:#8bb89b; --open:#5aa87d; --half:#c79a4e; --shut:#d1685f; --dream:#8f887a;
      --cool:#6fa3b5; --hot:#d1685f; --barbg:#26221b;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    line-height:1.55;-webkit-text-size-adjust:100%}
  .wrap{max-width:640px;margin:0 auto;padding:22px 18px 96px}
  h1{font-family:var(--serif);font-weight:500;font-size:1.9rem;letter-spacing:-.01em;margin:.1em 0 .12em;text-wrap:balance}
  .sub{color:var(--muted);font-size:.8rem;margin-bottom:6px}
  .hint{color:var(--muted);font-size:.76rem;margin-bottom:18px;line-height:1.6}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:16px}
  .label{font-size:.74rem;color:var(--muted);letter-spacing:.03em}
  .err{color:var(--shut);font-weight:600}

  .term{border-bottom:1px dashed currentColor;cursor:pointer}
  .term::after{content:"ⓘ";font-size:.68em;vertical-align:super;opacity:.5;margin-left:1px}
  .chartlink{border-bottom:1px dashed currentColor;cursor:pointer}
  .chartlink::after{content:"📊";font-size:.8em;margin-left:2px}
  .mklink{border-bottom:1px dashed currentColor;cursor:pointer;font-size:.85em;color:var(--muted)}
  .mklink::after{content:"📈";margin-left:2px}
  .pxlink{cursor:pointer}

  /* 市場恐慌度卡（B） */
  .mktcard{border-bottom:1px solid var(--line);padding:4px 2px 20px;margin-bottom:2px}
  .mkt-score{font-family:var(--serif);font-weight:500;font-size:3rem;line-height:1}
  .mkt-tag{font-size:.92rem;font-weight:600;margin-left:8px}
  .thermo{height:10px;border-radius:6px;margin:12px 0 6px;position:relative;
    background:linear-gradient(90deg,var(--hot),var(--half),var(--open));opacity:.85}
  .thermo .mark{position:absolute;top:-4px;width:3px;height:18px;border-radius:2px;
    background:var(--ink);transform:translateX(-50%);box-shadow:0 0 0 2px var(--bg)}
  .scale{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
  .stats{display:flex;flex-wrap:wrap;gap:5px 22px;margin-top:12px;font-size:.83rem;color:var(--muted)}
  .stats b{color:var(--ink);font-variant-numeric:tabular-nums}

  /* 股票卡：頭（識別＋動作）/ 數據 / 論點 */
  .stock{border-top:1px solid var(--line);padding:18px 2px}
  .s-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .s-name{font-weight:600;font-size:1.15rem}
  .s-code{color:var(--muted);font-weight:400;font-size:.8rem;margin-left:6px}
  .s-actions{display:flex;gap:6px;flex-shrink:0}
  .act{font:inherit;font-size:.72rem;color:var(--muted);background:transparent;border:1px solid var(--line);
    border-radius:999px;padding:3px 11px;cursor:pointer;transition:color .15s,border-color .15s;white-space:nowrap}
  .act::after{content:none !important}
  .act.btlink:hover{color:var(--ink);border-color:var(--muted)}
  .act.rmlink:hover{color:var(--shut);border-color:var(--shut)}
  .s-hero{display:flex;align-items:baseline;gap:12px;margin:10px 0 2px}
  .s-comp{font-family:var(--serif);font-weight:500;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
  .s-comp.open{color:var(--open)} .s-comp.half{color:var(--half)} .s-comp.shut{color:var(--shut)}
  .s-comp.dream{font-family:var(--sans);font-size:1rem;color:var(--dream);font-weight:600}
  .s-hero-r{display:flex;flex-direction:column;gap:3px}
  .pill{align-self:flex-start;font-size:.74rem;font-weight:500;padding:2px 11px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
  .pill.open{color:var(--open);border-color:var(--open)}
  .pill.half{color:var(--half);border-color:var(--half)}
  .pill.shut{color:var(--shut);border-color:var(--shut)}
  .price-row{display:flex;align-items:center;gap:12px;margin-top:12px}
  .price-now{font-size:.9rem;color:var(--muted);white-space:nowrap}
  .price-now b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:1rem}
  .spark{flex:1;min-width:0;cursor:pointer}
  .spark svg{display:block;width:100%}
  .spark-cap{background:none;border:0;font:inherit;font-size:.7rem;color:var(--muted);cursor:pointer;white-space:nowrap;padding:0}
  .spark-cap:hover{color:var(--accent)}
  .data{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;margin-top:14px}
  .d-item{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.85rem}
  .d-item.full{grid-column:1/-1}
  .d-k{color:var(--muted)}
  .d-v{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:500}
  .d-v.pos{color:var(--open)} .d-v.neg{color:var(--shut)}
  .meter{letter-spacing:2px;font-size:.72rem;margin-right:5px}
  .qtag{font-size:.68rem;padding:0 6px;border-radius:4px;border:1px solid var(--accent);color:var(--accent);margin-left:3px}
  .perbar{height:5px;border-radius:4px;background:var(--track);position:relative;margin-top:12px}
  .perbar .dot{position:absolute;top:-3.5px;width:12px;height:12px;border-radius:50%;
    background:var(--ink);border:2px solid var(--bg);transform:translateX(-50%)}
  .perbar-cap{font-size:.68rem;color:var(--muted);margin-top:5px}
  .thesis{margin-top:14px;border-left:2px solid var(--accent);padding-left:12px}
  .thesis>summary{list-style:none;cursor:pointer;font-size:.7rem;letter-spacing:.06em;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:6px}
  .thesis>summary::-webkit-details-marker{display:none}
  .thesis>summary::after{content:"▾";transition:transform .2s}
  .thesis[open]>summary::after{transform:rotate(180deg)}
  .thesis.empty{border-left-color:var(--line)}
  .thesis.empty>summary{color:var(--muted)}
  .thesis-body{font-size:.86rem;line-height:1.6;margin-top:7px}
  .thesis-body code{background:var(--track);padding:1px 5px;border-radius:4px;font-size:.9em}
  .thesis-break{display:block;color:var(--muted);font-size:.8rem;margin-top:4px}
  .thesis-break i{font-style:normal;color:var(--shut)}

  /* 火花線動畫（載入時畫出、末端呼吸點；尊重減少動態） */
  @keyframes sparkDraw{to{stroke-dashoffset:0}}
  @keyframes sparkArea{from{opacity:0}to{opacity:.09}}
  @keyframes sparkDot{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes sparkPing{0%{transform:scale(1);opacity:.5}70%{transform:scale(2.8);opacity:0}100%{opacity:0}}
  .spark .line{stroke-dasharray:1;stroke-dashoffset:1;animation:sparkDraw 1s ease forwards}
  .spark .area{opacity:0;animation:sparkArea .8s ease .55s forwards}
  .spark .dot{transform-box:fill-box;transform-origin:center;opacity:0;animation:sparkDot .4s ease .95s forwards}
  .spark .ping{transform-box:fill-box;transform-origin:center;opacity:0;animation:sparkPing 2.6s ease-out 1.3s infinite}
  @media (prefers-reduced-motion:reduce){
    .spark .line{animation:none;stroke-dashoffset:0}
    .spark .area{animation:none;opacity:.09}
    .spark .dot{animation:none;opacity:1}
    .spark .ping{display:none}
  }
  @media (max-width:440px){ .data{grid-template-columns:1fr} }

  details.gloss{margin-top:16px;font-size:.86rem}
  details.gloss>summary{cursor:pointer;color:var(--muted);font-weight:600}
  details.gloss ul{padding-left:1.1em;margin:.6em 0}
  details.gloss li{margin:.35em 0}
  .foot{color:var(--muted);font-size:.76rem;margin-top:22px;line-height:1.7}

  /* 浮層與圖表視窗 */
  #tip{position:fixed;left:12px;right:12px;bottom:12px;max-width:616px;margin:0 auto;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
    box-shadow:0 6px 24px rgba(0,0,0,.2);display:none;z-index:50;font-size:.9rem;line-height:1.55}
  #tip.show{display:block}
  #tip .k{font-weight:700;margin-bottom:4px}
  #tip .x{float:right;color:var(--muted);font-size:.8rem}
  #chart,#mkchart,#pxchart{position:fixed;left:8px;right:8px;bottom:8px;max-width:624px;margin:0 auto;
    background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;
    box-shadow:0 8px 30px rgba(0,0,0,.24);display:none;z-index:60}
  #chart.show,#mkchart.show,#pxchart.show{display:block}
  .chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .chead b{font-size:1.02rem;font-family:var(--serif);font-weight:500}
  .cx{cursor:pointer;color:var(--muted);font-size:1.15rem;padding:2px 8px}
  .cbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .cbtns button{padding:5px 11px;border:1px solid var(--line);border-radius:999px;
    background:var(--bg);color:var(--muted);font-size:.8rem;cursor:pointer;font-family:inherit}
  .cbtns button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .csp{flex:1}
  .cread{font-size:.9rem;margin-bottom:8px;padding:7px 10px;background:var(--bg);
    border:1px solid var(--line);border-radius:8px;font-variant-numeric:tabular-nums}
  .cread b{font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <h1>打折窗口溫度計</h1>
  <div class="sub" id="sub">載入中…</div>
  <div class="hint">💡 虛線名詞（ⓘ）點看白話解釋 · 現價火花線點開「股價歷史」 · 營收動能📊看歷年營收 · 「論點」記下你為什麼持有。</div>

  <div class="card" id="addcard">
    <div class="label" style="margin-bottom:8px">＋ 新增追蹤股票</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input id="newcode" inputmode="numeric" placeholder="輸入代號，如 2454"
        style="flex:1;min-width:130px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:.95rem">
      <button id="addbtn"
        style="padding:9px 16px;border:0;border-radius:8px;background:var(--open);color:#fff;font-weight:650;cursor:pointer">送出</button>
    </div>
    <div id="addmsg" class="label" style="margin-top:8px"></div>
    <div id="addstatus" style="margin-top:6px;font-size:.86rem;font-weight:600"></div>
  </div>

  <div id="app"></div>

  <div class="card" id="btcard">
    <div class="label" style="margin-bottom:8px">🕰 時光倒流回測（輸入代號＋日期，算「當時」的溫度計數字）</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="btcode" inputmode="numeric" placeholder="代號 如 6669"
        style="width:120px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:.95rem">
      <input id="btdate" type="date"
        style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:.95rem">
      <button id="btbtn"
        style="padding:9px 16px;border:0;border-radius:8px;background:var(--cool);color:#fff;font-weight:650;cursor:pointer">查詢</button>
    </div>
    <div id="btout" style="margin-top:8px"></div>
  </div>

  <details class="gloss">
    <summary>全部欄位一次看（白話）</summary>
    <ul id="glosslist"></ul>
  </details>

  <div class="foot" id="foot"></div>
</div>

<div id="tip"></div>
<div id="chart">
  <div class="chead"><b id="ctitle"></b><span class="cx">✕</span></div>
  <div class="cbtns">
    <button data-v="rev">月營收</button><button data-v="yoy">成長率 YoY</button>
    <span class="csp"></span>
    <button data-r="12">1年</button><button data-r="24">2年</button><button data-r="36">3年</button>
  </div>
  <div class="cbody"></div>
</div>
<div id="mkchart">
  <div class="chead"><b>市場恐慌度 · 歷史（TAIEX）</b><span class="cx">✕</span></div>
  <div class="cbtns">
    <button data-mv="fear">恐慌度</button><button data-mv="index">大盤指數</button><button data-mv="both">疊圖</button>
    <span class="csp"></span>
    <button data-mr="125">6月</button><button data-mr="250">1年</button><button data-mr="500">2年</button>
  </div>
  <div class="mkbody"></div>
</div>
<div id="pxchart">
  <div class="chead"><b id="pxtitle">股價</b><span class="cx">✕</span></div>
  <div class="cbtns">
    <button data-pr="125">6月</button><button data-pr="250">1年</button><button data-pr="500">2年</button>
    <span class="csp"></span>
    <button data-pma="1">60日均線</button>
  </div>
  <div class="pxbody"></div>
</div>

<script>
const GLOSSARY = {
  market:"市場恐慌度：全大盤共用。高＝大家在恐慌（折扣容易出現）；低＝大家貪婪、追高危險。用大盤乖離／回檔／波動算，不用位階（多頭趨勢會失真）。",
  composite:`衡量「現在貴不貴／時機」，三塊加權：<br>
    <span style="font-variant-numeric:tabular-nums">0.40×估值便宜　＋　0.25×基本面　＋　0.35×市場恐慌</span>
    <div style="margin:9px 0 7px;border-top:1px solid var(--line)"></div>
    <span style="color:var(--open)">●</span> <b>≥65</b>　窗口開（便宜＋恐慌）<br>
    <span style="color:var(--half)">●</span> <b>45–64</b>　半開（中性）<br>
    <span style="color:var(--shut)">●</span> <b>&lt;45</b>　窗口關（貴＋貪婪）
    <div class="label" style="margin-top:9px">這是情境傾向，不是買賣訊號。</div>`,
  val_cheap:"估值便宜度：這檔的本益比，站在它自己過去 5 年的高低位置。越低（越接近自己的便宜區）分數越高（＝100 − 本益比位階）。回答「相對它自己，現在便宜還貴」。",
  fund:"基本面：公司賺不賺錢、在成長還衰退。用最新月營收年增率（YoY）換算，成長越猛分數越高。單月有雜訊，想看趨勢就點「營收動能📊」看歷年圖。",
  quality:"財務指紋（品質）：這是不是一門「好生意」——用近幾完整年的 ROE（股東權益報酬率）＋毛利率水準與穩定度＋營益率算，滿分 100。跟「基本面」互補：基本面看『營收現在衝不衝』（短期動能），品質看『賺錢賺得久不久、穩不穩』（長期體質）。⚠️ 刻意不併入綜合窗口——它回答『該不該擁有』，不是『現在貴不貴』。",
  per:"PER（本益比）：股價 ÷ 每股盈餘。買一塊錢的獲利要付幾塊，數字越大＝買得越貴。",
  pctl:"位階：現在的本益比，站在它自己過去 5 年由低到高的第幾個百分點。越低＝越接近它自己的便宜區。",
};
const term=(k,t)=>`<span class="term" data-k="${k}">${t}</span>`;
const chartLink=(code)=>`<span class="chartlink" data-code="${code}">營收動能</span>`;
const btLink=(code)=>`<span class="btlink" data-code="${code}">回測</span>`;
const rmLink=(code)=>`<span class="rmlink" data-code="${code}">移除</span>`;
function compColor(s){ return s>=65?"var(--open)": s>=45?"var(--half)": "var(--shut)"; }
function mktColor(s){ return s>=65?"var(--open)" : s>=40?"var(--half)" : "var(--hot)"; }
function esc(x){ return x==null?"—":x; }

// 現價火花線（近 3 月收盤；漲綠跌紅；載入時畫出）
function sparkSVG(arr){
  if(!arr || arr.length<2) return "";
  const W=600,H=42,pad=5;
  const min=Math.min(...arr),max=Math.max(...arr),span=(max-min)||1;
  const step=(W-2*pad)/(arr.length-1);
  const X=i=>pad+i*step, Y=v=>pad+(max-v)/span*(H-2*pad);
  let line=""; arr.forEach((v,i)=> line+=(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)+" ");
  const area="M"+X(0).toFixed(1)+" "+(H-pad)+" "+arr.map((v,i)=>"L"+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ")+" L"+X(arr.length-1).toFixed(1)+" "+(H-pad)+" Z";
  const col= arr[arr.length-1]>=arr[0] ? "var(--open)" : "var(--shut)";
  const lx=X(arr.length-1).toFixed(1), ly=Y(arr[arr.length-1]).toFixed(1);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="近期股價走勢">
    <path class="area" d="${area}" fill="${col}"/>
    <path class="line" pathLength="1" d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle class="ping" cx="${lx}" cy="${ly}" r="4" fill="${col}"/>
    <circle class="dot" cx="${lx}" cy="${ly}" r="4" fill="${col}"/>
  </svg>`;
}
// 財務指紋（品質）：5 顆圓點 ＋ 分數 ＋ 一句評等
function qMeter(q){
  if(!q || q.score==null) return '<span style="color:var(--muted)">—（資料不足）</span>';
  const f=Math.round(q.score/20); let dots="";
  for(let i=0;i<5;i++) dots+=`<span style="color:${i<f?'var(--open)':'var(--line)'}">●</span>`;
  return `<span class="meter">${dots}</span>${q.score} <span class="qtag">${q.word}</span>`;
}
// 論點卡（有填→展開你寫的；沒填→提示去 thesis.json 補）
function thesisHTML(s){
  if(s.thesis){
    return `<details class="thesis"><summary>論點</summary>
      <div class="thesis-body">${s.thesis}${s.brk?`<span class="thesis-break">論點破：<i>${s.brk}</i></span>`:""}</div></details>`;
  }
  return `<details class="thesis empty"><summary>＋ 補一句論點</summary>
    <div class="thesis-body" style="color:var(--muted)">在 <code>thesis.json</code> 裡替 ${s.code} 寫一兩句：為什麼持有它、什麼情況算「論點破」——之後大跌時回來重讀，決定加碼還是認賠。</div></details>`;
}

// ── 歷年營收圖 ──────────────────────────────
let CH={code:null, view:"rev", range:24, focus:null};
function syncBtns(){
  document.querySelectorAll("#chart .cbtns button").forEach(b=>{
    b.classList.toggle("on", b.dataset.v===CH.view || (+b.dataset.r)===CH.range);
  });
}
function openChart(code){
  const chart=document.getElementById("chart");
  const s=(window.DATA?.stocks||[]).find(x=>x.code===code);
  document.getElementById("ctitle").textContent=(s?(s.name||"")+" "+s.code:code)+"　營收";
  if(!s || !s.revenue_history || !s.revenue_history.length){
    document.querySelector("#chart .cbody").innerHTML='<div class="label">這檔沒有月營收資料（可能是興櫃/新上市/金融股）。</div>';
    chart.classList.add("show"); return;
  }
  CH.code=code; CH.focus=null; drawChart(); syncBtns(); chart.classList.add("show");
}
function drawChart(){
  const s=window.DATA.stocks.find(x=>x.code===CH.code);
  const h=s.revenue_history.slice(-CH.range);
  const isRev=CH.view==="rev";
  if(CH.focus==null) CH.focus=h.length-1;
  CH.focus=Math.max(0,Math.min(h.length-1,CH.focus));
  const val=d=> isRev?(d.rev||0):(d.yoy==null?0:d.yoy);
  const vals=h.map(val);
  const W=340,H=160,padL=30,padR=10,padT=10,padB=22;
  const iw=W-padL-padR, ih=H-padT-padB;
  const maxV=Math.max(...vals,1);
  const minV=isRev?0:Math.min(...vals,0);
  const span=(maxV-minV)||1;
  const bw=iw/h.length;
  const y=v=> padT+(maxV-v)/span*ih;
  const yz=y(0);

  // Y 軸格線＋刻度數值
  const ticks=[...new Set(isRev?[0,maxV]:[minV,0,maxV])];
  let grid="";
  ticks.forEach(tv=>{
    const yy=y(tv);
    grid+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width=".6"/>`;
    grid+=`<text x="${(padL-4).toFixed(1)}" y="${(yy+2.6).toFixed(1)}" font-size="7.5" fill="var(--muted)" text-anchor="end">${isRev?Math.round(tv):(tv>0?"+":"")+Math.round(tv)+"%"}</text>`;
  });

  // 長條＋年份分隔線＋透明點擊區（整欄可點）
  let bars="", marks="", hits="";
  h.forEach((d,i)=>{
    const v=val(d), cx=padL+i*bw;
    const bx=cx+bw*0.15, w=Math.max(1.2,bw*0.7), yv=y(v);
    const top=Math.min(yv,yz), ht=Math.max(1,Math.abs(yv-yz));
    const foc=(i===CH.focus);
    const col=isRev?"var(--cool)":(v>=0?"var(--open)":"var(--shut)");
    if(foc) bars+=`<rect x="${cx.toFixed(1)}" y="${padT}" width="${bw.toFixed(1)}" height="${ih}" fill="var(--ink)" opacity=".07"/>`;
    bars+=`<rect x="${bx.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${ht.toFixed(1)}" rx="1" fill="${col}" opacity="${foc?1:.6}"/>`;
    const mo=d.ym.slice(5);
    if(mo==="01"){
      marks+=`<line x1="${cx.toFixed(1)}" y1="${padT}" x2="${cx.toFixed(1)}" y2="${(padT+ih).toFixed(1)}" stroke="var(--line)" stroke-width=".6" stroke-dasharray="2 2"/>`;
      marks+=`<text x="${(cx+bw/2).toFixed(1)}" y="${H-6}" font-size="7.5" fill="var(--muted)" text-anchor="middle">${d.ym.slice(0,4)}</text>`;
    } else if(i===0){
      marks+=`<text x="${(cx+bw/2).toFixed(1)}" y="${H-6}" font-size="7.5" fill="var(--muted)" text-anchor="middle">${d.ym.slice(0,4)}</text>`;
    }
    hits+=`<rect class="hit" data-i="${i}" x="${cx.toFixed(1)}" y="${padT}" width="${bw.toFixed(1)}" height="${ih}" fill="transparent" style="cursor:pointer"/>`;
  });

  const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${grid}${bars}${marks}${hits}</svg>`;

  // 選中月份的讀數（同時秀營收與 YoY，不管目前看哪個檢視）
  const f=h[CH.focus];
  const yoyTxt=f.yoy==null?"—":(f.yoy>0?"+":"")+f.yoy+"%";
  const readout=`<div class="cread"><b>${f.ym}</b>　營收 <b>${f.rev}</b> 億　·　YoY <b>${yoyTxt}</b></div>`;

  document.querySelector("#chart .cbody").innerHTML=
    readout+svg+
    `<div class="label" style="margin-top:6px">${isRev?"每月營收（億元）":"月營收年增率 YoY（綠正紅負）"}　·　近 ${CH.range} 個月　·　點長條看該月數字</div>`;
}

// ── 市場恐慌度歷史（把 build_data.py 的市場恐慌度公式，對每一天各算一次）──
let MK={view:"fear", range:250, focus:null, series:null, _n:0};
function fearScore(closes){   // 與 build_data.py / 回測完全同式
  const c=closes[closes.length-1], ma120=closes.slice(-120).reduce((x,y)=>x+y,0)/120;
  const bias=(c-ma120)/ma120*100;
  const hi=Math.max(...(closes.length>=250?closes.slice(-250):closes)), dd=(c-hi)/hi*100;
  const rets=[]; for(let i=1;i<closes.length;i++) rets.push(closes[i]/closes[i-1]-1);
  const vol=pstdev(rets.slice(-20))*Math.sqrt(252)*100;
  const score=Math.round(0.4*bclamp(50-bias*3.3)+0.3*bclamp(-dd*2.5)+0.3*bclamp((vol-12)/26*100));
  return {score, bias, dd, vol};
}
function mkReadInner(d, mode){        // 焦點讀數的內容（拖曳時即時換這段）
  const tag= d.score>=65?"恐慌(機會)": d.score>=40?"中性":"貪婪(該收手)";
  if(mode==="index") return `<b>${d.date}</b>　大盤 <b>${Math.round(d.close)}</b>　·　恐慌度 ${d.score}（${tag}）`;
  if(mode==="both") return `<b>${d.date}</b>　恐慌度 <b>${d.score}</b>（${tag}）　·　大盤 <b>${Math.round(d.close)}</b>`;
  return `<b>${d.date}</b>　恐慌度 <b>${d.score}</b>　·　${tag}　·　乖離 <b>${d.bias>0?"+":""}${Math.round(d.bias*10)/10}%</b>`;
}
function mkSync(){
  document.querySelectorAll("#mkchart .cbtns button").forEach(b=>{
    b.classList.toggle("on", b.dataset.mv===MK.view || (+b.dataset.mr)===MK.range);
  });
}
async function mkOpen(){
  const modal=document.getElementById("mkchart"), body=document.querySelector("#mkchart .mkbody");
  modal.classList.add("show");
  if(MK.series){ MK.focus=null; mkDraw(); mkSync(); return; }
  body.innerHTML='<div class="label">計算中…（向 FinMind 取大盤歷史，約 1~3 秒）</div>';
  try{
    const today=new Date().toISOString().slice(0,10);
    const rows=(await fmGet("TaiwanStockPrice","TAIEX",shiftDays(today,-1300),today)).sort((a,b)=>a.date<b.date?-1:1);
    const closes=rows.map(r=>r.close), dates=rows.map(r=>r.date);
    if(closes.length<260) throw new Error("大盤資料不足。");
    const series=[];
    for(let i=249;i<closes.length;i++){
      const f=fearScore(closes.slice(0,i+1));
      series.push({date:dates[i], score:f.score, close:closes[i], bias:f.bias, dd:f.dd, vol:f.vol});
    }
    MK.series=series; MK.focus=null; mkDraw(); mkSync();
  }catch(e){ body.innerHTML='<span class="err">'+(e.message||"取資料失敗")+'</span>'; }
}
function mkDraw(){
  const body=document.querySelector("#mkchart .mkbody");
  if(!MK.series || !MK.series.length){ body.innerHTML='<div class="label">抓不到大盤資料，稍後再試。</div>'; return; }
  const s=MK.series.slice(-MK.range), n=s.length; MK._n=n;
  if(MK.focus==null) MK.focus=n-1;
  MK.focus=Math.max(0,Math.min(n-1,MK.focus));
  const mode=MK.view;                       // fear | index | both
  const showFear=mode!=="index", showIndex=mode!=="fear", showBands=mode!=="index";
  const W=340,H=172,padL=30,padR=10,padT=10,padB=22, iw=W-padL-padR, ih=H-padT-padB;
  const cs=s.map(d=>d.close);
  const imin0=Math.min(...cs), imax0=Math.max(...cs), ip=(imax0-imin0)*0.05||1;
  const imin=imin0-ip, imax=imax0+ip;
  const step= n>1? iw/(n-1) : iw, X=j=> padL+j*step;
  const Yf=v=> padT+(100-v)/100*ih;                 // 恐慌度 0~100（左）
  const Yi=v=> padT+(imax-v)/((imax-imin)||1)*ih;   // 大盤點數（右）

  let bg="";
  if(showBands){
    [[65,100,"var(--open)"],[40,65,"var(--half)"],[0,40,"var(--hot)"]].forEach(z=>{
      const yt=Yf(z[1]), yb=Yf(z[0]);
      bg+=`<rect x="${padL}" y="${yt.toFixed(1)}" width="${iw}" height="${(yb-yt).toFixed(1)}" fill="${z[2]}" opacity=".10"/>`;
    });
    [65,40].forEach(t=>{ const yy=Yf(t);
      bg+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width=".6"/>`;
      bg+=`<text x="${padL-4}" y="${(yy+2.6).toFixed(1)}" font-size="7.5" fill="var(--muted)" text-anchor="end">${t}</text>`;
    });
  } else {
    [imax0,imin0].forEach(t=>{ const yy=Yi(t);
      bg+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width=".6"/>`;
      bg+=`<text x="${padL-4}" y="${(yy+2.6).toFixed(1)}" font-size="7.5" fill="var(--muted)" text-anchor="end">${Math.round(t)}</text>`;
    });
  }

  // 折線（疊圖時大盤在下、恐慌度在上）
  let lines="";
  if(showIndex){ let p=""; s.forEach((d,j)=> p+=`${X(j).toFixed(1)},${Yi(d.close).toFixed(1)} `);
    lines+=`<polyline points="${p.trim()}" fill="none" stroke="var(--cool)" stroke-width="1.4" opacity="${mode==="both"?".85":"1"}"/>`; }
  if(showFear){ let p=""; s.forEach((d,j)=> p+=`${X(j).toFixed(1)},${Yf(d.score).toFixed(1)} `);
    lines+=`<polyline points="${p.trim()}" fill="none" stroke="var(--ink)" stroke-width="1.4"/>`; }

  let marks="";
  s.forEach((d,j)=>{
    if(d.date.slice(5,7)==="01" && (j===0 || s[j-1].date.slice(5,7)!=="01"))
      marks+=`<line x1="${X(j).toFixed(1)}" y1="${padT}" x2="${X(j).toFixed(1)}" y2="${(padT+ih).toFixed(1)}" stroke="var(--line)" stroke-width=".6" stroke-dasharray="2 2"/>`;
  });
  marks+=`<text x="${padL}" y="${H-6}" font-size="7.5" fill="var(--muted)">${s[0].date.slice(0,7)}</text>`;
  marks+=`<text x="${W-padR}" y="${H-6}" font-size="7.5" fill="var(--muted)" text-anchor="end">${s[n-1].date.slice(0,7)}</text>`;

  const f=s[MK.focus], fx=X(MK.focus);
  let foc=`<line id="mkfl" x1="${fx.toFixed(1)}" y1="${padT}" x2="${fx.toFixed(1)}" y2="${(padT+ih).toFixed(1)}" stroke="var(--muted)" stroke-width=".7"/>`;
  if(showIndex) foc+=`<circle id="mkdi" cx="${fx.toFixed(1)}" cy="${Yi(f.close).toFixed(1)}" r="2.6" fill="var(--cool)"/>`;
  if(showFear) foc+=`<circle id="mkdf" cx="${fx.toFixed(1)}" cy="${Yf(f.score).toFixed(1)}" r="2.6" fill="var(--ink)"/>`;
  const hit=`<rect class="mkhit" x="${padL}" y="${padT}" width="${iw}" height="${ih}" fill="transparent" style="cursor:crosshair;touch-action:none"/>`;
  const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${bg}${lines}${marks}${foc}${hit}</svg>`;

  const legend= mode==="both"
    ? `<div class="label" style="margin-bottom:4px"><span style="color:var(--ink)">━ 恐慌度(左 0–100)</span>　<span style="color:var(--cool)">━ 大盤(右 ${Math.round(imin0)}–${Math.round(imax0)})</span></div>`
    : "";
  const sc=s.map(d=>d.score);
  const cap= mode==="index"
    ? `大盤點數　·　手指按著左右滑看每日　·　可切「恐慌度」或「疊圖」`
    : mode==="both"
    ? `看情緒與指數的時間關係（誰領先、形狀），不是比大小　·　手指按著左右滑`
    : `恐慌度區間 ${Math.min(...sc)}~${Math.max(...sc)}　·　綠=便宜/機會、紅=貪婪/該收手　·　手指按著左右滑`;
  body.innerHTML=legend+`<div class="cread" id="mkread">${mkReadInner(f,mode)}</div>`+svg+`<div class="label" style="margin-top:6px">${cap}</div>`;

  // 拖曳掃描用：預存每點座標＋焦點元素參照，滑動時只改焦點、不重繪整張
  MK._pts=s.map((d,j)=>({x:X(j), yf:Yf(d.score), yi:Yi(d.close)}));
  MK._s=s; MK._mode=mode;
  MK._fl=body.querySelector("#mkfl"); MK._df=body.querySelector("#mkdf"); MK._di=body.querySelector("#mkdi"); MK._read=body.querySelector("#mkread");
}
function mkUpdateFocus(idx){          // 拖曳中即時更新（輕量，不呼叫 mkDraw）
  if(!MK._pts || !MK._pts.length) return;
  idx=Math.max(0,Math.min(MK._pts.length-1,idx));
  if(idx===MK.focus) return;
  MK.focus=idx;
  const p=MK._pts[idx], d=MK._s[idx];
  if(MK._fl){ MK._fl.setAttribute("x1",p.x.toFixed(1)); MK._fl.setAttribute("x2",p.x.toFixed(1)); }
  if(MK._df){ MK._df.setAttribute("cx",p.x.toFixed(1)); MK._df.setAttribute("cy",p.yf.toFixed(1)); }
  if(MK._di){ MK._di.setAttribute("cx",p.x.toFixed(1)); MK._di.setAttribute("cy",p.yi.toFixed(1)); }
  if(MK._read) MK._read.innerHTML=mkReadInner(d, MK._mode);
}
(function(){                          // 拖曳掃描：按著在圖上左右滑，焦點跟著跑
  const modal=document.getElementById("mkchart"); if(!modal) return;
  let dragging=false;
  function idxFromX(clientX){
    const hitEl=modal.querySelector(".mkhit"); if(!hitEl || !MK._n) return null;
    const r=hitEl.getBoundingClientRect();
    return Math.round(bclamp((clientX-r.left)/r.width,0,1)*(MK._n-1));
  }
  modal.addEventListener("pointerdown", e=>{
    if(!e.target.closest(".mkhit")) return;
    dragging=true; const i=idxFromX(e.clientX); if(i!=null) mkUpdateFocus(i); e.preventDefault();
  });
  window.addEventListener("pointermove", e=>{
    if(!dragging) return; const i=idxFromX(e.clientX); if(i!=null) mkUpdateFocus(i); e.preventDefault();
  });
  window.addEventListener("pointerup", ()=>{ dragging=false; });
  window.addEventListener("pointercancel", ()=>{ dragging=false; });
})();

function pxSync(){

function pxReadInner(d){ return `<b>${d.date}</b>　收盤 <b>${Math.round(d.close*100)/100}</b>`; }

function pxDraw(){

// ── 統一點擊處理：圖表按鈕 / 關閉 / 營收開圖 / 名詞浮層 / 點外關閉 ──
document.addEventListener("click", e=>{
  const chart=document.getElementById("chart"), tip=document.getElementById("tip");
  const cbtn=e.target.closest("#chart [data-v],#chart [data-r]");
  if(cbtn){ if(cbtn.dataset.v)CH.view=cbtn.dataset.v; if(cbtn.dataset.r){CH.range=+cbtn.dataset.r; CH.focus=null;} drawChart(); syncBtns(); e.stopPropagation(); return; }
  const hit=e.target.closest("#chart .hit");
  if(hit){ CH.focus=+hit.getAttribute("data-i"); drawChart(); e.stopPropagation(); return; }
  const mbtn=e.target.closest("#mkchart [data-mv],#mkchart [data-mr]");
  if(mbtn){ if(mbtn.dataset.mv)MK.view=mbtn.dataset.mv; if(mbtn.dataset.mr){MK.range=+mbtn.dataset.mr; MK.focus=null;} mkDraw(); mkSync(); e.stopPropagation(); return; }
  const mh=e.target.closest("#mkchart .mkhit");
  if(mh){ const r=mh.getBoundingClientRect(); const frac=bclamp((e.clientX-r.left)/r.width,0,1); MK.focus=Math.round(frac*(MK._n-1)); mkDraw(); e.stopPropagation(); return; }
  const pbtn=e.target.closest("#pxchart [data-pr],#pxchart [data-pma]");
  if(pbtn){ if(pbtn.dataset.pr){PX.range=+pbtn.dataset.pr; PX.focus=null;} if(pbtn.dataset.pma!=null){PX.ma=!PX.ma;} pxDraw(); pxSync(); e.stopPropagation(); return; }
  const ph=e.target.closest("#pxchart .pxhit");
  if(ph){ const r=ph.getBoundingClientRect(); PX.focus=Math.round(bclamp((e.clientX-r.left)/r.width,0,1)*(PX._n-1)); pxDraw(); e.stopPropagation(); return; }
  const cx=e.target.closest(".cx");
  if(cx){ const m=cx.closest("#chart,#mkchart,#pxchart"); if(m) m.classList.remove("show"); return; }
  const cl=e.target.closest(".chartlink");
  if(cl){ tip.classList.remove("show"); openChart(cl.dataset.code); e.stopPropagation(); return; }
  const bl=e.target.closest(".btlink");
  if(bl){ tip.classList.remove("show"); const ci=document.getElementById("btcode");
    if(ci){ ci.value=bl.dataset.code; document.getElementById("btcard").scrollIntoView({behavior:"smooth",block:"center"}); ci.focus(); }
    e.stopPropagation(); return; }
  const ml=e.target.closest(".mklink");
  if(ml){ tip.classList.remove("show"); mkOpen(); e.stopPropagation(); return; }
  const px=e.target.closest(".pxlink");
  if(px){ tip.classList.remove("show"); pxOpen(px.dataset.code); e.stopPropagation(); return; }
  const rl=e.target.closest(".rmlink");
  if(rl){ tip.classList.remove("show"); const code=rl.dataset.code;
    if(confirm("確定要把 "+code+" 從追蹤清單移除嗎？")) startTickerFlow("remove", code);
    e.stopPropagation(); return; }
  const t=e.target.closest(".term");
  if(t && GLOSSARY[t.dataset.k]){
    tip.innerHTML='<span class="x">點任意處關閉 ✕</span><div class="k">'+t.textContent.replace("ⓘ","")+'</div>'+GLOSSARY[t.dataset.k];
    tip.classList.add("show"); e.stopPropagation(); return;
  }
  if(!e.target.closest("#chart")) chart.classList.remove("show");
  const mkc=document.getElementById("mkchart");
  if(mkc && !e.target.closest("#mkchart")) mkc.classList.remove("show");
  const pxc=document.getElementById("pxchart");
  if(pxc && !e.target.closest("#pxchart")) pxc.classList.remove("show");
  if(!e.target.closest("#tip")) tip.classList.remove("show");
});

// ── 新增／移除追蹤（送出後向 GitHub 公開 API 輪詢近即時狀態；唯讀、免 token）──
const REPO="tsai200493-Cyrus/tw-discount-dashboard";
const GHAPI="https://api.github.com/repos/"+REPO;
let TW={watch:null};  // {action:'add'|'remove', code, title, since, timer, tries}
function twStat(html,color){ const s=document.getElementById("addstatus"); if(s){ s.style.color=color||"var(--muted)"; s.innerHTML=html; } }
function twStop(){ if(TW.watch&&TW.watch.timer) clearInterval(TW.watch.timer); TW.watch=null; }

async function twPoll(){
  const w=TW.watch; if(!w) return;
  if(++w.tries>28){ twStat("（等太久了，改到 GitHub 那張單看狀態；清單仍會自動更新）"); twStop(); return; }
  let issues;
  try{
    const r=await fetch(GHAPI+"/issues?state=all&sort=created&direction=desc&per_page=15",
                        {headers:{Accept:"application/vnd.github+json"}});
    if(r.status===403){ twStat("（GitHub 查詢額度暫時用完，稍後會自動恢復；清單仍會更新）"); twStop(); return; }
    issues=await r.json();
  }catch(_){ return; }               // 網路暫斷，下一輪再試
  if(!Array.isArray(issues)) return;
  const hit=issues.find(it=> it.title && it.title.trim()===w.title
                          && new Date(it.created_at).getTime() >= w.since-60000);
  if(!hit){ twStat("⏳ 等你在 GitHub 那頁按下綠色 <b>Submit new issue</b>…"); return; }
  if(hit.state==="open"){ twStat("⏳ 已收到 <b>#"+hit.number+"</b>，機器人處理中…"); return; }
  let body="";
  try{
    const c=await fetch(GHAPI+"/issues/"+hit.number+"/comments?per_page=10",
                        {headers:{Accept:"application/vnd.github+json"}});
    const cs=await c.json();
    if(Array.isArray(cs)&&cs.length) body=(cs[cs.length-1].body||"").trim();
  }catch(_){}
  if(!body){ twStat("已處理 <b>#"+hit.number+"</b>，重新整理看結果。"); twStop(); return; }
  const color= body.startsWith("✅")?"var(--open)" : body.startsWith("ℹ️")?"var(--muted)" : "var(--shut)";
  twStat(body,color);
  const ok=body.startsWith("✅"), code=w.code, action=w.action;
  twStop();
  if(ok) twWaitData(code, action);
}

async function twWaitData(code, action){   // ✅ 後等 Pages 重佈署，清單一到就自動刷新
  for(let i=0;i<8;i++){
    await new Promise(r=>setTimeout(r,15000));
    try{
      const d=await (await fetch("./data.json?_="+Date.now())).json();
      const present=(d.stocks||[]).some(s=>s.code===code);
      if(action==="add" ? present : !present){
        render(d);
        twStat(action==="add" ? "✅ "+code+" 已出現在下方清單。" : "✅ "+code+" 已從清單移除。","var(--open)");
        return;
      }
    }catch(_){}
  }
}

function startTickerFlow(action, code){    // action: 'add' | 'remove'
  const title="["+action+"] "+code;
  const url="https://github.com/"+REPO+"/issues/new?title="+encodeURIComponent(title)+
    "&body="+encodeURIComponent((action==="remove"?"移除追蹤 ":"新增追蹤 ")+code+"，送出後系統會處理清單。");
  document.getElementById("addmsg").innerHTML='已開好 GitHub 投件頁 → 按綠色 <b>Submit new issue</b>。下面會即時顯示進度：';
  document.getElementById("addcard").scrollIntoView({behavior:"smooth",block:"start"});
  window.open(url,"_blank");
  twStop();
  TW.watch={action, code, title, since:Date.now(), timer:setInterval(twPoll,6000), tries:0};
  twStat("⏳ 等你在 GitHub 那頁按下綠色 <b>Submit new issue</b>…");
  twPoll();
}

(function(){   // 綁定上方「＋新增追蹤」輸入框

// ── 時光倒流回測（瀏覽器直接算；資料取自 FinMind 公開 API，唯讀免 token）──
// 公式與 build_data.py 一致，只餵「as_of 當下拿得到」的資料。
const FM="https://api.finmindtrade.com/api/v4/data";
async function fmGet(dataset,id,start,end){
  const p=new URLSearchParams({dataset,start_date:start});
  if(id)p.set("data_id",id);
  if(end)p.set("end_date",end);
  const r=await fetch(FM+"?"+p.toString());
  const j=await r.json();
  if(j.status!==200) throw new Error("FinMind："+(j.msg||("狀態 "+j.status)));
  return j.data||[];
}
function pstdev(a){ if(!a.length)return 0; const m=a.reduce((x,y)=>x+y,0)/a.length; return Math.sqrt(a.reduce((s,v)=>s+(v-m)*(v-m),0)/a.length); }
function bclamp(x,lo=0,hi=100){ return Math.max(lo,Math.min(hi,x)); }
function shiftDays(iso,days){ const d=new Date(iso+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+days); return d.toISOString().slice(0,10); }
function shiftYears(iso,y){ const p=iso.split("-"); return String(+p[0]+y).padStart(4,"0")+"-"+p[1]+"-"+p[2]; }
function monthAvail(y,m,asof){ let ny=y,nm=m+1; if(nm>12){ny++;nm=1;} return (ny+"-"+String(nm).padStart(2,"0")+"-10")<=asof; } // 月營收約次月10日才公布

async function backtest(code,asof){
  const [taiex,price,per,rev]=await Promise.all([
    fmGet("TaiwanStockPrice","TAIEX",shiftDays(asof,-620),asof),
    fmGet("TaiwanStockPrice",code,shiftDays(asof,-40),asof),
    fmGet("TaiwanStockPER",code,shiftDays(asof,-1835),asof),
    fmGet("TaiwanStockMonthRevenue",code,shiftDays(asof,-470),asof),
  ]);
  const pr=price.filter(r=>r.date<=asof).sort((a,b)=>a.date<b.date?-1:1);
  if(!pr.length) throw new Error("查無代號，或 "+asof+" 當時還沒有這檔的股價。");
  // 市場恐慌度
  const tx=taiex.filter(r=>r.date<=asof).sort((a,b)=>a.date<b.date?-1:1);
  const closes=tx.map(r=>r.close);
  if(closes.length<130) throw new Error("大盤資料不足（日期可能太早）。");
  const c=closes[closes.length-1], ma120=closes.slice(-120).reduce((x,y)=>x+y,0)/120;
  const bias=(c-ma120)/ma120*100;
  const hi=Math.max(...(closes.length>=250?closes.slice(-250):closes)), dd=(c-hi)/hi*100;
  const rets=[]; for(let i=1;i<closes.length;i++) rets.push(closes[i]/closes[i-1]-1);
  const vol=pstdev(rets.slice(-20))*Math.sqrt(252)*100;
  const mkf=Math.round(0.4*bclamp(50-bias*3.3)+0.3*bclamp(-dd*2.5)+0.3*bclamp((vol-12)/26*100));
  const mtag= mkf>=65?"恐慌(機會)": mkf>=40?"中性":"貪婪(該收手)";
  // PER 位階（近 5 年）
  const cut=shiftDays(asof,-1825);   // 近 5 年＝1825 天，與 build_data.py 一致
  const pp=per.filter(r=> r.date>=cut && r.date<=asof && r.PER!=null && r.PER!==0).sort((a,b)=>a.date<b.date?-1:1);
  let perNow=null,pctl=null,pmin=null,pmed=null,pmax=null,valCheap=null;
  if(pp.length){
    const vals=pp.map(r=>r.PER); perNow=pp[pp.length-1].PER;
    pctl=Math.round(vals.filter(v=>v<=perNow).length/vals.length*100);
    const s2=[...vals].sort((a,b)=>a-b); pmin=s2[0]; pmed=s2[Math.floor(s2.length/2)]; pmax=s2[s2.length-1];
    valCheap=100-pctl;
  }
  // 月營收 YoY（考慮公布落後）
  const rv=rev.slice().sort((a,b)=>(a.revenue_year-b.revenue_year)||(a.revenue_month-b.revenue_month));
  const idx={}; rv.forEach(r=> idx[r.revenue_year+"-"+r.revenue_month]=r.revenue);
  const avail=rv.filter(r=> monthAvail(r.revenue_year,r.revenue_month,asof));
  let yoy=null,ym=null,fund=null;
  if(avail.length){
    const last=avail[avail.length-1]; ym=last.revenue_year+"-"+String(last.revenue_month).padStart(2,"0");
    const py=idx[(last.revenue_year-1)+"-"+last.revenue_month];
    if(py){ yoy=Math.round((last.revenue-py)/py*1000)/10; fund=Math.round(bclamp(45+yoy*1.2)); }
  }
  let comp=null,label;
  if(valCheap!=null){
    comp=Math.round(0.40*valCheap+0.25*(fund!=null?fund:45)+0.35*mkf);
    label= comp>=65?"窗口開(便宜+恐慌)": comp>=45?"半開(中性)":"窗口關(貴+貪婪)";
  } else { label="無本益比(本夢比)，只能參考營收與大盤"; }
  const r1=x=>x==null?null:Math.round(x*10)/10;
  return {code, asof:pr[pr.length-1].date, px:pr[pr.length-1].close, mkf, mtag,
          bias:r1(bias), dd:r1(dd), vol:r1(vol),
          perNow: perNow==null?null:Math.round(perNow*100)/100, pctl, valCheap,
          pmin:r1(pmin), pmed:r1(pmed), pmax:r1(pmax), ym, yoy, fund, comp, label};
}

function btRender(s,name){
  const col= s.comp==null?"var(--muted)":compColor(s.comp);
  const row=(k,v)=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px solid var(--line)"><span class="label">${k}</span><span style="font-variant-numeric:tabular-nums;text-align:right">${v}</span></div>`;
  return `<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px">
      <b>${name||""} ${s.code}</b><span class="label">資料日 ${s.asof}</span></div>
    <div style="font-size:1.9rem;font-weight:700;color:${col};line-height:1.1">${s.comp==null?"—":s.comp}<span class="label" style="font-size:.8rem;font-weight:400">／100　${s.label}</span></div>
    <div style="margin-top:6px">
      ${row("收盤價", s.px)}
      ${row("市場恐慌度", s.mkf+"　"+s.mtag)}
      ${row("　乖離120／距年高／20日波動", (s.bias>0?"+":"")+s.bias+"%　/　"+s.dd+"%　/　"+s.vol+"%")}
      ${row("PER 本益比", s.perNow==null?"—（本夢比）":s.perNow)}
      ${row("PER 位階（近5年）", s.pctl==null?"—":s.pctl+"%　區間 "+s.pmin+"~"+s.pmax+"（中位 "+s.pmed+"）")}
      ${row("估值便宜度", s.valCheap==null?"—":s.valCheap)}
      ${row("最新可得月營收 YoY", s.ym==null?"—":s.ym+"　"+(s.yoy==null?"—":(s.yoy>0?"+":"")+s.yoy+"%"))}
      ${row("基本面", s.fund==null?"—":s.fund)}
    </div>
    <div class="label" style="margin-top:8px">同一套算法、只餵「當時」拿得到的資料。絕對股價會被配股扭曲，重點看「位階」。</div>`;
}

(function(){
  const card=document.getElementById("btcard"); if(!card) return;
  const codeI=card.querySelector("#btcode"), dateI=card.querySelector("#btdate"),
        btn=card.querySelector("#btbtn"), out=card.querySelector("#btout");
  const today=new Date().toISOString().slice(0,10);
  dateI.max=today; if(!dateI.value) dateI.value="2026-01-31";
  async function run(){
    const code=(codeI.value||"").trim(), asof=dateI.value;
    if(!/^\d{4,6}[A-Za-z]?$/.test(code)){ out.innerHTML='<span class="err">請輸入正確代號（如 6669）。</span>'; return; }
    if(!asof){ out.innerHTML='<span class="err">請選一個日期。</span>'; return; }
    out.innerHTML='<span class="label">計算中…（向 FinMind 拿歷史資料，約 1~3 秒）</span>';
    try{
      const s=await backtest(code,asof);
      const known=(window.DATA&&window.DATA.stocks||[]).find(x=>x.code===code);
      out.innerHTML=btRender(s, known?known.name:"");
    }catch(e){ out.innerHTML='<span class="err">'+(e.message||"查詢失敗，請稍後再試")+'</span>'; }
  }
  btn.addEventListener("click",run);
  codeI.addEventListener("keydown",e=>{ if(e.key==="Enter") run(); });
  dateI.addEventListener("keydown",e=>{ if(e.key==="Enter") run(); });
})();

function render(d){
  window.DATA=d;
  const m=d.market||{};
  const gen=(d.generated_at||"").replace("T"," ").replace("+00:00"," UTC");
  document.getElementById("sub").textContent =
    "資料日 "+(m.date||"—")+"　·　產出 "+gen+"　·　溫度計，非投資建議";

  const app=document.getElementById("app");
  const markPct = Math.max(2,Math.min(98, m.score??50));
  app.innerHTML = `
    <div class="mktcard">
      <div class="label">${term('market','市場恐慌度')}（TAIEX）　<span class="mklink">看歷史</span></div>
      <div style="margin-top:2px"><span class="mkt-score" style="color:${mktColor(m.score)}">${esc(m.score)}</span>
        <span class="mkt-tag" style="color:${mktColor(m.score)}">${esc(m.tag)}</span>
        <span class="label"> / 100</span></div>
      <div class="thermo"><div class="mark" style="left:${markPct}%"></div></div>
      <div class="scale"><span>← 貪婪（該收手）</span><span>恐慌（機會）→</span></div>
      <div class="stats">
        <span>大盤 <b>${esc(m.close)}</b></span>
        <span>乖離120 <b>${m.bias>0?"+":""}${esc(m.bias)}%</b></span>
        <span>距年高 <b>${esc(m.dd)}%</b></span>
        <span>20日波動 <b>${esc(m.vol)}%</b></span>
      </div>
      ${m.margin_note?`<div class="stats"><span>${m.margin_note}</span></div>`:""}
    </div>`;

  const scored=d.stocks.filter(s=>s.composite!=null).sort((a,b)=>b.composite-a.composite);
  const dream=d.stocks.filter(s=>s.composite==null);

  for(const s of scored){
    const band= s.composite>=65?"open": s.composite>=45?"half":"shut";
    const lo=s.per_min, hi=s.per_max, pos=(hi>lo)?((s.per-lo)/(hi-lo)*100):50;
    const yoyTxt = s.yoy==null?"—":(s.yoy>0?"+":"")+s.yoy+"%";
    const yoyCls = s.yoy==null?"":(s.yoy>=0?"pos":"neg");
    app.insertAdjacentHTML("beforeend",`
      <div class="stock">
        <div class="s-head">
          <div class="s-name">${s.name||""}<span class="s-code">${s.code}</span></div>
          <div class="s-actions">
            <button class="act btlink" data-code="${s.code}">回測</button>
            <button class="act rmlink" data-code="${s.code}">移除</button>
          </div>
        </div>
        <div class="s-hero">
          <span class="s-comp ${band}">${s.composite}</span>
          <div class="s-hero-r"><span class="pill ${band}">${s.label}</span><span class="label">${term('composite','綜合窗口')} / 100</span></div>
        </div>
        <div class="price-row">
          <span class="price-now">現價 <b>${esc(s.price)}</b></span>
          <span class="spark pxlink" data-code="${s.code}">${sparkSVG(s.spark)}</span>
          <button class="spark-cap pxlink" data-code="${s.code}">近3月 · 看歷史 →</button>
        </div>
        <div class="data">
          <div class="d-item"><span class="d-k">${term('per','PER')}（${term('pctl','位階')}）</span><span class="d-v">${esc(s.per)} · ${esc(s.percentile)}%</span></div>
          <div class="d-item"><span class="d-k">${term('val_cheap','估值便宜度')}</span><span class="d-v">${esc(s.val_cheap)}</span></div>
          <div class="d-item"><span class="d-k">${chartLink(s.code)}</span><span class="d-v ${yoyCls}">${yoyTxt}</span></div>
          <div class="d-item"><span class="d-k">${term('fund','基本面')}</span><span class="d-v">${esc(s.fund)}</span></div>
          <div class="d-item full"><span class="d-k">${term('quality','財務指紋（品質）')}</span><span class="d-v">${qMeter(s.quality)}</span></div>
        </div>
        <div class="perbar"><div class="dot" style="left:${Math.max(3,Math.min(97,pos))}%"></div></div>
        <div class="perbar-cap">本益比位階（越左＝越接近自己的便宜區）</div>
        ${thesisHTML(s)}
      </div>`);
  }
  for(const s of dream){
    app.insertAdjacentHTML("beforeend",`
      <div class="stock">
        <div class="s-head">
          <div class="s-name">${s.name||""}<span class="s-code">${s.code}</span></div>
          <div class="s-actions"><button class="act rmlink" data-code="${s.code}">移除</button></div>
        </div>
        <div class="s-hero"><span class="s-comp dream">本夢比</span></div>
        <div class="price-row">
          <span class="price-now">現價 <b>${esc(s.price)}</b></span>
          <span class="spark pxlink" data-code="${s.code}">${sparkSVG(s.spark)}</span>
          <button class="spark-cap pxlink" data-code="${s.code}">看歷史 →</button>
        </div>
        <div class="thesis-body" style="color:var(--muted);font-size:.82rem;margin-top:10px">${s.label} — 無本益比可評分，屬新藥/夢股，請用賭注 size 對待。${s.revenue_history&&s.revenue_history.length?' '+chartLink(s.code):''}</div>
        ${thesisHTML(s)}
      </div>`);
  }

  document.getElementById("glosslist").innerHTML =
    Object.values(GLOSSARY).map(v=>"<li>"+v+"</li>").join("")+
    "<li>營收動能📊：點「營收動能」看歷年月營收與 YoY 成長率圖。</li>"+
    "<li>現價火花線：現價旁的小走勢線＝近 3 月股價；點它開「股價歷史」（可選 6月/1年/2年、疊 60 日均線、手指拖曳看每日）。</li>"+
    "<li>論點：你自己記下「為什麼持有、什麼情況算論點破」。大跌時回來重讀，決定加碼還是認賠——治「看成本價捨不得賣」。</li>";

  const w=d.weights||{};
  document.getElementById("foot").innerHTML =
    `綜合窗口權重：估值便宜 ${w.value} ＋ 基本面 ${w.fund} ＋ 市場恐慌 ${w.market}（透明、未回測調參）。<br>`+
    (d.disclaimer||"");
}
