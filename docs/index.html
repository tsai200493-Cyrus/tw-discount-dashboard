<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打折窗口溫度計</title>
<style>
  :root{
    --bg:#f6f6f3; --card:#ffffff; --ink:#1b1c1e; --muted:#6b6f76; --line:#e6e5df;
    --open:#1f9d78; --half:#c9922a; --shut:#b0564a; --dream:#7a7d84;
    --barbg:#eceae3; --cool:#2a7fb8; --hot:#c9662a;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#15161a; --card:#1f2126; --ink:#ececed; --muted:#9aa0aa; --line:#2c2f36;
      --barbg:#2a2d34; --shadow:0 1px 3px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:820px;margin:0 auto;padding:18px 16px 96px}
  h1{font-size:1.35rem;margin:.2em 0 .1em}
  .sub{color:var(--muted);font-size:.82rem;margin-bottom:6px}
  .hint{color:var(--muted);font-size:.76rem;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .label{font-size:.75rem;color:var(--muted);letter-spacing:.02em}
  .term{border-bottom:1px dashed currentColor;cursor:pointer;padding-bottom:1px}
  .term::after{content:"ⓘ";font-size:.7em;vertical-align:super;opacity:.55;margin-left:1px}
  .chartlink{border-bottom:1px dashed currentColor;cursor:pointer}
  .chartlink::after{content:"📊";font-size:.82em;margin-left:2px}
  .btlink{border-bottom:1px dashed currentColor;cursor:pointer}
  .btlink::after{content:"🕰";font-size:.82em;margin-left:2px}
  .mkt-score{font-size:2.6rem;font-weight:700;line-height:1}
  .mkt-tag{font-size:.95rem;font-weight:600;margin-left:8px}
  .thermo{height:14px;border-radius:8px;margin:14px 0 6px;position:relative;
    background:linear-gradient(90deg,var(--hot),#d8b24a,var(--open))}
  .thermo .mark{position:absolute;top:-5px;width:4px;height:24px;border-radius:2px;
    background:var(--ink);box-shadow:0 0 0 2px var(--card)}
  .scale{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
  .stats{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:.82rem}
  .stats b{font-variant-numeric:tabular-nums}
  .stock{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
  .stock .name{font-size:1.05rem;font-weight:650}
  .stock .code{color:var(--muted);font-size:.8rem;font-weight:400;margin-left:6px}
  .pill{font-size:.78rem;font-weight:650;padding:3px 10px;border-radius:999px;color:#fff;white-space:nowrap}
  .comp{font-size:1.7rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .metrics{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 16px;
    font-size:.8rem;color:var(--muted);margin-top:4px}
  .metrics b{color:var(--ink);font-variant-numeric:tabular-nums}
  .perbar{grid-column:1/-1;height:6px;background:var(--barbg);border-radius:4px;position:relative;margin-top:6px}
  .perbar .dot{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;
    background:var(--ink);border:2px solid var(--card);transform:translateX(-50%)}
  details{margin-top:8px;font-size:.86rem}
  summary{cursor:pointer;color:var(--muted);font-weight:600}
  details ul{padding-left:1.1em;margin:.6em 0}
  details li{margin:.3em 0}
  .foot{color:var(--muted);font-size:.76rem;margin-top:18px;line-height:1.6}
  .err{color:var(--shut);font-weight:600}
  /* 名詞白話浮層 */
  #tip{position:fixed;left:12px;right:12px;bottom:12px;max-width:796px;margin:0 auto;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
    box-shadow:0 6px 24px rgba(0,0,0,.18);display:none;z-index:50;font-size:.9rem;line-height:1.55}
  #tip.show{display:block}
  #tip .k{font-weight:700;margin-bottom:4px}
  #tip .x{float:right;color:var(--muted);font-size:.8rem}
  /* 歷年營收圖視窗 */
  #chart{position:fixed;left:8px;right:8px;bottom:8px;max-width:804px;margin:0 auto;
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;
    box-shadow:0 8px 30px rgba(0,0,0,.22);display:none;z-index:60}
  #chart.show{display:block}
  .chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .chead b{font-size:1.05rem}
  .cx{cursor:pointer;color:var(--muted);font-size:1.15rem;padding:2px 8px}
  .cbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .cbtns button{padding:5px 11px;border:1px solid var(--line);border-radius:999px;
    background:var(--bg);color:var(--muted);font-size:.8rem;cursor:pointer}
  .cbtns button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
  .csp{flex:1}
  .cread{font-size:.92rem;margin-bottom:8px;padding:7px 10px;background:var(--bg);
    border:1px solid var(--line);border-radius:8px;font-variant-numeric:tabular-nums}
  .cread b{font-weight:700}
  .mklink{border-bottom:1px dashed currentColor;cursor:pointer;font-size:.85em;color:var(--muted)}
  .mklink::after{content:"📈";margin-left:2px}
  /* 市場恐慌度歷史視窗 */
  #mkchart{position:fixed;left:8px;right:8px;bottom:8px;max-width:804px;margin:0 auto;
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;
    box-shadow:0 8px 30px rgba(0,0,0,.22);display:none;z-index:60}
  #mkchart.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <h1>打折窗口溫度計</h1>
  <div class="sub" id="sub">載入中…</div>
  <div class="hint">💡 有虛線的名詞（ⓘ）點一下看白話解釋；「營收動能📊」點一下看歷年營收圖。</div>

  <div class="card" id="addcard">
    <div class="label" style="margin-bottom:8px">＋ 新增追蹤股票</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input id="newcode" inputmode="numeric" placeholder="輸入代號，如 2454"
        style="flex:1;min-width:130px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:.95rem">
      <button id="addbtn"
        style="padding:9px 16px;border:0;border-radius:8px;background:var(--open);color:#fff;font-weight:650;cursor:pointer">送出</button>
    </div>
    <div id="addmsg" class="label" style="margin-top:8px"></div>
    <div id="addstatus" style="margin-top:6px;font-size:.86rem;font-weight:600"></div>
  </div>

  <div id="app"></div>

  <div class="card" id="btcard">
    <div class="label" style="margin-bottom:8px">🕰 時光倒流回測（輸入代號＋日期，算「當時」的溫度計數字）</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="btcode" inputmode="numeric" placeholder="代號 如 6669"
        style="width:120px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:.95rem">
      <input id="btdate" type="date"
        style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:.95rem">
      <button id="btbtn"
        style="padding:9px 16px;border:0;border-radius:8px;background:var(--cool);color:#fff;font-weight:650;cursor:pointer">查詢</button>
    </div>
    <div id="btout" style="margin-top:8px"></div>
  </div>

  <details>
    <summary>全部欄位一次看（白話）</summary>
    <ul id="glosslist"></ul>
  </details>

  <div class="foot" id="foot"></div>
</div>

<div id="tip"></div>
<div id="chart">
  <div class="chead"><b id="ctitle"></b><span class="cx">✕</span></div>
  <div class="cbtns">
    <button data-v="rev">月營收</button><button data-v="yoy">成長率 YoY</button>
    <span class="csp"></span>
    <button data-r="12">1年</button><button data-r="24">2年</button><button data-r="36">3年</button>
  </div>
  <div class="cbody"></div>
</div>
<div id="mkchart">
  <div class="chead"><b>市場恐慌度 · 歷史（TAIEX）</b><span class="cx">✕</span></div>
  <div class="cbtns">
    <button data-mv="fear">恐慌度</button><button data-mv="index">大盤指數</button><button data-mv="both">疊圖</button>
    <span class="csp"></span>
    <button data-mr="125">6月</button><button data-mr="250">1年</button><button data-mr="500">2年</button>
  </div>
  <div class="mkbody"></div>
</div>

<script>
const GLOSSARY = {
  market:"市場恐慌度：全大盤共用。高＝大家在恐慌（折扣容易出現）；低＝大家貪婪、追高危險。用大盤乖離／回檔／波動算，不用位階（多頭趨勢會失真）。",
  composite:"綜合窗口：0.40×估值便宜 ＋ 0.25×基本面 ＋ 0.35×市場恐慌。≥65 窗口開（便宜＋恐慌）｜45–64 半開｜<45 窗口關（貴＋貪婪）。這是情境傾向，不是買賣訊號。",
  val_cheap:"估值便宜度：這檔的本益比，站在它自己過去 5 年的高低位置。越低（越接近自己的便宜區）分數越高（＝100 − 本益比位階）。回答「相對它自己，現在便宜還貴」。",
  fund:"基本面：公司賺不賺錢、在成長還衰退。用最新月營收年增率（YoY）換算，成長越猛分數越高。單月有雜訊，想看趨勢就點「營收動能📊」看歷年圖。",
  per:"PER（本益比）：股價 ÷ 每股盈餘。買一塊錢的獲利要付幾塊，數字越大＝買得越貴。",
  pctl:"位階：現在的本益比，站在它自己過去 5 年由低到高的第幾個百分點。越低＝越接近它自己的便宜區。",
};
const term=(k,t)=>`<span class="term" data-k="${k}">${t}</span>`;
const chartLink=(code)=>`<span class="chartlink" data-code="${code}">營收動能</span>`;
const btLink=(code)=>`<span class="btlink" data-code="${code}">回測</span>`;
function compColor(s){ return s>=65?"var(--open)": s>=45?"var(--half)": "var(--shut)"; }
function mktColor(s){ return s>=65?"var(--open)" : s>=40?"var(--half)" : "var(--hot)"; }
function esc(x){ return x==null?"—":x; }

// ── 歷年營收圖 ──────────────────────────────
let CH={code:null, view:"rev", range:24, focus:null};
function syncBtns(){
  document.querySelectorAll("#chart .cbtns button").forEach(b=>{
    b.classList.toggle("on", b.dataset.v===CH.view || (+b.dataset.r)===CH.range);
  });
}
function openChart(code){
  const chart=document.getElementById("chart");
  const s=(window.DATA?.stocks||[]).find(x=>x.code===code);
  document.getElementById("ctitle").textContent=(s?(s.name||"")+" "+s.code:code)+"　營收";
  if(!s || !s.revenue_history || !s.revenue_history.length){
    document.querySelector("#chart .cbody").innerHTML='<div class="label">這檔沒有月營收資料（可能是興櫃/新上市/金融股）。</div>';
    chart.classList.add("show"); return;
  }
  CH.code=code; CH.focus=null; drawChart(); syncBtns(); chart.classList.add("show");
}
function drawChart(){
  const s=window.DATA.stocks.find(x=>x.code===CH.code);
  const h=s.revenue_history.slice(-CH.range);
  const isRev=CH.view==="rev";
  if(CH.focus==null) CH.focus=h.length-1;
  CH.focus=Math.max(0,Math.min(h.length-1,CH.focus));
  const val=d=> isRev?(d.rev||0):(d.yoy==null?0:d.yoy);
  const vals=h.map(val);
  const W=340,H=160,padL=30,padR=10,padT=10,padB=22;
  const iw=W-padL-padR, ih=H-padT-padB;
  const maxV=Math.max(...vals,1);
  const minV=isRev?0:Math.min(...vals,0);
  const span=(maxV-minV)||1;
  const bw=iw/h.length;
  const y=v=> padT+(maxV-v)/span*ih;
  const yz=y(0);

  // Y 軸格線＋刻度數值
  const ticks=[...new Set(isRev?[0,maxV]:[minV,0,maxV])];
  let grid="";
  ticks.forEach(tv=>{
    const yy=y(tv);
    grid+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width=".6"/>`;
    grid+=`<text x="${(padL-4).toFixed(1)}" y="${(yy+2.6).toFixed(1)}" font-size="7.5" fill="var(--muted)" text-anchor="end">${isRev?Math.round(tv):(tv>0?"+":"")+Math.round(tv)+"%"}</text>`;
  });

  // 長條＋年份分隔線＋透明點擊區（整欄可點）
  let bars="", marks="", hits="";
  h.forEach((d,i)=>{
    const v=val(d), cx=padL+i*bw;
    const bx=cx+bw*0.15, w=Math.max(1.2,bw*0.7), yv=y(v);
    const top=Math.min(yv,yz), ht=Math.max(1,Math.abs(yv-yz));
    const foc=(i===CH.focus);
    const col=isRev?"var(--cool)":(v>=0?"var(--open)":"var(--shut)");
    if(foc) bars+=`<rect x="${cx.toFixed(1)}" y="${padT}" width="${bw.toFixed(1)}" height="${ih}" fill="var(--ink)" opacity=".07"/>`;
    bars+=`<rect x="${bx.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${ht.toFixed(1)}" rx="1" fill="${col}" opacity="${foc?1:.6}"/>`;
    const mo=d.ym.slice(5);
    if(mo==="01"){
      marks+=`<line x1="${cx.toFixed(1)}" y1="${padT}" x2="${cx.toFixed(1)}" y2="${(padT+ih).toFixed(1)}" stroke="var(--line)" stroke-width=".6" stroke-dasharray="2 2"/>`;
      marks+=`<text x="${(cx+bw/2).toFixed(1)}" y="${H-6}" font-size="7.5" fill="var(--muted)" text-anchor="middle">${d.ym.slice(0,4)}</text>`;
    } else if(i===0){
      marks+=`<text x="${(cx+bw/2).toFixed(1)}" y="${H-6}" font-size="7.5" fill="var(--muted)" text-anchor="middle">${d.ym.slice(0,4)}</text>`;
    }
    hits+=`<rect class="hit" data-i="${i}" x="${cx.toFixed(1)}" y="${padT}" width="${bw.toFixed(1)}" height="${ih}" fill="transparent" style="cursor:pointer"/>`;
  });

  const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${grid}${bars}${marks}${hits}</svg>`;

  // 選中月份的讀數（同時秀營收與 YoY，不管目前看哪個檢視）
  const f=h[CH.focus];
  const yoyTxt=f.yoy==null?"—":(f.yoy>0?"+":"")+f.yoy+"%";
  const readout=`<div class="cread"><b>${f.ym}</b>　營收 <b>${f.rev}</b> 億　·　YoY <b>${yoyTxt}</b></div>`;

  document.querySelector("#chart .cbody").innerHTML=
    readout+svg+
    `<div class="label" style="margin-top:6px">${isRev?"每月營收（億元）":"月營收年增率 YoY（綠正紅負）"}　·　近 ${CH.range} 個月　·　點長條看該月數字</div>`;
}

// ── 市場恐慌度歷史（把 build_data.py 的市場恐慌度公式，對每一天各算一次）──
let MK={view:"fear", range:250, focus:null, series:null, _n:0};
function fearScore(closes){   // 與 build_data.py / 回測完全同式
  const c=closes[closes.length-1], ma120=closes.slice(-120).reduce((x,y)=>x+y,0)/120;
  const bias=(c-ma120)/ma120*100;
  const hi=Math.max(...(closes.length>=250?closes.slice(-250):closes)), dd=(c-hi)/hi*100;
  const rets=[]; for(let i=1;i<closes.length;i++) rets.push(closes[i]/closes[i-1]-1);
  const vol=pstdev(rets.slice(-20))*Math.sqrt(252)*100;
  const score=Math.round(0.4*bclamp(50-bias*3.3)+0.3*bclamp(-dd*2.5)+0.3*bclamp((vol-12)/26*100));
  return {score, bias, dd, vol};
}
function mkSync(){
  document.querySelectorAll("#mkchart .cbtns button").forEach(b=>{
    b.classList.toggle("on", b.dataset.mv===MK.view || (+b.dataset.mr)===MK.range);
  });
}
async function mkOpen(){
  const modal=document.getElementById("mkchart"), body=document.querySelector("#mkchart .mkbody");
  modal.classList.add("show");
  if(MK.series){ MK.focus=null; mkDraw(); mkSync(); return; }
  body.innerHTML='<div class="label">計算中…（向 FinMind 取大盤歷史，約 1~3 秒）</div>';
  try{
    const today=new Date().toISOString().slice(0,10);
    const rows=(await fmGet("TaiwanStockPrice","TAIEX",shiftDays(today,-1300),today)).sort((a,b)=>a.date<b.date?-1:1);
    const closes=rows.map(r=>r.close), dates=rows.map(r=>r.date);
    if(closes.length<260) throw new Error("大盤資料不足。");
    const series=[];
    for(let i=249;i<closes.length;i++){
      const f=fearScore(closes.slice(0,i+1));
      series.push({date:dates[i], score:f.score, close:closes[i], bias:f.bias, dd:f.dd, vol:f.vol});
    }
    MK.series=series; MK.focus=null; mkDraw(); mkSync();
  }catch(e){ body.innerHTML='<span class="err">'+(e.message||"取資料失敗")+'</span>'; }
}
function mkDraw(){
  const body=document.querySelector("#mkchart .mkbody");
  if(!MK.series || !MK.series.length){ body.innerHTML='<div class="label">抓不到大盤資料，稍後再試。</div>'; return; }
  const s=MK.series.slice(-MK.range), n=s.length; MK._n=n;
  if(MK.focus==null) MK.focus=n-1;
  MK.focus=Math.max(0,Math.min(n-1,MK.focus));
  const mode=MK.view;                       // fear | index | both
  const showFear=mode!=="index", showIndex=mode!=="fear", showBands=mode!=="index";
  const W=340,H=172,padL=30,padR=10,padT=10,padB=22, iw=W-padL-padR, ih=H-padT-padB;
  const cs=s.map(d=>d.close);
  const imin0=Math.min(...cs), imax0=Math.max(...cs), ip=(imax0-imin0)*0.05||1;
  const imin=imin0-ip, imax=imax0+ip;
  const step= n>1? iw/(n-1) : iw, X=j=> padL+j*step;
  const Yf=v=> padT+(100-v)/100*ih;                 // 恐慌度 0~100（左）
  const Yi=v=> padT+(imax-v)/((imax-imin)||1)*ih;   // 大盤點數（右）

  let bg="";
  if(showBands){
    [[65,100,"var(--open)"],[40,65,"var(--half)"],[0,40,"var(--hot)"]].forEach(z=>{
      const yt=Yf(z[1]), yb=Yf(z[0]);
      bg+=`<rect x="${padL}" y="${yt.toFixed(1)}" width="${iw}" height="${(yb-yt).toFixed(1)}" fill="${z[2]}" opacity=".10"/>`;
    });
    [65,40].forEach(t=>{ const yy=Yf(t);
      bg+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width=".6"/>`;
      bg+=`<text x="${padL-4}" y="${(yy+2.6).toFixed(1)}" font-size="7.5" fill="var(--muted)" text-anchor="end">${t}</text>`;
    });
  } else {
    [imax0,imin0].forEach(t=>{ const yy=Yi(t);
      bg+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width=".6"/>`;
      bg+=`<text x="${padL-4}" y="${(yy+2.6).toFixed(1)}" font-size="7.5" fill="var(--muted)" text-anchor="end">${Math.round(t)}</text>`;
    });
  }

  // 折線（疊圖時大盤在下、恐慌度在上）
  let lines="";
  if(showIndex){ let p=""; s.forEach((d,j)=> p+=`${X(j).toFixed(1)},${Yi(d.close).toFixed(1)} `);
    lines+=`<polyline points="${p.trim()}" fill="none" stroke="var(--cool)" stroke-width="1.4" opacity="${mode==="both"?".85":"1"}"/>`; }
  if(showFear){ let p=""; s.forEach((d,j)=> p+=`${X(j).toFixed(1)},${Yf(d.score).toFixed(1)} `);
    lines+=`<polyline points="${p.trim()}" fill="none" stroke="var(--ink)" stroke-width="1.4"/>`; }

  let marks="";
  s.forEach((d,j)=>{
    if(d.date.slice(5,7)==="01" && (j===0 || s[j-1].date.slice(5,7)!=="01"))
      marks+=`<line x1="${X(j).toFixed(1)}" y1="${padT}" x2="${X(j).toFixed(1)}" y2="${(padT+ih).toFixed(1)}" stroke="var(--line)" stroke-width=".6" stroke-dasharray="2 2"/>`;
  });
  marks+=`<text x="${padL}" y="${H-6}" font-size="7.5" fill="var(--muted)">${s[0].date.slice(0,7)}</text>`;
  marks+=`<text x="${W-padR}" y="${H-6}" font-size="7.5" fill="var(--muted)" text-anchor="end">${s[n-1].date.slice(0,7)}</text>`;

  const f=s[MK.focus], fx=X(MK.focus);
  let foc=`<line x1="${fx.toFixed(1)}" y1="${padT}" x2="${fx.toFixed(1)}" y2="${(padT+ih).toFixed(1)}" stroke="var(--muted)" stroke-width=".7"/>`;
  if(showIndex) foc+=`<circle cx="${fx.toFixed(1)}" cy="${Yi(f.close).toFixed(1)}" r="2.6" fill="var(--cool)"/>`;
  if(showFear) foc+=`<circle cx="${fx.toFixed(1)}" cy="${Yf(f.score).toFixed(1)}" r="2.6" fill="var(--ink)"/>`;
  const hit=`<rect class="mkhit" x="${padL}" y="${padT}" width="${iw}" height="${ih}" fill="transparent" style="cursor:pointer"/>`;
  const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${bg}${lines}${marks}${foc}${hit}</svg>`;

  const tag= f.score>=65?"恐慌(機會)": f.score>=40?"中性":"貪婪(該收手)";
  const read= mode==="index"
    ? `<div class="cread"><b>${f.date}</b>　大盤 <b>${Math.round(f.close)}</b>　·　恐慌度 ${f.score}（${tag}）</div>`
    : mode==="both"
    ? `<div class="cread"><b>${f.date}</b>　恐慌度 <b>${f.score}</b>（${tag}）　·　大盤 <b>${Math.round(f.close)}</b></div>`
    : `<div class="cread"><b>${f.date}</b>　恐慌度 <b>${f.score}</b>　·　${tag}　·　乖離 <b>${f.bias>0?"+":""}${Math.round(f.bias*10)/10}%</b></div>`;
  const legend= mode==="both"
    ? `<div class="label" style="margin-bottom:4px"><span style="color:var(--ink)">━ 恐慌度(左 0–100)</span>　<span style="color:var(--cool)">━ 大盤(右 ${Math.round(imin0)}–${Math.round(imax0)})</span></div>`
    : "";
  const sc=s.map(d=>d.score);
  const cap= mode==="index"
    ? `大盤點數　·　點圖看該日　·　可切「恐慌度」或「疊圖」`
    : mode==="both"
    ? `看情緒與指數的時間關係（誰領先、形狀），不是比大小　·　點圖看該日`
    : `恐慌度區間 ${Math.min(...sc)}~${Math.max(...sc)}　·　綠=便宜/機會、紅=貪婪/該收手　·　點圖看該日`;
  body.innerHTML=legend+read+svg+`<div class="label" style="margin-top:6px">${cap}</div>`;
}

document.addEventListener("click", e=>{
  const chart=document.getElementById("chart"), tip=document.getElementById("tip");
  const cbtn=e.target.closest("#chart [data-v],#chart [data-r]");
  if(cbtn){ if(cbtn.dataset.v)CH.view=cbtn.dataset.v; if(cbtn.dataset.r){CH.range=+cbtn.dataset.r; CH.focus=null;} drawChart(); syncBtns(); e.stopPropagation(); return; }
  const hit=e.target.closest("#chart .hit");
  if(hit){ CH.focus=+hit.getAttribute("data-i"); drawChart(); e.stopPropagation(); return; }
  const mbtn=e.target.closest("#mkchart [data-mv],#mkchart [data-mr]");
  if(mbtn){ if(mbtn.dataset.mv)MK.view=mbtn.dataset.mv; if(mbtn.dataset.mr){MK.range=+mbtn.dataset.mr; MK.focus=null;} mkDraw(); mkSync(); e.stopPropagation(); return; }
  const mh=e.target.closest("#mkchart .mkhit");
  if(mh){ const r=mh.getBoundingClientRect(); const frac=bclamp((e.clientX-r.left)/r.width,0,1); MK.focus=Math.round(frac*(MK._n-1)); mkDraw(); e.stopPropagation(); return; }
  const cx=e.target.closest(".cx");
  if(cx){ const m=cx.closest("#chart,#mkchart"); if(m) m.classList.remove("show"); return; }
  const cl=e.target.closest(".chartlink");
  if(cl){ tip.classList.remove("show"); openChart(cl.dataset.code); e.stopPropagation(); return; }
  const bl=e.target.closest(".btlink");
  if(bl){ tip.classList.remove("show"); const ci=document.getElementById("btcode");
    if(ci){ ci.value=bl.dataset.code; document.getElementById("btcard").scrollIntoView({behavior:"smooth",block:"center"}); ci.focus(); }
    e.stopPropagation(); return; }
  const ml=e.target.closest(".mklink");
  if(ml){ tip.classList.remove("show"); mkOpen(); e.stopPropagation(); return; }
  const t=e.target.closest(".term");
  if(t && GLOSSARY[t.dataset.k]){
    tip.innerHTML='<span class="x">點任意處關閉 ✕</span><div class="k">'+t.textContent.replace("ⓘ","")+'</div>'+GLOSSARY[t.dataset.k];
    tip.classList.add("show"); e.stopPropagation(); return;
  }

  const mkc=document.getElementById("mkchart");
  if(mkc && !e.target.closest("#mkchart")) mkc.classList.remove("show");
  if(!e.target.closest("#tip")) tip.classList.remove("show");
});

// ── 新增追蹤（送出後向 GitHub 公開 API 輪詢近即時狀態；唯讀、免 token）──
const REPO="tsai200493-Cyrus/tw-discount-dashboard";
const GHAPI="https://api.github.com/repos/"+REPO;
(function(){
  const btn=document.getElementById("addbtn"), inp=document.getElementById("newcode"),
        msg=document.getElementById("addmsg"), stat=document.getElementById("addstatus");
  let watch=null;  // {code, since, timer, tries}
  const setStat=(html,color)=>{ stat.style.color=color||"var(--muted)"; stat.innerHTML=html; };
  function stopWatch(){ if(watch&&watch.timer) clearInterval(watch.timer); watch=null; }

  async function poll(){
    if(!watch) return;
    if(++watch.tries>28){ setStat("（等太久了，改到 GitHub 那張單看狀態；股票仍會自動加入、資料照常更新）"); stopWatch(); return; }
    let issues;
    try{
      const r=await fetch(GHAPI+"/issues?state=all&sort=created&direction=desc&per_page=15",
                          {headers:{Accept:"application/vnd.github+json"}});
      if(r.status===403){ setStat("（GitHub 查詢額度暫時用完，稍後會自動恢復；股票仍會加入）"); stopWatch(); return; }
      issues=await r.json();
    }catch(_){ return; }               // 網路暫斷，下一輪再試
    if(!Array.isArray(issues)) return;
    const want="[add] "+watch.code;
    const hit=issues.find(it=> it.title && it.title.trim()===want
                            && new Date(it.created_at).getTime() >= watch.since-60000);
    if(!hit){ setStat("⏳ 等你在 GitHub 那頁按下綠色 <b>Submit new issue</b>…"); return; }
    if(hit.state==="open"){ setStat("⏳ 已收到 <b>#"+hit.number+"</b>，機器人驗證＋加入中…"); return; }
    // 已關閉 → 讀機器人的回覆留言
    let body="";
    try{
      const c=await fetch(GHAPI+"/issues/"+hit.number+"/comments?per_page=10",
                          {headers:{Accept:"application/vnd.github+json"}});
      const cs=await c.json();
      if(Array.isArray(cs)&&cs.length) body=(cs[cs.length-1].body||"").trim();
    }catch(_){}
    if(!body){ setStat("已處理 <b>#"+hit.number+"</b>，重新整理看結果。"); stopWatch(); return; }
    const color= body.startsWith("✅")?"var(--open)" : body.startsWith("ℹ️")?"var(--muted)" : "var(--shut)";
    setStat(body,color);
    const added=body.startsWith("✅"), code=watch.code;
    stopWatch();
    if(added) waitForData(code);
  }

  async function waitForData(code){     // ✅ 之後等 Pages 重佈署，資料一到就自動刷新清單
    for(let i=0;i<8;i++){
      await new Promise(r=>setTimeout(r,15000));
      try{
        const d=await (await fetch("./data.json?_="+Date.now())).json();
        if((d.stocks||[]).some(s=>s.code===code)){ render(d); setStat("✅ "+code+" 已出現在下方清單。","var(--open)"); return; }
      }catch(_){}
    }
  }

  function go(){
    const v=(inp.value||"").trim();
    if(!/^\d{4,6}[A-Za-z]?$/.test(v)){ msg.innerHTML='<span style="color:var(--shut)">請輸入正確代號（4 位數字，如 2454）。</span>'; return; }
    const url="https://github.com/"+REPO+"/issues/new?title="+encodeURIComponent("[add] "+v)+
      "&body="+encodeURIComponent("自動新增追蹤 "+v+"，送出後系統會驗證代號並加入清單。");
    msg.innerHTML='已開好 GitHub 投件頁 → 按綠色 <b>Submit new issue</b>。下面會即時顯示進度：';
    window.open(url,"_blank");
    stopWatch();
    watch={code:v, since:Date.now(), timer:setInterval(poll,6000), tries:0};
    setStat("⏳ 等你在 GitHub 那頁按下綠色 <b>Submit new issue</b>…");
    poll();
  }
  btn.addEventListener("click",go);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
})();

// ── 時光倒流回測（瀏覽器直接算；資料取自 FinMind 公開 API，唯讀免 token）──
// 公式與 build_data.py 一致，只餵「as_of 當下拿得到」的資料。
const FM="https://api.finmindtrade.com/api/v4/data";
async function fmGet(dataset,id,start,end){
  const p=new URLSearchParams({dataset,start_date:start});
  if(id)p.set("data_id",id);
  if(end)p.set("end_date",end);
  const r=await fetch(FM+"?"+p.toString());
  const j=await r.json();
  if(j.status!==200) throw new Error("FinMind："+(j.msg||("狀態 "+j.status)));
  return j.data||[];
}
function pstdev(a){ if(!a.length)return 0; const m=a.reduce((x,y)=>x+y,0)/a.length; return Math.sqrt(a.reduce((s,v)=>s+(v-m)*(v-m),0)/a.length); }
function bclamp(x,lo=0,hi=100){ return Math.max(lo,Math.min(hi,x)); }
function shiftDays(iso,days){ const d=new Date(iso+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+days); return d.toISOString().slice(0,10); }
function shiftYears(iso,y){ const p=iso.split("-"); return String(+p[0]+y).padStart(4,"0")+"-"+p[1]+"-"+p[2]; }
function monthAvail(y,m,asof){ let ny=y,nm=m+1; if(nm>12){ny++;nm=1;} return (ny+"-"+String(nm).padStart(2,"0")+"-10")<=asof; } // 月營收約次月10日才公布

async function backtest(code,asof){
  const [taiex,price,per,rev]=await Promise.all([
    fmGet("TaiwanStockPrice","TAIEX",shiftDays(asof,-620),asof),
    fmGet("TaiwanStockPrice",code,shiftDays(asof,-40),asof),
    fmGet("TaiwanStockPER",code,shiftDays(asof,-1835),asof),
    fmGet("TaiwanStockMonthRevenue",code,shiftDays(asof,-470),asof),
  ]);
  const pr=price.filter(r=>r.date<=asof).sort((a,b)=>a.date<b.date?-1:1);
  if(!pr.length) throw new Error("查無代號，或 "+asof+" 當時還沒有這檔的股價。");
  // 市場恐慌度
  const tx=taiex.filter(r=>r.date<=asof).sort((a,b)=>a.date<b.date?-1:1);
  const closes=tx.map(r=>r.close);
  if(closes.length<130) throw new Error("大盤資料不足（日期可能太早）。");
  const c=closes[closes.length-1], ma120=closes.slice(-120).reduce((x,y)=>x+y,0)/120;
  const bias=(c-ma120)/ma120*100;
  const hi=Math.max(...(closes.length>=250?closes.slice(-250):closes)), dd=(c-hi)/hi*100;
  const rets=[]; for(let i=1;i<closes.length;i++) rets.push(closes[i]/closes[i-1]-1);
  const vol=pstdev(rets.slice(-20))*Math.sqrt(252)*100;
  const mkf=Math.round(0.4*bclamp(50-bias*3.3)+0.3*bclamp(-dd*2.5)+0.3*bclamp((vol-12)/26*100));
  const mtag= mkf>=65?"恐慌(機會)": mkf>=40?"中性":"貪婪(該收手)";
  // PER 位階（近 5 年）
  const cut=shiftDays(asof,-1825);   // 近 5 年＝1825 天，與 build_data.py 一致
  const pp=per.filter(r=> r.date>=cut && r.date<=asof && r.PER!=null && r.PER!==0).sort((a,b)=>a.date<b.date?-1:1);
  let perNow=null,pctl=null,pmin=null,pmed=null,pmax=null,valCheap=null;
  if(pp.length){
    const vals=pp.map(r=>r.PER); perNow=pp[pp.length-1].PER;
    pctl=Math.round(vals.filter(v=>v<=perNow).length/vals.length*100);
    const s2=[...vals].sort((a,b)=>a-b); pmin=s2[0]; pmed=s2[Math.floor(s2.length/2)]; pmax=s2[s2.length-1];
    valCheap=100-pctl;
  }
  // 月營收 YoY（考慮公布落後）
  const rv=rev.slice().sort((a,b)=>(a.revenue_year-b.revenue_year)||(a.revenue_month-b.revenue_month));
  const idx={}; rv.forEach(r=> idx[r.revenue_year+"-"+r.revenue_month]=r.revenue);
  const avail=rv.filter(r=> monthAvail(r.revenue_year,r.revenue_month,asof));
  let yoy=null,ym=null,fund=null;
  if(avail.length){
    const last=avail[avail.length-1]; ym=last.revenue_year+"-"+String(last.revenue_month).padStart(2,"0");
    const py=idx[(last.revenue_year-1)+"-"+last.revenue_month];
    if(py){ yoy=Math.round((last.revenue-py)/py*1000)/10; fund=Math.round(bclamp(45+yoy*1.2)); }
  }
  let comp=null,label;
  if(valCheap!=null){
    comp=Math.round(0.40*valCheap+0.25*(fund!=null?fund:45)+0.35*mkf);
    label= comp>=65?"窗口開(便宜+恐慌)": comp>=45?"半開(中性)":"窗口關(貴+貪婪)";
  } else { label="無本益比(本夢比)，只能參考營收與大盤"; }
  const r1=x=>x==null?null:Math.round(x*10)/10;
  return {code, asof:pr[pr.length-1].date, px:pr[pr.length-1].close, mkf, mtag,
          bias:r1(bias), dd:r1(dd), vol:r1(vol),
          perNow: perNow==null?null:Math.round(perNow*100)/100, pctl, valCheap,
          pmin:r1(pmin), pmed:r1(pmed), pmax:r1(pmax), ym, yoy, fund, comp, label};
}

function btRender(s,name){
  const col= s.comp==null?"var(--muted)":compColor(s.comp);
  const row=(k,v)=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px solid var(--line)"><span class="label">${k}</span><span style="font-variant-numeric:tabular-nums;text-align:right">${v}</span></div>`;
  return `<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px">
      <b>${name||""} ${s.code}</b><span class="label">資料日 ${s.asof}</span></div>
    <div style="font-size:1.9rem;font-weight:700;color:${col};line-height:1.1">${s.comp==null?"—":s.comp}<span class="label" style="font-size:.8rem;font-weight:400">／100　${s.label}</span></div>
    <div style="margin-top:6px">
      ${row("收盤價", s.px)}
      ${row("市場恐慌度", s.mkf+"　"+s.mtag)}
      ${row("　乖離120／距年高／20日波動", (s.bias>0?"+":"")+s.bias+"%　/　"+s.dd+"%　/　"+s.vol+"%")}
      ${row("PER 本益比", s.perNow==null?"—（本夢比）":s.perNow)}
      ${row("PER 位階（近5年）", s.pctl==null?"—":s.pctl+"%　區間 "+s.pmin+"~"+s.pmax+"（中位 "+s.pmed+"）")}
      ${row("估值便宜度", s.valCheap==null?"—":s.valCheap)}
      ${row("最新可得月營收 YoY", s.ym==null?"—":s.ym+"　"+(s.yoy==null?"—":(s.yoy>0?"+":"")+s.yoy+"%"))}
      ${row("基本面", s.fund==null?"—":s.fund)}
    </div>
    <div class="label" style="margin-top:8px">同一套算法、只餵「當時」拿得到的資料。絕對股價會被配股扭曲，重點看「位階」。</div>`;
}

      </div>`);
  }

  document.getElementById("glosslist").innerHTML =
    Object.values(GLOSSARY).map(v=>"<li>"+v+"</li>").join("")+
    "<li>營收動能📊：點股票的「營收動能」可看歷年月營收與 YoY 成長率圖（可切換、選 1/2/3 年）。</li>";

  const w=d.weights||{};
  document.getElementById("foot").innerHTML =
    `綜合窗口權重：估值便宜 ${w.value} ＋ 基本面 ${w.fund} ＋ 市場恐慌 ${w.market}（透明、未回測調參）。<br>`+
    (d.disclaimer||"");
}
</script>
