<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打折窗口溫度計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f3ec; --panel:#faf9f4; --ink:#1d1b16; --muted:#6c665c; --line:#dcd7ca; --track:#e4dfd2;
    --accent:#2f4a3f; --open:#2f6d4f; --half:#946515; --shut:#9c3f37; --dream:#8a8478;
    --cool:#3a6a7a; --hot:#b0564a; --barbg:#e4dfd2; --mkt:#efe9db; --mkt-line:#e0d9c5;
    --serif:"Newsreader",Georgia,"Noto Serif TC",serif;
    --sans:"Work Sans",-apple-system,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#17150f; --panel:#201d16; --ink:#ece7dc; --muted:#9a9384; --line:#2f2b22; --track:#26221b;
      --accent:#8bb89b; --open:#5aa87d; --half:#c79a4e; --shut:#d1685f; --dream:#8f887a;
      --cool:#6fa3b5; --hot:#d1685f; --barbg:#26221b; --mkt:#221d13; --mkt-line:#39321f;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    line-height:1.55;-webkit-text-size-adjust:100%}
  .wrap{max-width:640px;margin:0 auto;padding:22px 18px 96px}
  h1{font-family:var(--serif);font-weight:500;font-size:1.9rem;letter-spacing:-.01em;margin:.1em 0 .12em;text-wrap:balance}
  .sub{color:var(--muted);font-size:.8rem;margin-bottom:6px}
  .hint{color:var(--muted);font-size:.76rem;margin-bottom:18px;line-height:1.6}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:16px}
  .label{font-size:.74rem;color:var(--muted);letter-spacing:.03em}
  .err{color:var(--shut);font-weight:600}

  .term,.chartlink,.mklink{position:relative;border-bottom:1px dashed currentColor;cursor:pointer}
  /* 手指用的可觸區：虛線字本身只有 ~15px 高，用透明覆蓋層撐到 ~35px，
     視覺與行高完全不變（絕對定位不參與排版）。 */
  .term::before,.chartlink::before,.mklink::before{content:"";position:absolute;
    left:-5px;right:-5px;top:-10px;bottom:-10px}
  .term::after{content:"ⓘ";font-size:.68em;vertical-align:super;opacity:.5;margin-left:1px}
  .chartlink::after{content:"📊";font-size:.8em;margin-left:2px}
  .mklink{font-size:.85em;color:var(--muted)}
  .mklink::after{content:"📈";margin-left:2px}
  .hslink{cursor:pointer}

  /* 市場恐慌度卡（B） */
  .mktcard{background:var(--mkt);border:1px solid var(--mkt-line);border-radius:14px;
    padding:16px;margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .mkt-score{font-family:var(--serif);font-weight:500;font-size:3rem;line-height:1}
  .mkt-tag{font-size:.92rem;font-weight:600;margin-left:8px}
  .thermo{height:10px;border-radius:6px;margin:12px 0 6px;position:relative;
    background:linear-gradient(90deg,var(--hot),var(--half),var(--open));opacity:.85}
  .thermo .mark{position:absolute;top:-4px;width:3px;height:18px;border-radius:2px;
    background:var(--ink);transform:translateX(-50%);box-shadow:0 0 0 2px var(--bg)}
  .scale{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
  .stats{display:flex;flex-wrap:wrap;gap:5px 22px;margin-top:12px;font-size:.83rem;color:var(--muted)}
  .stats b{color:var(--ink);font-variant-numeric:tabular-nums}

  /* 分區標題（打折中／觀察／太貴／本夢比） */
  .sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 4px}
  .sec-t{font-family:var(--serif);font-size:1.05rem;font-weight:500}
  .sec-t.open{color:var(--open)} .sec-t.half{color:var(--half)}
  .sec-t.shut{color:var(--muted)} .sec-t.dream{color:var(--dream)}
  .sec-n{font-size:.72rem;color:var(--muted);white-space:nowrap}
  .sec-empty{font-size:.84rem;color:var(--muted);padding:12px 2px 4px;border-top:1px solid var(--line)}

  /* 比較區間切換（標準 / 客製） */
  .modesw{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 2px}
  .modesw .ms-t{font-size:.74rem;color:var(--muted);letter-spacing:.03em}
  .modesw button{font:inherit;font-size:.76rem;padding:7px 13px;border:1px solid var(--line);
    border-radius:999px;background:var(--bg);color:var(--muted);cursor:pointer}
  .modesw button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .modesw .ms-n{font-size:.7rem;color:var(--muted);margin-left:auto}

  /* 今日變化（跟上一個交易日比） */
  .movers{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 12px;font-size:.83rem;color:var(--muted);
    margin:-4px 0 4px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .movers .mv-t{font-size:.74rem;font-weight:600;color:var(--ink);letter-spacing:.03em}
  .movers .mv-i{white-space:nowrap}
  .movers b{font-variant-numeric:tabular-nums;font-weight:600}
  .movers b.up{color:var(--open)} .movers b.down{color:var(--shut)}
  .delta{font-family:var(--sans);font-size:.7rem;font-weight:600;margin-left:4px;
    vertical-align:super;font-variant-numeric:tabular-nums}
  .delta.up{color:var(--open)} .delta.down{color:var(--shut)} .delta.flat{color:var(--muted);font-weight:400}

  /* 股票列：收合＝一列（整列可點展開）／展開＝細節 */
  details.stock{border-top:1px solid var(--line)}
  .s-row{list-style:none;cursor:pointer;display:flex;align-items:center;gap:11px;
    padding:12px 2px;min-height:58px;-webkit-tap-highlight-color:transparent}
  .s-row::-webkit-details-marker{display:none}
  .s-row:hover .r-name{color:var(--accent)}
  .r-main{flex:1;min-width:0}
  .r-name{font-weight:600;font-size:1.05rem;line-height:1.25;transition:color .15s}
  .s-code{color:var(--muted);font-weight:400;font-size:.8rem;margin-left:6px}
  .r-sub{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:.79rem;color:var(--muted)}
  .r-sub b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:.88rem}
  .r-q3{white-space:nowrap}
  /* 漲＝紅、跌＝綠：台股慣例，在這裡剛好也跟站上語意一致（漲＝變貴＝紅） */
  .pchg{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pchg.up{color:var(--shut)} .pchg.down{color:var(--open)}
  .pchg.flat{color:var(--muted);font-weight:400}
  .r-side{flex-shrink:0;text-align:right;max-width:42%}
  .r-score{font-family:var(--serif);font-weight:500;font-size:1.8rem;line-height:1;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .r-score.open{color:var(--open)} .r-score.half{color:var(--half)} .r-score.shut{color:var(--shut)}
  .r-score.dream{font-family:var(--sans);font-size:.92rem;font-weight:600;color:var(--dream)}
  .r-tag{font-size:.71rem;color:var(--muted);margin-top:4px;line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .r-chev{flex-shrink:0;width:13px;text-align:center;color:var(--muted);font-size:.78rem;transition:transform .2s}
  details.stock[open] .r-chev{transform:rotate(180deg)}
  .s-body{padding:2px 2px 20px}
  .s-line{font-size:.84rem;color:var(--muted);margin-bottom:6px}
  .s-line b{color:var(--ink);font-variant-numeric:tabular-nums}

  /* 動作列：查詢在左、破壞性的「移除」推到最右邊，不再跟標題等權 */
  .s-acts{display:flex;gap:8px;align-items:center;margin-top:16px}
  .act{font:inherit;font-size:.76rem;color:var(--muted);background:transparent;border:1px solid var(--line);
    border-radius:999px;padding:8px 14px;cursor:pointer;transition:color .15s,border-color .15s;white-space:nowrap}
  .act::after{content:none !important}
  .act.hslink:hover{color:var(--ink);border-color:var(--muted)}
  .act.rmlink{margin-left:auto}
  .act.rmlink:hover{color:var(--shut);border-color:var(--shut)}

  .data{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;margin-top:12px}
  .d-item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.85rem}
  .d-item.full{grid-column:1/-1}
  .d-k{color:var(--muted)}
  .d-v{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:500}
  .d-v.pos{color:var(--open)} .d-v.neg{color:var(--shut)}
  .meter{letter-spacing:2px;font-size:.72rem;margin-right:5px}
  .qtag{font-size:.68rem;padding:0 6px;border-radius:4px;border:1px solid var(--accent);color:var(--accent);margin-left:3px}
  .perblk{margin-top:18px}
  .perblk-t{font-size:.72rem;color:var(--muted);margin-bottom:8px}
  .perblk-t b{color:var(--ink);font-variant-numeric:tabular-nums}
  .perbar{height:9px;border-radius:5px;position:relative;
    background:linear-gradient(90deg,var(--open),var(--half),var(--shut));opacity:.9}
  .perbar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bg);opacity:.9;
    transform:translateX(-50%)}
  .perbar .dot{position:absolute;top:-4.5px;width:18px;height:18px;border-radius:50%;
    background:var(--ink);border:3.5px solid var(--bg);transform:translateX(-50%);
    box-shadow:0 1px 4px rgba(0,0,0,.3)}
  /* 呼吸燈放成 .dot 的兄弟（不是子元素）：.dot 有 transform 會開新的堆疊脈絡，
     當子元素的話光暈會蓋在點上面、而不是從點後面擴散出去。 */
  .perbar .ping{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;
    border-radius:50%;background:var(--ink);opacity:0;animation:dotPing 2.2s ease-out infinite}
  @keyframes dotPing{0%{transform:scale(.6);opacity:.4}70%{transform:scale(2.4);opacity:0}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){ .perbar .ping{display:none} }
  .perscale{position:relative;height:1.1em;margin-top:7px;font-size:.68rem;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .perwhy{font-size:.68rem;color:var(--muted);margin-top:8px;line-height:1.5;
    border-left:2px solid var(--line);padding-left:8px}
  .perscale .lo{position:absolute;left:0} .perscale .hi{position:absolute;right:0}
  .perscale .md{position:absolute;transform:translateX(-50%);white-space:nowrap}
  .thesis{margin-top:14px;border-left:2px solid var(--accent);padding-left:12px}
  .thesis>summary{list-style:none;cursor:pointer;font-size:.7rem;letter-spacing:.06em;color:var(--accent);
    font-weight:600;display:flex;align-items:center;gap:6px;padding:8px 0}
  .thesis>summary::-webkit-details-marker{display:none}
  .thesis>summary::after{content:"▾";transition:transform .2s}
  .thesis[open]>summary::after{transform:rotate(180deg)}
  .thesis.empty{border-left-color:var(--line)}
  .thesis.empty>summary{color:var(--muted)}
  .thesis-body{font-size:.86rem;line-height:1.6;margin-top:2px;padding-bottom:6px}
  .thesis-body code{background:var(--track);padding:1px 5px;border-radius:4px;font-size:.9em}
  .thesis-break{display:block;color:var(--muted);font-size:.8rem;margin-top:4px}
  .thesis-break i{font-style:normal;color:var(--shut)}

  @media (prefers-reduced-motion:reduce){ .r-chev,.r-name{transition:none} }
  @media (max-width:440px){ .data{grid-template-columns:1fr} }

  details.gloss{margin-top:16px;font-size:.86rem}
  details.gloss>summary{cursor:pointer;color:var(--muted);font-weight:600}
  details.gloss ul{padding-left:1.1em;margin:.6em 0}
  details.gloss li{margin:.35em 0}
  .foot{color:var(--muted);font-size:.76rem;margin-top:22px;line-height:1.7}

  /* 浮層與圖表視窗 */
  #tip{position:fixed;left:12px;right:12px;bottom:12px;max-width:616px;margin:0 auto;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
    box-shadow:0 6px 24px rgba(0,0,0,.2);display:none;z-index:50;font-size:.9rem;line-height:1.55}
  #tip.show{display:block}
  #tip .k{font-weight:700;margin-bottom:4px}
  #tip .x{float:right;color:var(--muted);font-size:.8rem}
  #chart,#mkchart,#hchart{position:fixed;left:8px;right:8px;bottom:8px;max-width:624px;margin:0 auto;
    background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;
    box-shadow:0 8px 30px rgba(0,0,0,.24);display:none;z-index:60}
  #chart.show,#mkchart.show,#hchart.show{display:block}
  .chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .chead b{font-size:1.02rem;font-family:var(--serif);font-weight:500}
  .cx{cursor:pointer;color:var(--muted);font-size:1.15rem;padding:2px 8px}
  .cbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .cbtns button{padding:8px 13px;border:1px solid var(--line);border-radius:999px;
    background:var(--bg);color:var(--muted);font-size:.8rem;cursor:pointer;font-family:inherit}
  .cgrp{display:flex;gap:6px;flex-wrap:nowrap}
  .cbtns button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .csp{flex:1}
  /* 讀數改成貼在圖上的浮標，跟著拖曳位置左右移動 */
  .chartwrap{position:relative}
  .ctip{position:absolute;top:0;pointer-events:none;white-space:nowrap;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px 9px;
    font-size:.8rem;line-height:1.3;font-variant-numeric:tabular-nums;
    box-shadow:0 2px 10px rgba(0,0,0,.16)}
  .ctip b{font-weight:700}
  .ctip .t2{color:var(--muted);font-size:.74rem;margin-top:1px}
  /* 浮標的字跟著線的顏色，一眼對得起來是哪一條 */
  .ctip .c-ink{color:var(--ink)}
  .ctip .c-cool{color:var(--cool)}
  .ctip .c-up{color:var(--open)}
  .ctip .c-down{color:var(--shut)}
  .cstats{display:flex;flex-wrap:wrap;gap:3px 16px;margin-top:9px;
    font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .cstats b{color:var(--ink)}
  /* 焦點呼吸圈 */
  @keyframes focPing{0%{transform:scale(1);opacity:.45}70%{transform:scale(3.2);opacity:0}100%{opacity:0}}
  .focping{transform-box:fill-box;transform-origin:center;animation:focPing 2s ease-out infinite}
  @media (prefers-reduced-motion:reduce){ .focping{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <h1>打折窗口溫度計</h1>
  <div class="sub" id="sub">載入中…</div>
  <div class="hint">💡 點任一列展開細節 · 虛線名詞（ⓘ）點看白話解釋 · 分數旁 ▲▼ 是跟上一個交易日比 · 「🕰 歷史回測」拖曳看任何一天。</div>

  <div class="card" id="addcard">
    <div class="label" style="margin-bottom:8px">＋ 新增追蹤股票</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input id="newcode" inputmode="numeric" placeholder="輸入代號，如 2454"
        style="flex:1;min-width:130px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:.95rem">
      <button id="addbtn"
        style="padding:9px 16px;border:0;border-radius:8px;background:var(--open);color:#fff;font-weight:650;cursor:pointer">送出</button>
    </div>
    <div id="addmsg" class="label" style="margin-top:8px"></div>
    <div id="addstatus" style="margin-top:6px;font-size:.86rem;font-weight:600"></div>
  </div>

  <div id="app"></div>

  <div class="card" id="btcard">
    <div class="label" style="margin-bottom:8px">🕰 查清單外的股票（開歷史圖，拖曳就是時光倒流）</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="btcode" inputmode="numeric" placeholder="代號 如 6669"
        style="width:140px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:.95rem">
      <button id="btbtn"
        style="padding:9px 16px;border:0;border-radius:8px;background:var(--cool);color:#fff;font-weight:650;cursor:pointer">看歷史</button>
    </div>
    <div id="btout" style="margin-top:8px"></div>
  </div>

  <details class="gloss">
    <summary>全部欄位一次看（白話）</summary>
    <ul id="glosslist"></ul>
  </details>

  <div class="foot" id="foot"></div>
</div>

<div id="tip"></div>
<div id="chart">
  <div class="chead"><b id="ctitle"></b><span class="cx">✕</span></div>
  <div class="cbtns">
    <span class="cgrp"><button data-v="rev">月營收</button><button data-v="yoy">成長率 YoY</button></span>
    <span class="csp"></span>
    <span class="cgrp"><button data-r="12">1年</button><button data-r="24">2年</button><button data-r="36">3年</button></span>
  </div>
  <div class="cbody"></div>
</div>
<div id="mkchart">
  <div class="chead"><b>市場恐慌度 · 歷史（TAIEX）</b><span class="cx">✕</span></div>
  <div class="cbtns">
    <span class="cgrp"><button data-mv="fear">恐慌度</button><button data-mv="index">大盤指數</button><button data-mv="both">疊圖</button></span>
    <span class="csp"></span>
    <span class="cgrp"><button data-mr="125">6月</button><button data-mr="250">1年</button><button data-mr="500">2年</button></span>
  </div>
  <div class="mkbody"></div>
</div>
<div id="hchart">
  <div class="chead"><b id="htitle">歷史</b><span class="cx">✕</span></div>
  <div class="cbtns">
    <span class="cgrp"><button data-hv="comp">進場時機</button><button data-hv="price">股價</button><button data-hv="both">疊圖</button></span>
    <span class="csp"></span>
    <span class="cgrp"><button data-hr="250">1年</button><button data-hr="500">2年</button><button data-hr="750">3年</button><button data-hr="1250">5年</button></span>
  </div>
  <div class="hbody"></div>
</div>

<script>
const GLOSSARY = {
  market:"市場恐慌度：全大盤共用。高＝大家在恐慌（折扣容易出現）；低＝大家貪婪、追高危險。用大盤乖離／回檔／波動算，不用位階（多頭趨勢會失真）。",
  composite:`衡量「現在是不是進場的好時機」，三塊加權：<br>
    <span style="font-variant-numeric:tabular-nums">0.40×估值便宜　＋　0.25×基本面　＋　0.35×市場恐慌</span>
    <div style="margin:9px 0 7px;border-top:1px solid var(--line)"></div>
    <span style="color:var(--open)">●</span> <b>≥65</b>　時機佳（便宜＋恐慌）<br>
    <span style="color:var(--half)">●</span> <b>45–64</b>　普通（中性）<br>
    <span style="color:var(--shut)">●</span> <b>&lt;45</b>　時機差（貴＋貪婪）
    <div class="label" style="margin-top:9px">這是情境傾向，不是買賣訊號。</div>`,
  val_cheap:"估值便宜度：這檔的估值（本益比，或虧損過的股票用股價淨值比），站在它自己比較區間的高低位置。越低（越接近自己的便宜區）分數越高（＝100 − 位階）。回答「相對它自己，現在便宜還貴」。比較區間預設近 5 年。",
  fund:"基本面：公司賺不賺錢、在成長還衰退。用最新月營收年增率（YoY）換算，成長越猛分數越高。單月有雜訊，想看趨勢就點「營收動能📊」看歷年圖。",
  quality:"財務指紋（品質）：這是不是一門「好生意」——用近幾完整年的 ROE（股東權益報酬率）＋毛利率水準與穩定度＋營益率算，滿分 100。跟「基本面」互補：基本面看『營收現在衝不衝』（短期動能），品質看『賺錢賺得久不久、穩不穩』（長期體質）。⚠️ 刻意不併入進場時機——它回答『該不該擁有』，不是『現在時機好不好』。",
  per:"PER（本益比）：股價 ÷ 每股盈餘。買一塊錢的獲利要付幾塊，數字越大＝買得越貴。",
  pbr:"PBR（股價淨值比）：股價 ÷ 每股淨值。買一塊錢的資產要付幾塊，數字越大＝買得越貴。<br><br>這檔改用 PBR，是因為它<b>虧損過</b>——公司虧錢時沒有本益比（分母是負的或趨近 0），那段日子的 PER 在資料裡是空的。如果照樣用 PER 算位階，等於「只跟有賺錢的那半個循環比」，會把景氣頂部誤讀成便宜。淨值不會消失，所以改用 PBR。",
  pctl:"位階：現在的估值，站在它自己比較區間由低到高的第幾個百分點。越低＝越接近它自己的便宜區。<br><br>比較區間<b>預設近 5 年</b>；業態真的變過、舊資料不可比的股票，可以在 <code>watchlist.txt</code> 逐檔改起算日（<code>@since=2023-01 理由</code>，理由必填），卡片上會標出來。<br><b>少調它</b>——縮短區間的實際效果是刪掉低估值年代，會讓幾乎每一檔都變便宜。",
};
const term=(k,t)=>`<span class="term" data-k="${k}">${t}</span>`;
const chartLink=(code)=>`<span class="chartlink" data-code="${code}">營收動能</span>`;
const rmLink=(code)=>`<span class="rmlink" data-code="${code}">移除</span>`;
function compColor(s){ return s>=65?"var(--open)": s>=45?"var(--half)": "var(--shut)"; }
function mktColor(s){ return s>=65?"var(--open)" : s>=40?"var(--half)" : "var(--hot)"; }
function esc(x){ return x==null?"—":x; }

// 現價漲跌：spark 是近 65 個交易日的收盤，最後兩筆＝最新交易日的變化。
// 資料每交易日收盤後由 Action 更新，不是即時報價。
function priceChg(spark){
  if(!spark || spark.length<2) return {day:null, q3:null};
  const now=spark[spark.length-1], prev=spark[spark.length-2], first=spark[0];
  const pct=(a,b)=> (!b)?null:Math.round((a/b-1)*1000)/10;
  return {day:pct(now,prev), q3:pct(now,first)};
}
function chgCls(v){ return v>0?"up":v<0?"down":"flat"; }
function chgHTML(v){                    // 有箭頭：最新交易日
  if(v==null) return "";
  return `<span class="pchg ${chgCls(v)}">${v>0?"▲":v<0?"▼":"－"}${Math.abs(v)}%</span>`;
}
function chgTxt(v){                     // 純數字：近 3 月
  if(v==null) return "";
  return `<span class="pchg ${chgCls(v)}">${v>0?"+":""}${v}%</span>`;
}

// 財務指紋（品質）：5 顆圓點 ＋ 分數 ＋ 一句評等
function qMeter(q){
  if(!q || q.score==null) return '<span style="color:var(--muted)">—（資料不足）</span>';
  const f=Math.round(q.score/20); let dots="";
  for(let i=0;i<5;i++) dots+=`<span style="color:${i<f?'var(--open)':'var(--line)'}">●</span>`;
  return `<span class="meter">${dots}</span>${q.score} <span class="qtag">${q.word}</span>`;
}
// 論點卡（有填→展開你寫的；沒填→提示去 thesis.json 補）
function thesisHTML(s){

let CH={code:null, view:"rev", range:24, focus:null};
function syncBtns(){

function drawChart(){
  const s=window.DATA.stocks.find(x=>x.code===CH.code);
  const h=s.revenue_history.slice(-CH.range);
  const isRev=CH.view==="rev";
  if(CH.focus==null) CH.focus=h.length-1;
  CH.focus=Math.max(0,Math.min(h.length-1,CH.focus));
  const val=d=> isRev?(d.rev||0):(d.yoy==null?0:d.yoy);
  const vals=h.map(val);
  const W=340,H=160,padL=30,padR=10,padT=10,padB=22;
  const iw=W-padL-padR, ih=H-padT-padB;
  const maxV=Math.max(...vals,1);
  const minV=isRev?0:Math.min(...vals,0);
  const span=(maxV-minV)||1;
  const bw=iw/h.length;
  const y=v=> padT+(maxV-v)/span*ih;
  const yz=y(0);

  // Y 軸格線＋刻度數值
  const ticks=[...new Set(isRev?[0,maxV]:[minV,0,maxV])];
  let grid="";
  ticks.forEach(tv=>{
    const yy=y(tv);
    grid+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width=".6"/>`;
    grid+=`<text x="${(padL-4).toFixed(1)}" y="${(yy+2.6).toFixed(1)}" font-size="7.5" fill="var(--muted)" text-anchor="end">${isRev?Math.round(tv):(tv>0?"+":"")+Math.round(tv)+"%"}</text>`;
  });

  // 長條＋年份分隔線＋透明點擊區（整欄可點）
  let bars="", marks="", hits="";
  h.forEach((d,i)=>{
    const v=val(d), cx=padL+i*bw;
    const bx=cx+bw*0.15, w=Math.max(1.2,bw*0.7), yv=y(v);
    const top=Math.min(yv,yz), ht=Math.max(1,Math.abs(yv-yz));
    const foc=(i===CH.focus);
    const col=isRev?"var(--cool)":(v>=0?"var(--open)":"var(--shut)");
    if(foc) bars+=`<rect x="${cx.toFixed(1)}" y="${padT}" width="${bw.toFixed(1)}" height="${ih}" fill="var(--ink)" opacity=".07"/>`;
    bars+=`<rect x="${bx.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${ht.toFixed(1)}" rx="1" fill="${col}" opacity="${foc?1:.6}"/>`;
    const mo=d.ym.slice(5);
    if(mo==="01"){
      marks+=`<line x1="${cx.toFixed(1)}" y1="${padT}" x2="${cx.toFixed(1)}" y2="${(padT+ih).toFixed(1)}" stroke="var(--line)" stroke-width=".6" stroke-dasharray="2 2"/>`;
      marks+=`<text x="${(cx+bw/2).toFixed(1)}" y="${H-6}" font-size="7.5" fill="var(--muted)" text-anchor="middle">${d.ym.slice(0,4)}</text>`;
    } else if(i===0){
      marks+=`<text x="${(cx+bw/2).toFixed(1)}" y="${H-6}" font-size="7.5" fill="var(--muted)" text-anchor="middle">${d.ym.slice(0,4)}</text>`;
    }
    hits+=`<rect class="hit" data-i="${i}" x="${cx.toFixed(1)}" y="${padT}" width="${bw.toFixed(1)}" height="${ih}" fill="transparent" style="cursor:pointer"/>`;
  });

  const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${grid}${bars}${marks}${hits}</svg>`;

  // 選中月份的讀數（同時秀營收與 YoY，不管目前看哪個檢視）
  const f=h[CH.focus];
  const yoyTxt=f.yoy==null?"—":(f.yoy>0?"+":"")+f.yoy+"%";
  const yoyCol= f.yoy==null?"" : f.yoy>=0?"c-up":"c-down";
  const tip=`<div class="ctip" id="chtip"><b>${f.ym}</b><div class="t2">`+
    `<span class="c-cool">營收 <b>${f.rev}</b> 億</span> · `+
    `<span class="${yoyCol}">YoY <b>${yoyTxt}</b></span></div></div>`;
  document.querySelector("#chart .cbody").innerHTML=
    `<div class="chartwrap">${svg}${tip}</div>`+
    `<div class="label" style="margin-top:8px">${isRev?"每月營收（億元）":"月營收年增率 YoY（綠正紅負）"}　·　近 ${CH.range} 個月</div>`;
  placeTip(document.getElementById("chtip"), padL+(CH.focus+0.5)*bw, W);
}

// ── 市場恐慌度歷史（把 build_data.py 的市場恐慌度公式，對每一天各算一次）──
let MK={view:"both", range:250, focus:null, series:null, _n:0};   // 預設疊圖：一眼看情緒與指數的關係
// 與 build_data.py 完全同式，但一次把「每一天」都算出來（前 249 天視窗不足 → null）。
// 全檔唯一實作：市場恐慌度歷史圖與個股歷史圖共用，避免兩份公式各自漂移。
function fearSeries(closes){
  const out=new Array(closes.length).fill(null);
  const rets=[]; for(let i=1;i<closes.length;i++) rets.push(closes[i]/closes[i-1]-1);
  let s120=0;
  for(let i=0;i<closes.length;i++){
    s120+=closes[i]; if(i>=120) s120-=closes[i-120];
    if(i<249) continue;
    const c=closes[i], ma120=s120/120;
    const bias=(c-ma120)/ma120*100;
    let hi=closes[i-249]; for(let k=i-248;k<=i;k++) if(closes[k]>hi) hi=closes[k];
    const dd=(c-hi)/hi*100;
    const vol=pstdev(rets.slice(i-20,i))*Math.sqrt(252)*100;
    out[i]={score:Math.round(0.4*bclamp(50-bias*3.3)+0.3*bclamp(-dd*2.5)+0.3*bclamp((vol-12)/26*100)),
            bias, dd, vol};
  }
  return out;
}
// 浮標定位：x 是 viewBox 座標（svg width:100% ⇒ x/W 就是容器百分比）。
// 靠邊時改成貼齊該側，避免浮標被切掉。
function placeTip(el, x, W){
  if(!el) return;
  const pct=x/W*100;
  el.style.left=pct+"%";
  el.style.transform = pct<28 ? "translateX(-6px)"
                     : pct>72 ? "translateX(calc(-100% + 6px))"
                     : "translateX(-50%)";
}

function mkTipInner(d, mode){        // 浮標內容（拖曳時即時換這段）
  const tag= d.score>=65?"恐慌": d.score>=40?"中性":"貪婪";
  const fear=`<span class="c-ink">恐慌度 <b>${d.score}</b> ${tag}</span>`;
  const idx =`<span class="c-cool">大盤 <b>${Math.round(d.close)}</b></span>`;
  const l2= mode==="index" ? `${idx} · ${fear}`
          : mode==="both"  ? `${fear} · ${idx}`
          : `${fear} · 乖離 ${d.bias>0?"+":""}${Math.round(d.bias*10)/10}%`;
  return `<b>${d.date}</b><div class="t2">${l2}</div>`;
}
function mkSync(){
  document.querySelectorAll("#mkchart .cbtns button").forEach(b=>{
    b.classList.toggle("on", b.dataset.mv===MK.view || (+b.dataset.mr)===MK.range);
  });
}
async function mkOpen(){
  const modal=document.getElementById("mkchart"), body=document.querySelector("#mkchart .mkbody");
  modal.classList.add("show");
  if(MK.series){ MK.focus=null; mkDraw(); mkSync(); return; }
  body.innerHTML='<div class="label">計算中…（向 FinMind 取大盤歷史，約 1~3 秒）</div>';
  try{
    const today=new Date().toISOString().slice(0,10);
    const rows=(await fmGet("TaiwanStockPrice","TAIEX",shiftDays(today,-1300),today)).sort((a,b)=>a.date<b.date?-1:1);
    const closes=rows.map(r=>r.close), dates=rows.map(r=>r.date);
    if(closes.length<260) throw new Error("大盤資料不足。");
    const f=fearSeries(closes), series=[];
    for(let i=0;i<f.length;i++) if(f[i])
      series.push({date:dates[i], score:f[i].score, close:closes[i], bias:f[i].bias, dd:f[i].dd, vol:f[i].vol});
    MK.series=series; MK.focus=null; mkDraw(); mkSync();
  }catch(e){ body.innerHTML='<span class="err">'+(e.message||"取資料失敗")+'</span>'; }
}
function mkDraw(){
  const body=document.querySelector("#mkchart .mkbody");
  if(!MK.series || !MK.series.length){ body.innerHTML='<div class="label">抓不到大盤資料，稍後再試。</div>'; return; }
  const s=MK.series.slice(-MK.range), n=s.length; MK._n=n;
  if(MK.focus==null) MK.focus=n-1;
  MK.focus=Math.max(0,Math.min(n-1,MK.focus));
  const mode=MK.view;                       // fear | index | both
  const showFear=mode!=="index", showIndex=mode!=="fear", showBands=mode!=="index";
  const W=340,H=172,padL=30,padR=10,padT=10,padB=22, iw=W-padL-padR, ih=H-padT-padB;
  const cs=s.map(d=>d.close);
  const imin0=Math.min(...cs), imax0=Math.max(...cs), ip=(imax0-imin0)*0.05||1;
  const imin=imin0-ip, imax=imax0+ip;
  const step= n>1? iw/(n-1) : iw, X=j=> padL+j*step;
  const Yf=v=> padT+(100-v)/100*ih;                 // 恐慌度 0~100（左）
  const Yi=v=> padT+(imax-v)/((imax-imin)||1)*ih;   // 大盤點數（右）

  let bg="";
  if(showBands){
    [[65,100,"var(--open)"],[40,65,"var(--half)"],[0,40,"var(--hot)"]].forEach(z=>{
      const yt=Yf(z[1]), yb=Yf(z[0]);
      bg+=`<rect x="${padL}" y="${yt.toFixed(1)}" width="${iw}" height="${(yb-yt).toFixed(1)}" fill="${z[2]}" opacity=".10"/>`;
    });
    [65,40].forEach(t=>{ const yy=Yf(t);
      bg+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width=".6"/>`;
      bg+=`<text x="${padL-4}" y="${(yy+2.6).toFixed(1)}" font-size="7.5" fill="var(--muted)" text-anchor="end">${t}</text>`;
    });
  } else {
    [imax0,imin0].forEach(t=>{ const yy=Yi(t);
      bg+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width=".6"/>`;
      bg+=`<text x="${padL-4}" y="${(yy+2.6).toFixed(1)}" font-size="7.5" fill="var(--muted)" text-anchor="end">${Math.round(t)}</text>`;
    });
  }

  // 折線（疊圖時大盤在下、恐慌度在上）
  let lines="";
  if(showIndex){ let p=""; s.forEach((d,j)=> p+=`${X(j).toFixed(1)},${Yi(d.close).toFixed(1)} `);
    lines+=`<polyline points="${p.trim()}" fill="none" stroke="var(--cool)" stroke-width="1.4" opacity="${mode==="both"?".85":"1"}"/>`; }
  if(showFear){ let p=""; s.forEach((d,j)=> p+=`${X(j).toFixed(1)},${Yf(d.score).toFixed(1)} `);
    lines+=`<polyline points="${p.trim()}" fill="none" stroke="var(--ink)" stroke-width="1.4"/>`; }

  let marks="";
  s.forEach((d,j)=>{
    if(d.date.slice(5,7)==="01" && (j===0 || s[j-1].date.slice(5,7)!=="01"))
      marks+=`<line x1="${X(j).toFixed(1)}" y1="${padT}" x2="${X(j).toFixed(1)}" y2="${(padT+ih).toFixed(1)}" stroke="var(--line)" stroke-width=".6" stroke-dasharray="2 2"/>`;
  });
  marks+=`<text x="${padL}" y="${H-6}" font-size="7.5" fill="var(--muted)">${s[0].date.slice(0,7)}</text>`;
  marks+=`<text x="${W-padR}" y="${H-6}" font-size="7.5" fill="var(--muted)" text-anchor="end">${s[n-1].date.slice(0,7)}</text>`;

  const f=s[MK.focus], fx=X(MK.focus);
  let foc=`<line id="mkfl" x1="${fx.toFixed(1)}" y1="${padT}" x2="${fx.toFixed(1)}" y2="${(padT+ih).toFixed(1)}" stroke="var(--muted)" stroke-width=".7"/>`;
  if(showIndex) foc+=`<circle class="focping" id="mkpi" cx="${fx.toFixed(1)}" cy="${Yi(f.close).toFixed(1)}" r="3.2" fill="var(--cool)"/>`+
                     `<circle id="mkdi" cx="${fx.toFixed(1)}" cy="${Yi(f.close).toFixed(1)}" r="2.6" fill="var(--cool)"/>`;
  if(showFear) foc+=`<circle class="focping" id="mkpf" cx="${fx.toFixed(1)}" cy="${Yf(f.score).toFixed(1)}" r="3.2" fill="var(--ink)"/>`+
                    `<circle id="mkdf" cx="${fx.toFixed(1)}" cy="${Yf(f.score).toFixed(1)}" r="2.6" fill="var(--ink)"/>`;
  const hit=`<rect class="mkhit" x="${padL}" y="${padT}" width="${iw}" height="${ih}" fill="transparent" style="cursor:crosshair;touch-action:none"/>`;
  const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${bg}${lines}${marks}${foc}${hit}</svg>`;

  const legend= mode==="both"
    ? `<div class="label" style="margin-bottom:4px"><span style="color:var(--ink)">━ 恐慌度 0–100</span>　<span style="color:var(--cool)">━ 大盤 ${Math.round(imin0)}–${Math.round(imax0)}</span></div>`
    : "";
  body.innerHTML=legend+`<div class="chartwrap">${svg}<div class="ctip" id="mktip">${mkTipInner(f,mode)}</div></div>`;

  // 拖曳掃描用：預存每點座標＋焦點元素參照，滑動時只改焦點、不重繪整張
  MK._pts=s.map((d,j)=>({x:X(j), yf:Yf(d.score), yi:Yi(d.close)}));
  MK._s=s; MK._mode=mode; MK._W=W;
  MK._fl=body.querySelector("#mkfl"); MK._df=body.querySelector("#mkdf"); MK._di=body.querySelector("#mkdi"); MK._pf=body.querySelector("#mkpf"); MK._pi=body.querySelector("#mkpi");
  MK._tip=body.querySelector("#mktip"); placeTip(MK._tip, fx, W);
}
function mkUpdateFocus(idx){          // 拖曳中即時更新（輕量，不呼叫 mkDraw）
  if(!MK._pts || !MK._pts.length) return;
  idx=Math.max(0,Math.min(MK._pts.length-1,idx));
  if(idx===MK.focus) return;
  MK.focus=idx;
  const p=MK._pts[idx], d=MK._s[idx];
  if(MK._fl){ MK._fl.setAttribute("x1",p.x.toFixed(1)); MK._fl.setAttribute("x2",p.x.toFixed(1)); }
  [[MK._df,p.yf],[MK._pf,p.yf],[MK._di,p.yi],[MK._pi,p.yi]].forEach(([el,y])=>{
    if(el){ el.setAttribute("cx",p.x.toFixed(1)); el.setAttribute("cy",y.toFixed(1)); } });
  if(MK._tip){ MK._tip.innerHTML=mkTipInner(d, MK._mode); placeTip(MK._tip, p.x, MK._W); }
}
(function(){                          // 拖曳掃描：按著在圖上左右滑，焦點跟著跑
  const modal=document.getElementById("mkchart"); if(!modal) return;
  let dragging=false;
  function idxFromX(clientX){
    const hitEl=modal.querySelector(".mkhit"); if(!hitEl || !MK._n) return null;
    const r=hitEl.getBoundingClientRect();
    return Math.round(bclamp((clientX-r.left)/r.width,0,1)*(MK._n-1));
  }
  modal.addEventListener("pointerdown", e=>{
    if(!e.target.closest(".mkhit")) return;
    dragging=true; const i=idxFromX(e.clientX); if(i!=null) mkUpdateFocus(i); e.preventDefault();
  });
  window.addEventListener("pointermove", e=>{
    if(!dragging) return; const i=idxFromX(e.clientX); if(i!=null) mkUpdateFocus(i); e.preventDefault();
  });
  window.addEventListener("pointerup", ()=>{ dragging=false; });
  window.addEventListener("pointercancel", ()=>{ dragging=false; });
})();

// ── 這檔的歷史（＝時光倒流回測，做成可拖曳的曲線）────────────────────
// 一次把 PER／股價／月營收／大盤抓齊，之後在瀏覽器裡把 build_data.py 的公式
// 對「每一個交易日」各算一次。拖曳＝換 as_of，不用重新查詢。
// 公式與 build_data.py 一致，且只餵「那一天當下拿得到」的資料（月營收算次月10日才公布）。
let HS={code:null, name:"", view:"both", range:500, focus:null, series:null, _n:0, _cache:{}};  // 預設疊圖

function hsSync(){
  document.querySelectorAll("#hchart .cbtns button").forEach(b=>{
    b.classList.toggle("on", b.dataset.hv===HS.view || (+b.dataset.hr)===HS.range);
  });
}
function hsTipInner(d){              // 浮標：只放最重要的兩行
  const tag = d.comp==null?"" : d.comp>=65?" 時機佳" : d.comp>=45?" 普通":" 時機差";
  return `<b>${d.date}</b><div class="t2">`+
    `<span class="c-ink">進場時機 <b>${d.comp==null?"—":d.comp}</b>${tag}</span> · `+
    `<span class="c-cool">收盤 <b>${Math.round(d.close*100)/100}</b></span></div>`;
}
function hsDetailInner(d, hasComp){  // 圖下細節列：回測要看的數字（拖曳時一起換）
  if(!hasComp) return '<span>這檔算不出估值位階（本夢比），只能看股價。</span>';
  return `<span>${HS._mName||"PER"} <b>${d.mval==null?"—":d.mval}</b></span><span>位階 <b>${d.pctl==null?"—":d.pctl+"%"}</b></span>`+
         `<span>營收YoY <b>${d.yoy==null?"—":(d.yoy>0?"+":"")+d.yoy+"%"}</b></span>`+
         `<span>大盤恐慌 <b>${d.mk==null?"—":d.mk}</b></span>`;
}

async function hsBuild(code){
  const ck=code+"|"+MODE;                  // 兩種模式的序列不同，快取要分開
  if(HS._cache[ck]) return HS._cache[ck];
  // 用哪把尺、哪個起算日都必須跟卡片一致（data.json 的 metric / metric_since），
  // 否則圖的最後一天會跟卡片對不上。TaiwanStockPER 同時回 PER 與 PBR，不用多打一次 API。
  const meta=view((window.DATA&&window.DATA.stocks||[]).find(x=>x.code===code));
  const perSince=(meta&&meta.metric_since)||null;
  const mKey=(meta&&meta.metric==="pbr")?"PBR":"PER";
  HS._mName=mKey;
  const today=new Date().toISOString().slice(0,10);
  const [per,px,tx,rev]=await Promise.all([
    fmGet("TaiwanStockPER",code,shiftDays(today,-3100),today),   // 位階看前5年 → 要比回測區間多抓5年
    fmGet("TaiwanStockPrice",code,shiftDays(today,-2000),today),
    fmGet("TaiwanStockPrice","TAIEX",shiftDays(today,-2300),today),
    fmGet("TaiwanStockMonthRevenue",code,shiftDays(today,-2400),today),
  ]);
  if(!px.length) throw new Error("查無這檔股票的股價，確認一下代號？");
  const pr=px.slice().sort((a,b)=>a.date<b.date?-1:1);
  const tr=tx.slice().sort((a,b)=>a.date<b.date?-1:1);
  const fear=fearSeries(tr.map(r=>r.close));           // 大盤恐慌度：逐日
  const fdates=tr.map(r=>r.date);
  const pp=per.filter(r=>r[mKey]).sort((a,b)=>a.date<b.date?-1:1);
  const rv=rev.slice().sort((a,b)=>(a.revenue_year-b.revenue_year)||(a.revenue_month-b.revenue_month));
  const revIdx={}; rv.forEach(r=> revIdx[r.revenue_year+"-"+r.revenue_month]=r.revenue);

  const spine=pr.slice(-1320);            // 上限 5 年多一點（範圍鍵最長 5 年）
  const out=[];
  let j=-1, fi=-1, lastFear=null;
  for(const row of spine){
    const d=row.date;
    while(j+1<pp.length && pp[j+1].date<=d) j++;
    while(fi+1<fdates.length && fdates[fi+1]<=d) fi++;
    if(fi>=0 && fear[fi]) lastFear=fear[fi].score;
    // 估值便宜度＝100 − 位階（視窗樣本太少就不評分）
    let val=null, mNow=null, pctl=null;
    if(j>=0){
      const cut=perSince || shiftDays(d,-1825);     // 釘死起算日 or 近 5 年滾動
      let a=0,b=j; while(a<b){ const m=(a+b)>>1; if(pp[m].date<cut) a=m+1; else b=m; }
      if(j-a>=200){                                 // 與 build_data.py 的 PER_MIN_SAMPLES 同值，改要一起改
        mNow=pp[j][mKey]; let below=0;
        for(let k=a;k<=j;k++) if(pp[k][mKey]<=mNow) below++;
        pctl=Math.round(below/(j-a+1)*100); val=100-pctl;
      }
    }
    // 月營收 YoY：只採「那天已經公布」的月份
    let yoy=null;
    for(let k=rv.length-1;k>=0;k--){
      const r=rv[k];
      if(!monthAvail(r.revenue_year,r.revenue_month,d,today)) continue;
      const py=revIdx[(r.revenue_year-1)+"-"+r.revenue_month];
      if(py) yoy=Math.round((r.revenue-py)/py*1000)/10;
      break;
    }
    const fund = yoy==null?null:Math.round(bclamp(45+yoy*1.2));
    const comp = (val==null||lastFear==null)?null
               : Math.round(0.40*val+0.25*(fund==null?45:fund)+0.35*lastFear);
    out.push({date:d, close:row.close, comp, val, fund, yoy, mk:lastFear,
              mval: mNow==null?null:Math.round(mNow*100)/100, pctl});
  }
  HS._cache[ck]=out;
  return out;
}

async function hsOpen(code, name){
  const modal=document.getElementById("hchart"), body=document.querySelector("#hchart .hbody");
  const s=(window.DATA&&window.DATA.stocks||[]).find(x=>x.code===code);
  HS.name = name || (s?(s.name||""):"");
  HS.mode = MODE;
  document.getElementById("htitle").textContent=(HS.name?HS.name+" ":"")+code+"　歷史";
  modal.classList.add("show");
  if(HS.code===code && HS.series && HS._seriesMode===MODE){ HS.focus=null; hsDraw(); hsSync(); return; }
  HS.code=code; HS.series=null; HS.focus=null; HS._seriesMode=MODE;
  body.innerHTML='<div class="label">計算中…（抓 FinMind 歷史，再把溫度計對每一天各算一次，約 1~3 秒）</div>';
  try{
    HS.series=await hsBuild(code);
    HS.focus=null; hsDraw(); hsSync();
  }catch(e){ body.innerHTML='<span class="err">'+(e.message||"取資料失敗")+'</span>'; }
}

function hsDraw(){
  const body=document.querySelector("#hchart .hbody");
  if(!HS.series||!HS.series.length){ body.innerHTML='<div class="label">抓不到資料，稍後再試。</div>'; return; }
  const s=HS.series.slice(-HS.range), n=s.length; HS._n=n;
  if(HS.focus==null) HS.focus=n-1;
  HS.focus=Math.max(0,Math.min(n-1,HS.focus));
  const hasComp=s.some(d=>d.comp!=null);
  const mode=hasComp?HS.view:"price";           // 本夢比（無 PER）只能看股價
  const showC=mode!=="price", showP=mode!=="comp", showBands=mode!=="price";
  const W=340,H=205,padL=30,padR=10,padT=10,padB=22, iw=W-padL-padR, ih=H-padT-padB;
  const cs=s.map(d=>d.close);
  const p0=Math.min(...cs), p1=Math.max(...cs), pad=(p1-p0)*0.05||1;
  const pmin=p0-pad, pmax=p1+pad;
  const step=n>1?iw/(n-1):iw, X=j=>padL+j*step;
  const Yc=v=>padT+(100-v)/100*ih;                        // 進場時機 0~100（左）
  const Yp=v=>padT+(pmax-v)/((pmax-pmin)||1)*ih;          // 股價（右）

  let bg="";
  if(showBands){
    [[65,100,"var(--open)"],[45,65,"var(--half)"],[0,45,"var(--shut)"]].forEach(z=>{
      const yt=Yc(z[1]), yb=Yc(z[0]);
      bg+=`<rect x="${padL}" y="${yt.toFixed(1)}" width="${iw}" height="${(yb-yt).toFixed(1)}" fill="${z[2]}" opacity=".10"/>`;
    });
    [65,45].forEach(t=>{ const yy=Yc(t);
      bg+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width=".6"/>`;
      bg+=`<text x="${padL-4}" y="${(yy+2.6).toFixed(1)}" font-size="7.5" fill="var(--muted)" text-anchor="end">${t}</text>`;
    });
  }else{
    [p1,p0].forEach(t=>{ const yy=Yp(t);
      bg+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width=".6"/>`;
      bg+=`<text x="${padL-4}" y="${(yy+2.6).toFixed(1)}" font-size="7.5" fill="var(--muted)" text-anchor="end">${Math.round(t)}</text>`;
    });
  }

  let lines="";
  if(showP){ let d=""; s.forEach((r,j)=> d+=(j?"L":"M")+X(j).toFixed(1)+" "+Yp(r.close).toFixed(1)+" ");
    lines+=`<path d="${d.trim()}" fill="none" stroke="var(--cool)" stroke-width="1.4" opacity="${mode==="both"?".85":"1"}"/>`; }
  if(showC){ let d="",pen=false;                       // comp 可能有缺口（早期資料不足）
    s.forEach((r,j)=>{ if(r.comp==null){ pen=false; return; }
      d+=(pen?"L":"M")+X(j).toFixed(1)+" "+Yc(r.comp).toFixed(1)+" "; pen=true; });
    if(d) lines+=`<path d="${d.trim()}" fill="none" stroke="var(--ink)" stroke-width="1.4"/>`; }

  let marks="";
  s.forEach((r,j)=>{ if(r.date.slice(5,7)==="01" && (j===0||s[j-1].date.slice(5,7)!=="01"))
    marks+=`<line x1="${X(j).toFixed(1)}" y1="${padT}" x2="${X(j).toFixed(1)}" y2="${(padT+ih).toFixed(1)}" stroke="var(--line)" stroke-width=".6" stroke-dasharray="2 2"/>`; });
  marks+=`<text x="${padL}" y="${H-6}" font-size="7.5" fill="var(--muted)">${s[0].date.slice(0,7)}</text>`;
  marks+=`<text x="${W-padR}" y="${H-6}" font-size="7.5" fill="var(--muted)" text-anchor="end">${s[n-1].date.slice(0,7)}</text>`;

  const f=s[HS.focus], fx=X(HS.focus);
  let foc=`<line id="hsfl" x1="${fx.toFixed(1)}" y1="${padT}" x2="${fx.toFixed(1)}" y2="${(padT+ih).toFixed(1)}" stroke="var(--muted)" stroke-width=".7"/>`;
  if(showP) foc+=`<circle class="focping" id="hspp" cx="${fx.toFixed(1)}" cy="${Yp(f.close).toFixed(1)}" r="3.2" fill="var(--cool)"/>`+
                 `<circle id="hsdp" cx="${fx.toFixed(1)}" cy="${Yp(f.close).toFixed(1)}" r="2.6" fill="var(--cool)"/>`;
  if(showC) foc+=`<circle class="focping" id="hspc" cx="${fx.toFixed(1)}" cy="${f.comp==null?0:Yc(f.comp).toFixed(1)}" r="3.2" fill="var(--ink)" opacity="${f.comp==null?0:1}"/>`+
                 `<circle id="hsdc" cx="${fx.toFixed(1)}" cy="${f.comp==null?0:Yc(f.comp).toFixed(1)}" r="2.6" fill="var(--ink)" opacity="${f.comp==null?0:1}"/>`;
  const hit=`<rect class="hshit" x="${padL}" y="${padT}" width="${iw}" height="${ih}" fill="transparent" style="cursor:crosshair;touch-action:none"/>`;
  const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${bg}${lines}${marks}${foc}${hit}</svg>`;

  const legend= mode==="both"
    ? `<div class="label" style="margin-bottom:4px"><span style="color:var(--ink)">━ 進場時機 0–100</span>　<span style="color:var(--cool)">━ 股價 ${Math.round(p0)}–${Math.round(p1)}</span></div>`
    : "";
  body.innerHTML=legend+`<div class="chartwrap">${svg}<div class="ctip" id="hstip">${hsTipInner(f)}</div></div>`+
                 `<div class="cstats" id="hsdet">${hsDetailInner(f,hasComp)}</div>`;

  HS._pts=s.map((d,j)=>({x:X(j), yc:d.comp==null?null:Yc(d.comp), yp:Yp(d.close)}));
  HS._s=s; HS._W=W; HS._hasComp=hasComp;
  HS._fl=body.querySelector("#hsfl"); HS._dc=body.querySelector("#hsdc"); HS._dp=body.querySelector("#hsdp");
  HS._pc=body.querySelector("#hspc"); HS._pp=body.querySelector("#hspp");
  HS._tip=body.querySelector("#hstip"); HS._det=body.querySelector("#hsdet"); placeTip(HS._tip, fx, W);
}

function hsUpdateFocus(idx){          // 拖曳中即時更新（不重繪整張圖）
  if(!HS._pts||!HS._pts.length) return;
  idx=Math.max(0,Math.min(HS._pts.length-1,idx));
  if(idx===HS.focus) return;
  HS.focus=idx; const p=HS._pts[idx], d=HS._s[idx];
  if(HS._fl){ HS._fl.setAttribute("x1",p.x.toFixed(1)); HS._fl.setAttribute("x2",p.x.toFixed(1)); }
  [HS._dc,HS._pc].forEach(el=>{ if(!el) return;
    if(p.yc==null){ el.setAttribute("opacity","0"); }
    else { el.setAttribute("opacity","1"); el.setAttribute("cx",p.x.toFixed(1)); el.setAttribute("cy",p.yc.toFixed(1)); } });
  [HS._dp,HS._pp].forEach(el=>{ if(!el) return;
    el.setAttribute("cx",p.x.toFixed(1)); el.setAttribute("cy",p.yp.toFixed(1)); });
  if(HS._tip){ HS._tip.innerHTML=hsTipInner(d); placeTip(HS._tip, p.x, HS._W); }
  if(HS._det) HS._det.innerHTML=hsDetailInner(d, HS._hasComp);
}
(function(){
  const modal=document.getElementById("hchart"); if(!modal) return;
  let dragging=false;
  function idxFromX(cx){ const el=modal.querySelector(".hshit"); if(!el||!HS._n) return null;
    const r=el.getBoundingClientRect(); return Math.round(bclamp((cx-r.left)/r.width,0,1)*(HS._n-1)); }
  modal.addEventListener("pointerdown",e=>{ if(!e.target.closest(".hshit")) return;
    dragging=true; const i=idxFromX(e.clientX); if(i!=null) hsUpdateFocus(i); e.preventDefault(); });
  window.addEventListener("pointermove",e=>{ if(!dragging) return;
    const i=idxFromX(e.clientX); if(i!=null) hsUpdateFocus(i); e.preventDefault(); });
  window.addEventListener("pointerup",()=>{ dragging=false; });
  window.addEventListener("pointercancel",()=>{ dragging=false; });
})();

// ── 統一點擊處理：圖表按鈕 / 關閉 / 營收開圖 / 名詞浮層 / 點外關閉 ──

  const mh=e.target.closest("#mkchart .mkhit");

  const hh=e.target.closest("#hchart .hshit");
  if(hh){ const r=hh.getBoundingClientRect(); HS.focus=Math.round(bclamp((e.clientX-r.left)/r.width,0,1)*(HS._n-1)); hsDraw(); e.stopPropagation(); return; }
  const cx=e.target.closest(".cx");

// ── 新增／移除追蹤（送出後向 GitHub 公開 API 輪詢近即時狀態；唯讀、免 token）──
const REPO="tsai200493-Cyrus/tw-discount-dashboard";
const GHAPI="https://api.github.com/repos/"+REPO;
let TW={watch:null};  // {action:'add'|'remove', code, title, since, timer, tries}
function twStat(html,color){ const s=document.getElementById("addstatus"); if(s){ s.style.color=color||"var(--muted)"; s.innerHTML=html; } }
function twStop(){ if(TW.watch&&TW.watch.timer) clearInterval(TW.watch.timer); TW.watch=null; }

async function twPoll(){
  const w=TW.watch; if(!w) return;
  if(++w.tries>28){ twStat("（等太久了，改到 GitHub 那張單看狀態；清單仍會自動更新）"); twStop(); return; }
  let issues;
  try{
    const r=await fetch(GHAPI+"/issues?state=all&sort=created&direction=desc&per_page=15",
                        {headers:{Accept:"application/vnd.github+json"}});
    if(r.status===403){ twStat("（GitHub 查詢額度暫時用完，稍後會自動恢復；清單仍會更新）"); twStop(); return; }
    issues=await r.json();
  }catch(_){ return; }               // 網路暫斷，下一輪再試
  if(!Array.isArray(issues)) return;
  const hit=issues.find(it=> it.title && it.title.trim()===w.title
                          && new Date(it.created_at).getTime() >= w.since-60000);
  if(!hit){ twStat("⏳ 等你在 GitHub 那頁按下綠色 <b>Submit new issue</b>…"); return; }
  if(hit.state==="open"){ twStat("⏳ 已收到 <b>#"+hit.number+"</b>，機器人處理中…"); return; }
  let body="";
  try{
    const c=await fetch(GHAPI+"/issues/"+hit.number+"/comments?per_page=10",
                        {headers:{Accept:"application/vnd.github+json"}});
    const cs=await c.json();
    if(Array.isArray(cs)&&cs.length) body=(cs[cs.length-1].body||"").trim();
  }catch(_){}
  if(!body){ twStat("已處理 <b>#"+hit.number+"</b>，重新整理看結果。"); twStop(); return; }
  const color= body.startsWith("✅")?"var(--open)" : body.startsWith("ℹ️")?"var(--muted)" : "var(--shut)";
  twStat(body,color);
  const ok=body.startsWith("✅"), code=w.code, action=w.action;
  twStop();
  if(ok) twWaitData(code, action);
}

async function twWaitData(code, action){   // ✅ 後等 Pages 重佈署，清單一到就自動刷新
  for(let i=0;i<8;i++){
    await new Promise(r=>setTimeout(r,15000));
    try{
      const d=await (await fetch("./data.json?_="+Date.now())).json();
      const present=(d.stocks||[]).some(s=>s.code===code);
      if(action==="add" ? present : !present){
        render(d);
        twStat(action==="add" ? "✅ "+code+" 已出現在下方清單。" : "✅ "+code+" 已從清單移除。","var(--open)");
        return;
      }
    }catch(_){}
  }
}

function startTickerFlow(action, code){    // action: 'add' | 'remove'
  const title="["+action+"] "+code;
  const url="https://github.com/"+REPO+"/issues/new?title="+encodeURIComponent(title)+
    "&body="+encodeURIComponent((action==="remove"?"移除追蹤 ":"新增追蹤 ")+code+"，送出後系統會處理清單。");
  document.getElementById("addmsg").innerHTML='已開好 GitHub 投件頁 → 按綠色 <b>Submit new issue</b>。下面會即時顯示進度：';
  document.getElementById("addcard").scrollIntoView({behavior:"smooth",block:"start"});
  window.open(url,"_blank");
  twStop();
  TW.watch={action, code, title, since:Date.now(), timer:setInterval(twPoll,6000), tries:0};
  twStat("⏳ 等你在 GitHub 那頁按下綠色 <b>Submit new issue</b>…");
  twPoll();
}

// ── FinMind 公開 API（唯讀、免 token）與共用小工具 ────────────────────
const FM="https://api.finmindtrade.com/api/v4/data";
async function fmGet(dataset,id,start,end){
  const p=new URLSearchParams({dataset,start_date:start});
  if(id)p.set("data_id",id);
  if(end)p.set("end_date",end);
  const r=await fetch(FM+"?"+p.toString());
  const j=await r.json();
  if(j.status!==200) throw new Error("FinMind："+(j.msg||("狀態 "+j.status)));
  return j.data||[];
}
function pstdev(a){ if(!a.length)return 0; const m=a.reduce((x,y)=>x+y,0)/a.length; return Math.sqrt(a.reduce((s,v)=>s+(v-m)*(v-m),0)/a.length); }
function bclamp(x,lo=0,hi=100){ return Math.max(lo,Math.min(hi,x)); }
function shiftDays(iso,days){ const d=new Date(iso+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+days); return d.toISOString().slice(0,10); }
function shiftYears(iso,y){ const p=iso.split("-"); return String(+p[0]+y).padStart(4,"0")+"-"+p[1]+"-"+p[2]; }
// 月營收在 as_of 那天「知不知道」：法定期限是次月 10 日，多數公司更早。
// 若期限還沒到、但 FinMind 今天已經有這筆（＝已經公布了），就從「今天」起算可用——
// 這樣歷史點沒有偷看未來，最後一天又能跟 build_data.py（直接取最新一筆）對上。
function monthAvail(y,m,asof,today){
  let ny=y,nm=m+1; if(nm>12){ny++;nm=1;}
  const due=ny+"-"+String(nm).padStart(2,"0")+"-10";
  if(!today) today=new Date().toISOString().slice(0,10);
  return asof >= (due<=today ? due : today);
}

// ── 比較區間模式：標準（近 5 年）／客製（watchlist 的 @since）────────────
// 兩套數字都在 data.json 裡（client 端只是選要顯示哪一套），所以切換不用重算、不打 API。
let MODE = "std";
try{ MODE = localStorage.getItem("tw_mode") || "std"; }catch(_){}
function view(s){ return (MODE==="cust" && s && s.alt) ? Object.assign({}, s, s.alt) : s; }
function usingAlt(s){ return MODE==="cust" && !!(s && s.alt); }
function prevOf(d, s){            // ▲▼ 的基準要跟目前顯示的那一套對齊
  const p=d.prev||{};
  if(usingAlt(s) && p.stocks_alt && p.stocks_alt[s.code]!=null) return p.stocks_alt[s.code];
  return (p.stocks||{})[s.code];
}

// ── 變化量：跟「上一個交易日」比（build_data.py 寫進 data.json 的 prev）──
function deltaHTML(cur, prev){
  if(cur==null || prev==null) return "";
  const d=cur-prev;
  if(d===0) return '<span class="delta flat">–</span>';
  return `<span class="delta ${d>0?"up":"down"}">${d>0?"▲":"▼"}${Math.abs(d)}</span>`;
}
function moversHTML(d){
  const p=d.prev||{}, P=p.stocks||{};
  if(!p.date) return "";                       // 第一次產出、還沒有基準
  const mv=(d.stocks||[]).map(s=>({raw:s, v:view(s)}))
    .filter(({raw,v})=> v.composite!=null && prevOf(d,raw)!=null)
    .map(({raw,v})=>({n:v.name||v.code, v:v.composite-prevOf(d,raw)}))
    .filter(x=>x.v!==0).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)).slice(0,3);
  const bits=mv.map(x=>`<span class="mv-i">${x.n} <b class="${x.v>0?"up":"down"}">${x.v>0?"+":""}${x.v}</b></span>`);
  const mkd=(d.market&&d.market.score!=null&&p.market!=null)?d.market.score-p.market:null;
  if(mkd) bits.unshift(`<span class="mv-i">大盤 <b class="${mkd>0?"up":"down"}">${mkd>0?"+":""}${mkd}</b></span>`);
  return `<div class="movers"><span class="mv-t">今日變化</span>`+
         (bits.length?bits.join("　·　"):"跟上次一樣，沒有東西在動。")+
         `<span class="label" style="margin-left:auto">較 ${p.date}</span></div>`;
}

// 本益比位階尺：綠(便宜)→紅(貴)，標出中位數與現在的位置。
//
// [決策 2026-09-09｜需求人] 點的位置用「百分位」，不用 PER 的線性數值。
//   前提：PER 區間常被極端值撐爆——虧損轉盈時 EPS 趨近 0，PER 會噴到三、四位數
//     （實測：群創 2.3~1250、德宏 3.3~1391、富喬 7.7~268）。線性尺會被那個最大值
//     整條壓到最左邊，於是「比中位數貴」的股票卻畫在左半邊，看起來像在打折
//     （南亞科：位階 71%，線性位置卻只有 12%，方向相反）。
//   已知代價：尺上的距離不再等比於 PER 差距——中間擠了幾個月的資料，兩端可能各是
//     一兩天的極端值。要看絕對差距請看兩端標的實際 PER 數字。
//   ⇒ 排錯線索：中位數刻度固定在 50%（中位數＝第 50 百分位，這是定義不是硬寫死），
//     若哪天它不在正中間，是位階算錯了，不是這裡畫錯。
function perBlock(s){
  const lo=s.metric_min, hi=s.metric_max, md=s.metric_median, pctl=s.metric_pctl;
  if(lo==null||hi==null||pctl==null) return "";
  const pos=Math.max(3,Math.min(97,pctl));
  const words = pctl<=50 ? `比過去 <b>${100-pctl}%</b> 的日子便宜`
                         : `比過去 <b>${pctl}%</b> 的日子貴`;
  const win = s.metric_since ? `${s.metric_since.slice(0,7)} 起` : "近 5 年";
  const mName = s.metric==="pbr" ? "股價淨值比" : "本益比";
  return `<div class="perblk">
      <div class="perblk-t">${mName}位階（${win}）　現在 <b>${esc(s.metric_val)}</b>　${words}</div>
      <div class="perbar"><div class="tick" style="left:50%"></div>
        <div class="ping" style="left:${pos}%"></div>
        <div class="dot" style="left:${pos}%"></div></div>
      <div class="perscale"><span class="lo">便宜 ${lo}</span>`+
      `<span class="md" style="left:50%">中位 ${md}</span>`+
      `<span class="hi">貴 ${hi}</span></div>`+
      (s.metric_why?`<div class="perwhy">⚙ 這檔用${mName}，不用本益比：${s.metric_why}</div>`:"")+
      (s.since_why?`<div class="perwhy">⚙ 比較區間改過（${win}）：${s.since_why}</div>`:"")+
    `</div>`;
}

function modeSwitchHTML(d){
  const n=(d.stocks||[]).filter(s=>s.alt).length;
  if(!n) return "";                       // 沒人設 @since 就不用給這個選擇
  return `<div class="modesw"><span class="ms-t">比較區間</span>`+
    `<button data-mode="std" class="${MODE==="std"?"on":""}">近 5 年</button>`+
    `<button data-mode="cust" class="${MODE==="cust"?"on":""}">客製</button>`+
    `<span class="ms-n">${n} 檔有客製起算日</span></div>`;
}

// ── 一檔股票＝一個 <details>：收合是一列（整列可點）、展開才是細節 ──
function stockCard(s, prevScore, openByDefault){
  const dream = s.composite==null;
  const band  = dream?"dream" : s.composite>=65?"open" : s.composite>=45?"half" : "shut";
  const tag   = dream?"無法評分" : (s.label||"").split(/[（(]/)[0];
  const c = priceChg(s.spark);
  const acts  = `<div class="s-acts">
        <button class="act hslink" data-code="${s.code}">🕰 歷史回測</button>
        <button class="act rmlink" data-code="${s.code}">移除</button>
      </div>`;
  const row = `<summary class="s-row">
      <div class="r-main">
        <div class="r-name">${s.name||""}<span class="s-code">${s.code}</span></div>
        <div class="r-sub">現價 <b>${esc(s.price)}</b>${chgHTML(c.day)}${
          c.q3==null?"":`<span class="r-q3">近3月 ${chgTxt(c.q3)}</span>`}</div>
      </div>
      <div class="r-side">
        <div class="r-score ${band}">${dream?"本夢比":s.composite}${deltaHTML(s.composite,prevScore)}</div>
        <div class="r-tag">${tag}</div>
      </div>
      <span class="r-chev">▾</span>
    </summary>`;

  let body;
  if(dream){
    body = `<div class="s-body">
        <div class="s-line">${s.label} — 無本益比可評分，屬新藥/夢股，請用賭注 size 對待。${
          s.revenue_history&&s.revenue_history.length?" "+chartLink(s.code):""}</div>
        ${thesisHTML(s)}${acts}
      </div>`;
  }else{
    const yoyTxt = s.yoy==null?"—":(s.yoy>0?"+":"")+s.yoy+"%";
    const yoyCls = s.yoy==null?"":(s.yoy>=0?"pos":"neg");
    body = `<div class="s-body">
        <div class="s-line">${term('composite','進場時機')} <b>${s.composite}</b> / 100　·　${s.label}</div>
        <div class="data">
          <div class="d-item"><span class="d-k">${s.metric==="pbr"?term('pbr','PBR'):term('per','PER')}（${term('pctl','位階')}）</span><span class="d-v">${esc(s.metric_val)} · ${esc(s.metric_pctl)}%</span></div>
          <div class="d-item"><span class="d-k">${term('val_cheap','估值便宜度')}</span><span class="d-v">${esc(s.val_cheap)}</span></div>
          <div class="d-item"><span class="d-k">${chartLink(s.code)}</span><span class="d-v ${yoyCls}">${yoyTxt}</span></div>
          <div class="d-item"><span class="d-k">${term('fund','基本面')}</span><span class="d-v">${esc(s.fund)}</span></div>
          <div class="d-item full"><span class="d-k">${term('quality','財務指紋（品質）')}</span><span class="d-v">${qMeter(s.quality)}</span></div>
        </div>
        ${perBlock(s)}
        ${thesisHTML(s)}${acts}
      </div>`;
  }
  return `<details class="stock"${openByDefault?" open":""}>${row}${body}</details>`;
}

function render(d){
  window.DATA=d;
  const m=d.market||{};
  const gen=(d.generated_at||"").replace("T"," ").replace("+00:00"," UTC");
  document.getElementById("sub").textContent =
    "資料日 "+(m.date||"—")+"　·　產出 "+gen+"　·　溫度計，非投資建議";

  const app=document.getElementById("app");
  const markPct = Math.max(2,Math.min(98, m.score??50));
  app.innerHTML = `
    <div class="mktcard">
      <div class="label">${term('market','市場恐慌度')}（TAIEX）　<span class="mklink">看歷史</span></div>
      <div style="margin-top:2px"><span class="mkt-score" style="color:${mktColor(m.score)}">${esc(m.score)}</span>
        <span class="mkt-tag" style="color:${mktColor(m.score)}">${esc(m.tag)}</span>
        <span class="label"> / 100</span>${deltaHTML(m.score,(d.prev||{}).market)}</div>
      <div class="thermo"><div class="mark" style="left:${markPct}%"></div></div>
      <div class="scale"><span>← 貪婪（該收手）</span><span>恐慌（機會）→</span></div>
      <div class="stats">
        <span>大盤 <b>${esc(m.close)}</b></span>
        <span>乖離120 <b>${m.bias>0?"+":""}${esc(m.bias)}%</b></span>
        <span>距年高 <b>${esc(m.dd)}%</b></span>
        <span>20日波動 <b>${esc(m.vol)}%</b></span>
      </div>
      ${m.margin_note?`<div class="stats">${m.margin_note.split(" · ").map(x=>`<span>${x}</span>`).join("")}</div>`:""}
    </div>` + moversHTML(d);

  // 排序與分區都要用「目前這一套」的分數
  const V=d.stocks.map(x=>({raw:x, v:view(x)}));
  const scored=V.filter(x=>x.v.composite!=null).sort((a,b)=>b.v.composite-a.v.composite);
  const groups=[
    {k:"open", t:"打折中", n:"65 分以上", open:true,  list:scored.filter(x=>x.v.composite>=65),
     empty:"目前沒有落在打折區的標的——這正是「該等、別亂動」的時候。"},
    {k:"half", t:"觀察",   n:"45–64 分", open:false, list:scored.filter(x=>x.v.composite>=45&&x.v.composite<65)},
    {k:"shut", t:"太貴",   n:"低於 45 分", open:false, list:scored.filter(x=>x.v.composite<45)},
    {k:"dream",t:"本夢比", n:"無估值位階、不評分", open:false, list:V.filter(x=>x.v.composite==null)},
  ];
  let html=modeSwitchHTML(d);
  for(const g of groups){
    if(!g.list.length && !g.empty) continue;
    html+=`<div class="sec"><span class="sec-t ${g.k}">${g.t}</span>`+
          `<span class="sec-n">${g.list.length} 檔 · ${g.n}</span></div>`;
    if(!g.list.length){ html+=`<div class="sec-empty">${g.empty}</div>`; continue; }
    for(const x of g.list) html+=stockCard(x.v, prevOf(d,x.raw), g.open);
  }
  app.insertAdjacentHTML("beforeend", html);

  document.getElementById("glosslist").innerHTML =
    Object.values(GLOSSARY).map(v=>"<li>"+v+"</li>").join("")+
    "<li>今日變化 ▲▼：分數跟「上一個交易日」比。▲＝時機變好（更便宜／更恐慌），▼＝變差。同一天重跑不會洗掉基準。</li>"+
    "<li>分區：打折中（≥65）預設展開，觀察／太貴收成一列——點任一列展開細節。</li>"+
    "<li>營收動能📊：展開後點「營收動能」看歷年月營收與 YoY 成長率圖。</li>"+
    "<li>比較區間（標準／客製）：位階預設跟「自己近 5 年」比。少數股票在 <code>watchlist.txt</code> 設了 <code>@since</code> 起算日（業態變過、舊資料不可比），切到「客製」就改跟那一段比。<b>兩套數字都在，隨時可以對照</b>——縮短區間通常會讓股票看起來比較便宜，看得到標準版才不會騙自己。</li>"+
    "<li>股價漲跌：現價旁邊是「最新交易日」與「近 3 月」的漲跌幅。<b>紅漲綠跌</b>（台股慣例；在這裡剛好也一致——漲＝變貴＝紅）。資料每交易日收盤後更新，不是即時報價。</li>"+
    "<li>歷史回測🕰：展開後點「🕰 歷史回測」，會把同一套公式對過去每一個交易日各算一次。手指按著左右滑＝時光倒流到那一天，讀數就是當時的進場時機／PER 位階／營收 YoY／大盤恐慌。可切「進場時機／股價／疊圖」與 1～5 年。</li>"+
    "<li>論點：你自己記下「為什麼持有、什麼情況算論點破」。大跌時回來重讀，決定加碼還是認賠——治「看成本價捨不得賣」。</li>";

  const w=d.weights||{};
  document.getElementById("foot").innerHTML =
    `進場時機權重：估值便宜 ${w.value} ＋ 基本面 ${w.fund} ＋ 市場恐慌 ${w.market}（透明、未回測調參）。<br>`+
    (d.disclaimer||"");
}
