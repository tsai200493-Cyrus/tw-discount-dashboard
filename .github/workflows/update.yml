name: 更新打折窗口資料

# 觸發：① 外部定時器（cron-job.org 打 workflow_dispatch）② GitHub 排程當備援 ③ 改 watchlist 就重跑 ④ 手動按鈕
#
# [決策 2026-11-06｜需求人] 盤中暫估不用 GitHub 排程，改由外部定時器觸發。
#   前提：實測 GitHub 排程遲到 6～8 小時（11-05 盤中班到 21:26、22:29 才跑；11-06 盤中零次），盤中根本等不到。
#   已知代價：多一個外部帳號要顧，token 到期前要換；定時器停了盤中就不更新，但收盤資料仍有下面的備援班。
#   ⇒ 排錯線索：盤中沒更新先看 cron-job.org 的執行紀錄（401／403＝token 過期或權限不對）。
on:
  schedule:
    - cron: "0 10 * * 1-5"      # 正式資料的備援班：排台灣 18:00，實際常到半夜才跑；外部定時器掛了也還有收盤資料
  workflow_dispatch:             # 外部定時器打這裡；Actions 頁面也可手動 Run
    inputs:
      live:
        description: "盤中暫估（用證交所即時報價）"
        type: boolean
        default: false
  push:
    paths:
      - "watchlist.txt"          # 加/刪股票就自動重算
      - "thesis.json"            # 改論點就重算（把新論點帶進 data.json）
      - "scripts/**"             # 改算法（build_data.py）就自動重算

permissions:
  contents: write                # 允許把新的 data.json 推回 repo
  issues: write                  # 允許恐慌度警鈴開 Issue（推播用）

concurrency:                     # 避免多次觸發互相打架
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 盤中＝觸發時帶 live=true。其他觸發都是正式版。
      LIVE: ${{ inputs.live && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 產生 docs/data.json
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}   # 在 repo Settings → Secrets 設定
        run: python scripts/build_data.py

      # 恐慌度警鈴：跨過門檻才開 Issue，遲滯邏輯在 alert.py 裡
      # 盤中不叫：盤中分數會上下跳，叫了之後收盤又掉回去，鈴就白白用掉了（要跌回上膛線才會再叫）
      - name: 檢查恐慌度警鈴
        id: alert
        if: env.LIVE != '1'
        run: python scripts/alert.py

      # 先開 Issue 再 commit 狀態：萬一 commit 失敗，明天會重叫一次（吵）；
      # 反過來則會整段靜音（漏掉窗口）。寧可吵不可漏。
      - name: 警鈴響了就開 Issue
        if: steps.alert.outputs.fire == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 指派給自己：不管 repo 的 Watch 設定是「All activity」還是「Participating only」，
          # 被指派一定會收到通知。少了這行，Watch 設成 participating 的人會整段收不到。
          gh issue create \
            --title "$(cat alert_title.txt)" \
            --body-file alert_body.md \
            --assignee "${{ github.repository_owner }}"

      - name: 有變動才 commit + push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f alert_title.txt alert_body.md
          git add docs/data.json alert_state.json
          msg="chore: 更新打折窗口資料"
          [ "$LIVE" = "1" ] && msg="chore: 盤中暫估"
          git diff --staged --quiet || git commit -m "$msg [skip ci]"
          git pull --rebase -q origin main   # 定時器班次變多，跑的這一兩分鐘內你可能剛好推了東西
          git push
